const PASSAGES_w45 = [{"id":"eze1","book":"Ezekiel 1","heading":"Visions of God","verses":[[1,"Now it came to pass in the thirtieth year, in the fourth month, in the fifth day of the month, as I was among the captives by the river of Chebar, that the heavens were opened, and I saw visions of God."],[2,"In the fifth day of the month, which was the fifth year of king Jehoiachin's captivity,"],[3,"The word of the LORD came expressly unto Ezekiel the priest, the son of Buzi, in the land of the Chaldeans by the river Chebar; and the hand of the LORD was there upon him."],[4,"And I looked, and, behold, a whirlwind came out of the north, a great cloud, and a fire infolding itself, and a brightness was about it, and out of the midst thereof as the colour of amber, out of the midst of the fire."],[5,"Also out of the midst thereof came the likeness of four living creatures. And this was their appearance; they had the likeness of a man."],[6,"And every one had four faces, and every one had four wings."],[7,"And their feet were straight feet; and the sole of their feet was like the sole of a calf's foot: and they sparkled like the colour of burnished brass."],[8,"And they had the hands of a man under their wings on their four sides; and they four had their faces and their wings."],[9,"Their wings were joined one to another; they turned not when they went; they went every one straight forward."],[10,"As for the likeness of their faces, they four had the face of a man, and the face of a lion, on the right side: and they four had the face of an ox on the left side; they four also had the face of an eagle."],[11,"Thus were their faces: and their wings were stretched upward; two wings of every one were joined one to another, and two covered their bodies."],[12,"And they went every one straight forward: whither the spirit was to go, they went; and they turned not when they went."],[13,"As for the likeness of the living creatures, their appearance was like burning coals of fire, and like the appearance of lamps: it went up and down among the living creatures; and the fire was bright, and out of the fire went forth lightning."],[14,"And the living creatures ran and returned as the appearance of a flash of lightning."],[15,"Now as I beheld the living creatures, behold one wheel upon the earth by the living creatures, with his four faces."],[16,"The appearance of the wheels and their work was like unto the colour of a beryl: and they four had one likeness: and their appearance and their work was as it were a wheel in the middle of a wheel."],[17,"When they went, they went upon their four sides: and they turned not when they went."],[18,"As for their rings, they were so high that they were dreadful; and their rings were full of eyes round about them four."],[19,"And when the living creatures went, the wheels went by them: and when the living creatures were lifted up from the earth, the wheels were lifted up."],[20,"Whithersoever the spirit was to go, they went, thither was their spirit to go; and the wheels were lifted up over against them: for the spirit of the living creature was in the wheels."],[21,"When those went, these went; and when those stood, these stood; and when those were lifted up from the earth, the wheels were lifted up over against them: for the spirit of the living creature was in the wheels."],[22,"And the likeness of the firmament upon the heads of the living creature was as the colour of the terrible crystal, stretched forth over their heads above."],[23,"And under the firmament were their wings straight, the one toward the other: every one had two, which covered on this side, and every one had two, which covered on that side, their bodies."],[24,"And when they went, I heard the noise of their wings, like the noise of great waters, as the voice of the Almighty, the voice of speech, as the noise of an host: when they stood, they let down their wings."],[25,"And there was a voice from the firmament that was over their heads, when they stood, and had let down their wings."],[26,"And above the firmament that was over their heads was the likeness of a throne, as the appearance of a sapphire stone: and upon the likeness of the throne was the likeness as the appearance of a man above upon it."],[27,"And I saw as the colour of amber, as the appearance of fire round about within it, from the appearance of his loins even upward, and from the appearance of his loins even downward, I saw as it were the appearance of fire, and it had brightness round about."],[28,"As the appearance of the bow that is in the cloud in the day of rain, so was the appearance of the brightness round about. This was the appearance of the likeness of the glory of the LORD. And when I saw it, I fell upon my face, and I heard a voice of one that spake."]]},{"id":"eze2","book":"Ezekiel 2","heading":"Son of Man, Stand upon Thy Feet","verses":[[1,"And he said unto me, Son of man, stand upon thy feet, and I will speak unto thee."],[2,"And the spirit entered into me when he spake unto me, and set me upon my feet, that I heard him that spake unto me."],[3,"And he said unto me, Son of man, I send thee to the children of Israel, to a rebellious nation that hath rebelled against me: they and their fathers have transgressed against me, even unto this very day."],[4,"For they are impudent children and stiffhearted. I do send thee unto them; and thou shalt say unto them, Thus saith the Lord GOD."],[5,"And they, whether they will hear, or whether they will forbear, (for they are a rebellious house,) yet shall know that there hath been a prophet among them."],[6,"And thou, son of man, be not afraid of them, neither be afraid of their words, though briers and thorns be with thee, and thou dost dwell among scorpions: be not afraid of their words, nor be dismayed at their looks, though they be a rebellious house."],[7,"And thou shalt speak my words unto them, whether they will hear, or whether they will forbear: for they are most rebellious."],[8,"But thou, son of man, hear what I say unto thee; Be not thou rebellious like that rebellious house: open thy mouth, and eat that I give thee."],[9,"And when I looked, behold, an hand was sent unto me; and, lo, a roll of a book was therein;"],[10,"And he spread it before me; and it was written within and without: and there was written therein lamentations, and mourning, and woe."]]},{"id":"eze3","book":"Ezekiel 3","heading":"A Watchman unto the House of Israel","verses":[[1,"Moreover he said unto me, Son of man, eat that thou findest; eat this roll, and go speak unto the house of Israel."],[2,"So I opened my mouth, and he caused me to eat that roll."],[3,"And he said unto me, Son of man, cause thy belly to eat, and fill thy bowels with this roll that I give thee. Then did I eat it; and it was in my mouth as honey for sweetness."],[4,"And he said unto me, Son of man, go, get thee unto the house of Israel, and speak with my words unto them."],[5,"For thou art not sent to a people of a strange speech and of an hard language, but to the house of Israel;"],[6,"Not to many people of a strange speech and of an hard language, whose words thou canst not understand. Surely, had I sent thee to them, they would have hearkened unto thee."],[7,"But the house of Israel will not hearken unto thee; for they will not hearken unto me: for all the house of Israel are impudent and hardhearted."],[8,"Behold, I have made thy face strong against their faces, and thy forehead strong against their foreheads."],[9,"As an adamant harder than flint have I made thy forehead: fear them not, neither be dismayed at their looks, though they be a rebellious house."],[10,"Moreover he said unto me, Son of man, all my words that I shall speak unto thee receive in thine heart, and hear with thine ears."],[11,"And go, get thee to them of the captivity, unto the children of thy people, and speak unto them, and tell them, Thus saith the Lord GOD; whether they will hear, or whether they will forbear."],[12,"Then the spirit took me up, and I heard behind me a voice of a great rushing, saying, Blessed be the glory of the LORD from his place."],[13,"I heard also the noise of the wings of the living creatures that touched one another, and the noise of the wheels over against them, and a noise of a great rushing."],[14,"So the spirit lifted me up, and took me away, and I went in bitterness, in the heat of my spirit; but the hand of the LORD was strong upon me."],[15,"Then I came to them of the captivity at Telabib, that dwelt by the river of Chebar, and I sat where they sat, and remained there astonished among them seven days."],[16,"And it came to pass at the end of seven days, that the word of the LORD came unto me, saying,"],[17,"Son of man, I have made thee a watchman unto the house of Israel: therefore hear the word at my mouth, and give them warning from me."],[18,"When I say unto the wicked, Thou shalt surely die; and thou givest him not warning, nor speakest to warn the wicked from his wicked way, to save his life; the same wicked man shall die in his iniquity; but his blood will I require at thine hand."],[19,"Yet if thou warn the wicked, and he turn not from his wickedness, nor from his wicked way, he shall die in his iniquity; but thou hast delivered thy soul."],[20,"Again, When a righteous man doth turn from his righteousness, and commit iniquity, and I lay a stumblingblock before him, he shall die: because thou hast not given him warning, he shall die in his sin, and his righteousness which he hath done shall not be remembered; but his blood will I require at thine hand."],[21,"Nevertheless if thou warn the righteous man, that the righteous sin not, and he doth not sin, he shall surely live, because he is warned; also thou hast delivered thy soul."],[22,"And the hand of the LORD was there upon me; and he said unto me, Arise, go forth into the plain, and I will there talk with thee."],[23,"Then I arose, and went forth into the plain: and, behold, the glory of the LORD stood there, as the glory which I saw by the river of Chebar: and I fell on my face."],[24,"Then the spirit entered into me, and set me upon my feet, and spake with me, and said unto me, Go, shut thyself within thine house."],[25,"But thou, O son of man, behold, they shall put bands upon thee, and shall bind thee with them, and thou shalt not go out among them:"],[26,"And I will make thy tongue cleave to the roof of thy mouth, that thou shalt be dumb, and shalt not be to them a reprover: for they are a rebellious house."],[27,"But when I speak with thee, I will open thy mouth, and thou shalt say unto them, Thus saith the Lord GOD; He that heareth, let him hear; and he that forbeareth, let him forbear: for they are a rebellious house."]]},{"id":"eze33","book":"Ezekiel 33","heading":"The Watchman's Duty","verses":[[1,"Again the word of the LORD came unto me, saying,"],[2,"Son of man, speak to the children of thy people, and say unto them, When I bring the sword upon a land, if the people of the land take a man of their coasts, and set him for their watchman:"],[3,"If when he seeth the sword come upon the land, he blow the trumpet, and warn the people;"],[4,"Then whosoever heareth the sound of the trumpet, and taketh not warning; if the sword come, and take him away, his blood shall be upon his own head."],[5,"He heard the sound of the trumpet, and took not warning; his blood shall be upon him. But he that taketh warning shall deliver his soul."],[6,"But if the watchman see the sword come, and blow not the trumpet, and the people be not warned; if the sword come, and take any person from among them, he is taken away in his iniquity; but his blood will I require at the watchman's hand."],[7,"So thou, O son of man, I have set thee a watchman unto the house of Israel; therefore thou shalt hear the word at my mouth, and warn them from me."],[8,"When I say unto the wicked, O wicked man, thou shalt surely die; if thou dost not speak to warn the wicked from his way, that wicked man shall die in his iniquity; but his blood will I require at thine hand."],[9,"Nevertheless, if thou warn the wicked of his way to turn from it; if he do not turn from his way, he shall die in his iniquity; but thou hast delivered thy soul."],[10,"Therefore, O thou son of man, speak unto the house of Israel; Thus ye speak, saying, If our transgressions and our sins be upon us, and we pine away in them, how should we then live?"],[11,"Say unto them, As I live, saith the Lord GOD, I have no pleasure in the death of the wicked; but that the wicked turn from his way and live: turn ye, turn ye from your evil ways; for why will ye die, O house of Israel?"],[12,"Therefore, thou son of man, say unto the children of thy people, The righteousness of the righteous shall not deliver him in the day of his transgression: as for the wickedness of the wicked, he shall not fall thereby in the day that he turneth from his wickedness; neither shall the righteous be able to live for his righteousness in the day that he sinneth."],[13,"When I shall say to the righteous, that he shall surely live; if he trust to his own righteousness, and commit iniquity, all his righteousnesses shall not be remembered; but for his iniquity that he hath committed, he shall die for it."],[14,"Again, when I say unto the wicked, Thou shalt surely die; if he turn from his sin, and do that which is lawful and right;"],[15,"If the wicked restore the pledge, give again that he had robbed, walk in the statutes of life, without committing iniquity; he shall surely live, he shall not die."],[16,"None of his sins that he hath committed shall be mentioned unto him: he hath done that which is lawful and right; he shall surely live."],[17,"Yet the children of thy people say, The way of the Lord is not equal: but as for them, their way is not equal."],[18,"When the righteous turneth from his righteousness, and committeth iniquity, he shall even die thereby."],[19,"But if the wicked turn from his wickedness, and do that which is lawful and right, he shall live thereby."],[20,"Yet ye say, The way of the Lord is not equal. O ye house of Israel, I will judge you every one after his ways."],[21,"And it came to pass in the twelfth year of our captivity, in the tenth month, in the fifth day of the month, that one that had escaped out of Jerusalem came unto me, saying, The city is smitten."],[22,"Now the hand of the LORD was upon me in the evening, afore he that was escaped came; and had opened my mouth, until he came to me in the morning; and my mouth was opened, and I was no more dumb."],[23,"Then the word of the LORD came unto me, saying,"],[24,"Son of man, they that inhabit those wastes of the land of Israel speak, saying, Abraham was one, and he inherited the land: but we are many; the land is given us for inheritance."],[25,"Wherefore say unto them, Thus saith the Lord GOD; Ye eat with the blood, and lift up your eyes toward your idols, and shed blood: and shall ye possess the land?"],[26,"Ye stand upon your sword, ye work abomination, and ye defile every one his neighbour's wife: and shall ye possess the land?"],[27,"Say thou thus unto them, Thus saith the Lord GOD; As I live, surely they that are in the wastes shall fall by the sword, and him that is in the open field will I give to the beasts to be devoured, and they that be in the forts and in the caves shall die of the pestilence."],[28,"For I will lay the land most desolate, and the pomp of her strength shall cease; and the mountains of Israel shall be desolate, that none shall pass through."],[29,"Then shall they know that I am the LORD, when I have laid the land most desolate because of all their abominations which they have committed."],[30,"Also, thou son of man, the children of thy people still are talking against thee by the walls and in the doors of the houses, and speak one to another, every one to his brother, saying, Come, I pray you, and hear what is the word that cometh forth from the LORD."],[31,"And they come unto thee as the people cometh, and they sit before thee as my people, and they hear thy words, but they will not do them: for with their mouth they shew much love, but their heart goeth after their covetousness."],[32,"And, lo, thou art unto them as a very lovely song of one that hath a pleasant voice, and can play well on an instrument: for they hear thy words, but they do them not."],[33,"And when this cometh to pass, (lo, it will come,) then shall they know that a prophet hath been among them."]]},{"id":"eze34","book":"Ezekiel 34","heading":"The Shepherds of Israel","verses":[[1,"And the word of the LORD came unto me, saying,"],[2,"Son of man, prophesy against the shepherds of Israel, prophesy, and say unto them, Thus saith the Lord GOD unto the shepherds; Woe be to the shepherds of Israel that do feed themselves! should not the shepherds feed the flocks?"],[3,"Ye eat the fat, and ye clothe you with the wool, ye kill them that are fed: but ye feed not the flock."],[4,"The diseased have ye not strengthened, neither have ye healed that which was sick, neither have ye bound up that which was broken, neither have ye brought again that which was driven away, neither have ye sought that which was lost; but with force and with cruelty have ye ruled them."],[5,"And they were scattered, because there is no shepherd: and they became meat to all the beasts of the field, when they were scattered."],[6,"My sheep wandered through all the mountains, and upon every high hill: yea, my flock was scattered upon all the face of the earth, and none did search or seek after them."],[7,"Therefore, ye shepherds, hear the word of the LORD;"],[8,"As I live, saith the Lord GOD, surely because my flock became a prey, and my flock became meat to every beast of the field, because there was no shepherd, neither did my shepherds search for my flock, but the shepherds fed themselves, and fed not my flock;"],[9,"Therefore, O ye shepherds, hear the word of the LORD;"],[10,"Thus saith the Lord GOD; Behold, I am against the shepherds; and I will require my flock at their hand, and cause them to cease from feeding the flock; neither shall the shepherds feed themselves any more; for I will deliver my flock from their mouth, that they may not be meat for them."],[11,"For thus saith the Lord GOD; Behold, I, even I, will both search my sheep, and seek them out."],[12,"As a shepherd seeketh out his flock in the day that he is among his sheep that are scattered; so will I seek out my sheep, and will deliver them out of all places where they have been scattered in the cloudy and dark day."],[13,"And I will bring them out from the people, and gather them from the countries, and will bring them to their own land, and feed them upon the mountains of Israel by the rivers, and in all the inhabited places of the country."],[14,"I will feed them in a good pasture, and upon the high mountains of Israel shall their fold be: there shall they lie in a good fold, and in a fat pasture shall they feed upon the mountains of Israel."],[15,"I will feed my flock, and I will cause them to lie down, saith the Lord GOD."],[16,"I will seek that which was lost, and bring again that which was driven away, and will bind up that which was broken, and will strengthen that which was sick: but I will destroy the fat and the strong; I will feed them with judgment."],[17,"And as for you, O my flock, thus saith the Lord GOD; Behold, I judge between cattle and cattle, between the rams and the he goats."],[18,"Seemeth it a small thing unto you to have eaten up the good pasture, but ye must tread down with your feet the residue of your pastures? and to have drunk of the deep waters, but ye must foul the residue with your feet?"],[19,"And as for my flock, they eat that which ye have trodden with your feet; and they drink that which ye have fouled with your feet."],[20,"Therefore thus saith the Lord GOD unto them; Behold, I, even I, will judge between the fat cattle and between the lean cattle."],[21,"Because ye have thrust with side and with shoulder, and pushed all the diseased with your horns, till ye have scattered them abroad;"],[22,"Therefore will I save my flock, and they shall no more be a prey; and I will judge between cattle and cattle."],[23,"And I will set up one shepherd over them, and he shall feed them, even my servant David; he shall feed them, and he shall be their shepherd."],[24,"And I the LORD will be their God, and my servant David a prince among them; I the LORD have spoken it."],[25,"And I will make with them a covenant of peace, and will cause the evil beasts to cease out of the land: and they shall dwell safely in the wilderness, and sleep in the woods."],[26,"And I will make them and the places round about my hill a blessing; and I will cause the shower to come down in his season; there shall be showers of blessing."],[27,"And the tree of the field shall yield her fruit, and the earth shall yield her increase, and they shall be safe in their land, and shall know that I am the LORD, when I have broken the bands of their yoke, and delivered them out of the hand of those that served themselves of them."],[28,"And they shall no more be a prey to the heathen, neither shall the beast of the land devour them; but they shall dwell safely, and none shall make them afraid."],[29,"And I will raise up for them a plant of renown, and they shall be no more consumed with hunger in the land, neither bear the shame of the heathen any more."],[30,"Thus shall they know that I the LORD their God am with them, and that they, even the house of Israel, are my people, saith the Lord GOD."],[31,"And ye my flock, the flock of my pasture, are men, and I am your God, saith the Lord GOD."]]},{"id":"eze36","book":"Ezekiel 36","heading":"A New Heart and a New Spirit","verses":[[1,"Also, thou son of man, prophesy unto the mountains of Israel, and say, Ye mountains of Israel, hear the word of the LORD:"],[2,"Thus saith the Lord GOD; Because the enemy hath said against you, Aha, even the ancient high places are our's in possession:"],[3,"Therefore prophesy and say, Thus saith the Lord GOD; Because they have made you desolate, and swallowed you up on every side, that ye might be a possession unto the residue of the heathen, and ye are taken up in the lips of talkers, and are an infamy of the people:"],[4,"Therefore, ye mountains of Israel, hear the word of the Lord GOD; Thus saith the Lord GOD to the mountains, and to the hills, to the rivers, and to the valleys, to the desolate wastes, and to the cities that are forsaken, which became a prey and derision to the residue of the heathen that are round about;"],[5,"Therefore thus saith the Lord GOD; Surely in the fire of my jealousy have I spoken against the residue of the heathen, and against all Idumea, which have appointed my land into their possession with the joy of all their heart, with despiteful minds, to cast it out for a prey."],[6,"Prophesy therefore concerning the land of Israel, and say unto the mountains, and to the hills, to the rivers, and to the valleys, Thus saith the Lord GOD; Behold, I have spoken in my jealousy and in my fury, because ye have borne the shame of the heathen:"],[7,"Therefore thus saith the Lord GOD; I have lifted up mine hand, Surely the heathen that are about you, they shall bear their shame."],[8,"But ye, O mountains of Israel, ye shall shoot forth your branches, and yield your fruit to my people of Israel; for they are at hand to come."],[9,"For, behold, I am for you, and I will turn unto you, and ye shall be tilled and sown:"],[10,"And I will multiply men upon you, all the house of Israel, even all of it: and the cities shall be inhabited, and the wastes shall be builded:"],[11,"And I will multiply upon you man and beast; and they shall increase and bring fruit: and I will settle you after your old estates, and will do better unto you than at your beginnings: and ye shall know that I am the LORD."],[12,"Yea, I will cause men to walk upon you, even my people Israel; and they shall possess thee, and thou shalt be their inheritance, and thou shalt no more henceforth bereave them of men."],[13,"Thus saith the Lord GOD; Because they say unto you, Thou land devourest up men, and hast bereaved thy nations;"],[14,"Therefore thou shalt devour men no more, neither bereave thy nations any more, saith the Lord GOD."],[15,"Neither will I cause men to hear in thee the shame of the heathen any more, neither shalt thou bear the reproach of the people any more, neither shalt thou cause thy nations to fall any more, saith the Lord GOD."],[16,"Moreover the word of the LORD came unto me, saying,"],[17,"Son of man, when the house of Israel dwelt in their own land, they defiled it by their own way and by their doings: their way was before me as the uncleanness of a removed woman."],[18,"Wherefore I poured my fury upon them for the blood that they had shed upon the land, and for their idols wherewith they had polluted it:"],[19,"And I scattered them among the heathen, and they were dispersed through the countries: according to their way and according to their doings I judged them."],[20,"And when they entered unto the heathen, whither they went, they profaned my holy name, when they said to them, These are the people of the LORD, and are gone forth out of his land."],[21,"But I had pity for mine holy name, which the house of Israel had profaned among the heathen, whither they went."],[22,"Therefore say unto the house of Israel, Thus saith the Lord GOD; I do not this for your sakes, O house of Israel, but for mine holy name's sake, which ye have profaned among the heathen, whither ye went."],[23,"And I will sanctify my great name, which was profaned among the heathen, which ye have profaned in the midst of them; and the heathen shall know that I am the LORD, saith the Lord GOD, when I shall be sanctified in you before their eyes."],[24,"For I will take you from among the heathen, and gather you out of all countries, and will bring you into your own land."],[25,"Then will I sprinkle clean water upon you, and ye shall be clean: from all your filthiness, and from all your idols, will I cleanse you."],[26,"A new heart also will I give you, and a new spirit will I put within you: and I will take away the stony heart out of your flesh, and I will give you an heart of flesh."],[27,"And I will put my spirit within you, and cause you to walk in my statutes, and ye shall keep my judgments, and do them."],[28,"And ye shall dwell in the land that I gave to your fathers; and ye shall be my people, and I will be your God."],[29,"I will also save you from all your uncleannesses: and I will call for the corn, and will increase it, and lay no famine upon you."],[30,"And I will multiply the fruit of the tree, and the increase of the field, that ye shall receive no more reproach of famine among the heathen."],[31,"Then shall ye remember your own evil ways, and your doings that were not good, and shall lothe yourselves in your own sight for your iniquities and for your abominations."],[32,"Not for your sakes do I this, saith the Lord GOD, be it known unto you: be ashamed and confounded for your own ways, O house of Israel."],[33,"Thus saith the Lord GOD; In the day that I shall have cleansed you from all your iniquities I will also cause you to dwell in the cities, and the wastes shall be builded."],[34,"And the desolate land shall be tilled, whereas it lay desolate in the sight of all that passed by."],[35,"And they shall say, This land that was desolate is become like the garden of Eden; and the waste and desolate and ruined cities are become fenced, and are inhabited."],[36,"Then the heathen that are left round about you shall know that I the LORD build the ruined places, and plant that that was desolate: I the LORD have spoken it, and I will do it."],[37,"Thus saith the Lord GOD; I will yet for this be enquired of by the house of Israel, to do it for them; I will increase them with men like a flock."],[38,"As the holy flock, as the flock of Jerusalem in her solemn feasts; so shall the waste cities be filled with flocks of men: and they shall know that I am the LORD."]]},{"id":"eze37","book":"Ezekiel 37","heading":"The Valley of Dry Bones; Two Sticks","verses":[[1,"The hand of the LORD was upon me, and carried me out in the spirit of the LORD, and set me down in the midst of the valley which was full of bones,"],[2,"And caused me to pass by them round about: and, behold, there were very many in the open valley; and, lo, they were very dry."],[3,"And he said unto me, Son of man, can these bones live? And I answered, O Lord GOD, thou knowest."],[4,"Again he said unto me, Prophesy upon these bones, and say unto them, O ye dry bones, hear the word of the LORD."],[5,"Thus saith the Lord GOD unto these bones; Behold, I will cause breath to enter into you, and ye shall live:"],[6,"And I will lay sinews upon you, and will bring up flesh upon you, and cover you with skin, and put breath in you, and ye shall live; and ye shall know that I am the LORD."],[7,"So I prophesied as I was commanded: and as I prophesied, there was a noise, and behold a shaking, and the bones came together, bone to his bone."],[8,"And when I beheld, lo, the sinews and the flesh came up upon them, and the skin covered them above: but there was no breath in them."],[9,"Then said he unto me, Prophesy unto the wind, prophesy, son of man, and say to the wind, Thus saith the Lord GOD; Come from the four winds, O breath, and breathe upon these slain, that they may live."],[10,"So I prophesied as he commanded me, and the breath came into them, and they lived, and stood up upon their feet, an exceeding great army."],[11,"Then he said unto me, Son of man, these bones are the whole house of Israel: behold, they say, Our bones are dried, and our hope is lost: we are cut off for our parts."],[12,"Therefore prophesy and say unto them, Thus saith the Lord GOD; Behold, O my people, I will open your graves, and cause you to come up out of your graves, and bring you into the land of Israel."],[13,"And ye shall know that I am the LORD, when I have opened your graves, O my people, and brought you up out of your graves,"],[14,"And shall put my spirit in you, and ye shall live, and I shall place you in your own land: then shall ye know that I the LORD have spoken it, and performed it, saith the LORD."],[15,"The word of the LORD came again unto me, saying,"],[16,"Moreover, thou son of man, take thee one stick, and write upon it, For Judah, and for the children of Israel his companions: then take another stick, and write upon it, For Joseph, the stick of Ephraim, and for all the house of Israel his companions:"],[17,"And join them one to another into one stick; and they shall become one in thine hand."],[18,"And when the children of thy people shall speak unto thee, saying, Wilt thou not shew us what thou meanest by these?"],[19,"Say unto them, Thus saith the Lord GOD; Behold, I will take the stick of Joseph, which is in the hand of Ephraim, and the tribes of Israel his fellows, and will put them with him, even with the stick of Judah, and make them one stick, and they shall be one in mine hand."],[20,"And the sticks whereon thou writest shall be in thine hand before their eyes."],[21,"And say unto them, Thus saith the Lord GOD; Behold, I will take the children of Israel from among the heathen, whither they be gone, and will gather them on every side, and bring them into their own land:"],[22,"And I will make them one nation in the land upon the mountains of Israel; and one king shall be king to them all: and they shall be no more two nations, neither shall they be divided into two kingdoms any more at all:"],[23,"Neither shall they defile themselves any more with their idols, nor with their detestable things, nor with any of their transgressions: but I will save them out of all their dwellingplaces, wherein they have sinned, and will cleanse them: so shall they be my people, and I will be their God."],[24,"And David my servant shall be king over them; and they all shall have one shepherd: they shall also walk in my judgments, and observe my statutes, and do them."],[25,"And they shall dwell in the land that I have given unto Jacob my servant, wherein your fathers have dwelt; and they shall dwell therein, even they, and their children, and their children's children for ever: and my servant David shall be their prince for ever."],[26,"Moreover I will make a covenant of peace with them; it shall be an everlasting covenant with them: and I will place them, and multiply them, and will set my sanctuary in the midst of them for evermore."],[27,"My tabernacle also shall be with them: yea, I will be their God, and they shall be my people."],[28,"And the heathen shall know that I the LORD do sanctify Israel, when my sanctuary shall be in the midst of them for evermore."]]},{"id":"eze47","book":"Ezekiel 47","heading":"Waters from the Temple","verses":[[1,"Afterward he brought me again unto the door of the house; and, behold, waters issued out from under the threshold of the house eastward: for the forefront of the house stood toward the east, and the waters came down from under from the right side of the house, at the south side of the altar."],[2,"Then brought he me out of the way of the gate northward, and led me about the way without unto the utter gate by the way that looketh eastward; and, behold, there ran out waters on the right side."],[3,"And when the man that had the line in his hand went forth eastward, he measured a thousand cubits, and he brought me through the waters; the waters were to the ancles."],[4,"Again he measured a thousand, and brought me through the waters; the waters were to the knees. Again he measured a thousand, and brought me through; the waters were to the loins."],[5,"Afterward he measured a thousand; and it was a river that I could not pass over: for the waters were risen, waters to swim in, a river that could not be passed over."],[6,"And he said unto me, Son of man, hast thou seen this? Then he brought me, and caused me to return to the brink of the river."],[7,"Now when I had returned, behold, at the bank of the river were very many trees on the one side and on the other."],[8,"Then said he unto me, These waters issue out toward the east country, and go down into the desert, and go into the sea: which being brought forth into the sea, the waters shall be healed."],[9,"And it shall come to pass, that every thing that liveth, which moveth, whithersoever the rivers shall come, shall live: and there shall be a very great multitude of fish, because these waters shall come thither: for they shall be healed; and every thing shall live whither the river cometh."],[10,"And it shall come to pass, that the fishers shall stand upon it from Engedi even unto Eneglaim; they shall be a place to spread forth nets; their fish shall be according to their kinds, as the fish of the great sea, exceeding many."],[11,"But the miry places thereof and the marishes thereof shall not be healed; they shall be given to salt."],[12,"And by the river upon the bank thereof, on this side and on that side, shall grow all trees for meat, whose leaf shall not fade, neither shall the fruit thereof be consumed: it shall bring forth new fruit according to his months, because their waters they issued out of the sanctuary: and the fruit thereof shall be for meat, and the leaf thereof for medicine."],[13,"Thus saith the Lord GOD; This shall be the border, whereby ye shall inherit the land according to the twelve tribes of Israel: Joseph shall have two portions."],[14,"And ye shall inherit it, one as well as another: concerning the which I lifted up mine hand to give it unto your fathers: and this land shall fall unto you for inheritance."],[15,"And this shall be the border of the land toward the north side, from the great sea, the way of Hethlon, as men go to Zedad;"],[16,"Hamath, Berothah, Sibraim, which is between the border of Damascus and the border of Hamath; Hazarhatticon, which is by the coast of Hauran."],[17,"And the border from the sea shall be Hazarenan, the border of Damascus, and the north northward, and the border of Hamath. And this is the north side."],[18,"And the east side ye shall measure from Hauran, and from Damascus, and from Gilead, and from the land of Israel by Jordan, from the border unto the east sea. And this is the east side."],[19,"And the south side southward, from Tamar even to the waters of strife in Kadesh, the river to the great sea. And this is the south side southward."],[20,"The west side also shall be the great sea from the border, till a man come over against Hamath. This is the west side."],[21,"So shall ye divide this land unto you according to the tribes of Israel."],[22,"And it shall come to pass, that ye shall divide it by lot for an inheritance unto you, and to the strangers that sojourn among you, which shall beget children among you: and they shall be unto you as born in the country among the children of Israel; they shall have inheritance with you among the tribes of Israel."],[23,"And it shall come to pass, that in what tribe the stranger sojourneth, there shall ye give him his inheritance, saith the Lord GOD."]]}];

const WEEK_w46 = {"dateRange":"Nov 9–15","title":"“There Is No Other God That Can Deliver”","refLabel":"Daniel 1–7"};
const PASSAGES_w46 = [{"id":"dan1","book":"Daniel 1","heading":"Daniel Will Not Defile Himself","verses":[[1,"In the third year of the reign of Jehoiakim king of Judah came Nebuchadnezzar king of Babylon unto Jerusalem, and besieged it."],[2,"And the Lord gave Jehoiakim king of Judah into his hand, with part of the vessels of the house of God: which he carried into the land of Shinar to the house of his god; and he brought the vessels into the treasure house of his god."],[3,"And the king spake unto Ashpenaz the master of his eunuchs, that he should bring certain of the children of Israel, and of the king's seed, and of the princes;"],[4,"Children in whom was no blemish, but well favoured, and skilful in all wisdom, and cunning in knowledge, and understanding science, and such as had ability in them to stand in the king's palace, and whom they might teach the learning and the tongue of the Chaldeans."],[5,"And the king appointed them a daily provision of the king's meat, and of the wine which he drank: so nourishing them three years, that at the end thereof they might stand before the king."],[6,"Now among these were of the children of Judah, Daniel, Hananiah, Mishael, and Azariah:"],[7,"Unto whom the prince of the eunuchs gave names: for he gave unto Daniel the name of Belteshazzar; and to Hananiah, of Shadrach; and to Mishael, of Meshach; and to Azariah, of Abednego."],[8,"But Daniel purposed in his heart that he would not defile himself with the portion of the king's meat, nor with the wine which he drank: therefore he requested of the prince of the eunuchs that he might not defile himself."],[9,"Now God had brought Daniel into favour and tender love with the prince of the eunuchs."],[10,"And the prince of the eunuchs said unto Daniel, I fear my lord the king, who hath appointed your meat and your drink: for why should he see your faces worse liking than the children which are of your sort? then shall ye make me endanger my head to the king."],[11,"Then said Daniel to Melzar, whom the prince of the eunuchs had set over Daniel, Hananiah, Mishael, and Azariah,"],[12,"Prove thy servants, I beseech thee, ten days; and let them give us pulse to eat, and water to drink."],[13,"Then let our countenances be looked upon before thee, and the countenance of the children that eat of the portion of the king's meat: and as thou seest, deal with thy servants."],[14,"So he consented to them in this matter, and proved them ten days."],[15,"And at the end of ten days their countenances appeared fairer and fatter in flesh than all the children which did eat the portion of the king's meat."],[16,"Thus Melzar took away the portion of their meat, and the wine that they should drink; and gave them pulse."],[17,"As for these four children, God gave them knowledge and skill in all learning and wisdom: and Daniel had understanding in all visions and dreams."],[18,"Now at the end of the days that the king had said he should bring them in, then the prince of the eunuchs brought them in before Nebuchadnezzar."],[19,"And the king communed with them; and among them all was found none like Daniel, Hananiah, Mishael, and Azariah: therefore stood they before the king."],[20,"And in all matters of wisdom and understanding, that the king enquired of them, he found them ten times better than all the magicians and astrologers that were in all his realm."],[21,"And Daniel continued even unto the first year of king Cyrus."]]},{"id":"dan2","book":"Daniel 2","heading":"The Stone Cut Out without Hands","verses":[[1,"And in the second year of the reign of Nebuchadnezzar Nebuchadnezzar dreamed dreams, wherewith his spirit was troubled, and his sleep brake from him."],[2,"Then the king commanded to call the magicians, and the astrologers, and the sorcerers, and the Chaldeans, for to shew the king his dreams. So they came and stood before the king."],[3,"And the king said unto them, I have dreamed a dream, and my spirit was troubled to know the dream."],[4,"Then spake the Chaldeans to the king in Syriack, O king, live for ever: tell thy servants the dream, and we will shew the interpretation."],[5,"The king answered and said to the Chaldeans, The thing is gone from me: if ye will not make known unto me the dream, with the interpretation thereof, ye shall be cut in pieces, and your houses shall be made a dunghill."],[6,"But if ye shew the dream, and the interpretation thereof, ye shall receive of me gifts and rewards and great honour: therefore shew me the dream, and the interpretation thereof."],[7,"They answered again and said, Let the king tell his servants the dream, and we will shew the interpretation of it."],[8,"The king answered and said, I know of certainty that ye would gain the time, because ye see the thing is gone from me."],[9,"But if ye will not make known unto me the dream, there is but one decree for you: for ye have prepared lying and corrupt words to speak before me, till the time be changed: therefore tell me the dream, and I shall know that ye can shew me the interpretation thereof."],[10,"The Chaldeans answered before the king, and said, There is not a man upon the earth that can shew the king's matter: therefore there is no king, lord, nor ruler, that asked such things at any magician, or astrologer, or Chaldean."],[11,"And it is a rare thing that the king requireth, and there is none other that can shew it before the king, except the gods, whose dwelling is not with flesh."],[12,"For this cause the king was angry and very furious, and commanded to destroy all the wise men of Babylon."],[13,"And the decree went forth that the wise men should be slain; and they sought Daniel and his fellows to be slain."],[14,"Then Daniel answered with counsel and wisdom to Arioch the captain of the king's guard, which was gone forth to slay the wise men of Babylon:"],[15,"He answered and said to Arioch the king's captain, Why is the decree so hasty from the king? Then Arioch made the thing known to Daniel."],[16,"Then Daniel went in, and desired of the king that he would give him time, and that he would shew the king the interpretation."],[17,"Then Daniel went to his house, and made the thing known to Hananiah, Mishael, and Azariah, his companions:"],[18,"That they would desire mercies of the God of heaven concerning this secret; that Daniel and his fellows should not perish with the rest of the wise men of Babylon."],[19,"Then was the secret revealed unto Daniel in a night vision. Then Daniel blessed the God of heaven."],[20,"Daniel answered and said, Blessed be the name of God for ever and ever: for wisdom and might are his:"],[21,"And he changeth the times and the seasons: he removeth kings, and setteth up kings: he giveth wisdom unto the wise, and knowledge to them that know understanding:"],[22,"He revealeth the deep and secret things: he knoweth what is in the darkness, and the light dwelleth with him."],[23,"I thank thee, and praise thee, O thou God of my fathers, who hast given me wisdom and might, and hast made known unto me now what we desired of thee: for thou hast now made known unto us the king's matter."],[24,"Therefore Daniel went in unto Arioch, whom the king had ordained to destroy the wise men of Babylon: he went and said thus unto him; Destroy not the wise men of Babylon: bring me in before the king, and I will shew unto the king the interpretation."],[25,"Then Arioch brought in Daniel before the king in haste, and said thus unto him, I have found a man of the captives of Judah, that will make known unto the king the interpretation."],[26,"The king answered and said to Daniel, whose name was Belteshazzar, Art thou able to make known unto me the dream which I have seen, and the interpretation thereof?"],[27,"Daniel answered in the presence of the king, and said, The secret which the king hath demanded cannot the wise men, the astrologers, the magicians, the soothsayers, shew unto the king;"],[28,"But there is a God in heaven that revealeth secrets, and maketh known to the king Nebuchadnezzar what shall be in the latter days. Thy dream, and the visions of thy head upon thy bed, are these;"],[29,"As for thee, O king, thy thoughts came into thy mind upon thy bed, what should come to pass hereafter: and he that revealeth secrets maketh known to thee what shall come to pass."],[30,"But as for me, this secret is not revealed to me for any wisdom that I have more than any living, but for their sakes that shall make known the interpretation to the king, and that thou mightest know the thoughts of thy heart."],[31,"Thou, O king, sawest, and behold a great image. This great image, whose brightness was excellent, stood before thee; and the form thereof was terrible."],[32,"This image's head was of fine gold, his breast and his arms of silver, his belly and his thighs of brass,"],[33,"His legs of iron, his feet part of iron and part of clay."],[34,"Thou sawest till that a stone was cut out without hands, which smote the image upon his feet that were of iron and clay, and brake them to pieces."],[35,"Then was the iron, the clay, the brass, the silver, and the gold, broken to pieces together, and became like the chaff of the summer threshingfloors; and the wind carried them away, that no place was found for them: and the stone that smote the image became a great mountain, and filled the whole earth."],[36,"This is the dream; and we will tell the interpretation thereof before the king."],[37,"Thou, O king, art a king of kings: for the God of heaven hath given thee a kingdom, power, and strength, and glory."],[38,"And wheresoever the children of men dwell, the beasts of the field and the fowls of the heaven hath he given into thine hand, and hath made thee ruler over them all. Thou art this head of gold."],[39,"And after thee shall arise another kingdom inferior to thee, and another third kingdom of brass, which shall bear rule over all the earth."],[40,"And the fourth kingdom shall be strong as iron: forasmuch as iron breaketh in pieces and subdueth all things: and as iron that breaketh all these, shall it break in pieces and bruise."],[41,"And whereas thou sawest the feet and toes, part of potters' clay, and part of iron, the kingdom shall be divided; but there shall be in it of the strength of the iron, forasmuch as thou sawest the iron mixed with miry clay."],[42,"And as the toes of the feet were part of iron, and part of clay, so the kingdom shall be partly strong, and partly broken."],[43,"And whereas thou sawest iron mixed with miry clay, they shall mingle themselves with the seed of men: but they shall not cleave one to another, even as iron is not mixed with clay."],[44,"And in the days of these kings shall the God of heaven set up a kingdom, which shall never be destroyed: and the kingdom shall not be left to other people, but it shall break in pieces and consume all these kingdoms, and it shall stand for ever."],[45,"Forasmuch as thou sawest that the stone was cut out of the mountain without hands, and that it brake in pieces the iron, the brass, the clay, the silver, and the gold; the great God hath made known to the king what shall come to pass hereafter: and the dream is certain, and the interpretation thereof sure."],[46,"Then the king Nebuchadnezzar fell upon his face, and worshipped Daniel, and commanded that they should offer an oblation and sweet odours unto him."],[47,"The king answered unto Daniel, and said, Of a truth it is, that your God is a God of gods, and a Lord of kings, and a revealer of secrets, seeing thou couldest reveal this secret."],[48,"Then the king made Daniel a great man, and gave him many great gifts, and made him ruler over the whole province of Babylon, and chief of the governors over all the wise men of Babylon."],[49,"Then Daniel requested of the king, and he set Shadrach, Meshach, and Abednego, over the affairs of the province of Babylon: but Daniel sat in the gate of the king."]]},{"id":"dan3","book":"Daniel 3","heading":"The Fiery Furnace","verses":[[1,"Nebuchadnezzar the king made an image of gold, whose height was threescore cubits, and the breadth thereof six cubits: he set it up in the plain of Dura, in the province of Babylon."],[2,"Then Nebuchadnezzar the king sent to gather together the princes, the governors, and the captains, the judges, the treasurers, the counsellors, the sheriffs, and all the rulers of the provinces, to come to the dedication of the image which Nebuchadnezzar the king had set up."],[3,"Then the princes, the governors, and captains, the judges, the treasurers, the counsellors, the sheriffs, and all the rulers of the provinces, were gathered together unto the dedication of the image that Nebuchadnezzar the king had set up; and they stood before the image that Nebuchadnezzar had set up."],[4,"Then an herald cried aloud, To you it is commanded, O people, nations, and languages,"],[5,"That at what time ye hear the sound of the cornet, flute, harp, sackbut, psaltery, dulcimer, and all kinds of musick, ye fall down and worship the golden image that Nebuchadnezzar the king hath set up:"],[6,"And whoso falleth not down and worshippeth shall the same hour be cast into the midst of a burning fiery furnace."],[7,"Therefore at that time, when all the people heard the sound of the cornet, flute, harp, sackbut, psaltery, and all kinds of musick, all the people, the nations, and the languages, fell down and worshipped the golden image that Nebuchadnezzar the king had set up."],[8,"Wherefore at that time certain Chaldeans came near, and accused the Jews."],[9,"They spake and said to the king Nebuchadnezzar, O king, live for ever."],[10,"Thou, O king, hast made a decree, that every man that shall hear the sound of the cornet, flute, harp, sackbut, psaltery, and dulcimer, and all kinds of musick, shall fall down and worship the golden image:"],[11,"And whoso falleth not down and worshippeth, that he should be cast into the midst of a burning fiery furnace."],[12,"There are certain Jews whom thou hast set over the affairs of the province of Babylon, Shadrach, Meshach, and Abednego; these men, O king, have not regarded thee: they serve not thy gods, nor worship the golden image which thou hast set up."],[13,"Then Nebuchadnezzar in his rage and fury commanded to bring Shadrach, Meshach, and Abednego. Then they brought these men before the king."],[14,"Nebuchadnezzar spake and said unto them, Is it true, O Shadrach, Meshach, and Abednego, do not ye serve my gods, nor worship the golden image which I have set up?"],[15,"Now if ye be ready that at what time ye hear the sound of the cornet, flute, harp, sackbut, psaltery, and dulcimer, and all kinds of musick, ye fall down and worship the image which I have made; well: but if ye worship not, ye shall be cast the same hour into the midst of a burning fiery furnace; and who is that God that shall deliver you out of my hands?"],[16,"Shadrach, Meshach, and Abednego, answered and said to the king, O Nebuchadnezzar, we are not careful to answer thee in this matter."],[17,"If it be so, our God whom we serve is able to deliver us from the burning fiery furnace, and he will deliver us out of thine hand, O king."],[18,"But if not, be it known unto thee, O king, that we will not serve thy gods, nor worship the golden image which thou hast set up."],[19,"Then was Nebuchadnezzar full of fury, and the form of his visage was changed against Shadrach, Meshach, and Abednego: therefore he spake, and commanded that they should heat the furnace one seven times more than it was wont to be heated."],[20,"And he commanded the most mighty men that were in his army to bind Shadrach, Meshach, and Abednego, and to cast them into the burning fiery furnace."],[21,"Then these men were bound in their coats, their hosen, and their hats, and their other garments, and were cast into the midst of the burning fiery furnace."],[22,"Therefore because the king's commandment was urgent, and the furnace exceeding hot, the flame of the fire slew those men that took up Shadrach, Meshach, and Abednego."],[23,"And these three men, Shadrach, Meshach, and Abednego, fell down bound into the midst of the burning fiery furnace."],[24,"Then Nebuchadnezzar the king was astonied, and rose up in haste, and spake, and said unto his counsellors, Did not we cast three men bound into the midst of the fire? They answered and said unto the king, True, O king."],[25,"He answered and said, Lo, I see four men loose, walking in the midst of the fire, and they have no hurt; and the form of the fourth is like the Son of God."],[26,"Then Nebuchadnezzar came near to the mouth of the burning fiery furnace, and spake, and said, Shadrach, Meshach, and Abednego, ye servants of the most high God, come forth, and come hither. Then Shadrach, Meshach, and Abednego, came forth of the midst of the fire."],[27,"And the princes, governors, and captains, and the king's counsellors, being gathered together, saw these men, upon whose bodies the fire had no power, nor was an hair of their head singed, neither were their coats changed, nor the smell of fire had passed on them."],[28,"Then Nebuchadnezzar spake, and said, Blessed be the God of Shadrach, Meshach, and Abednego, who hath sent his angel, and delivered his servants that trusted in him, and have changed the king's word, and yielded their bodies, that they might not serve nor worship any god, except their own God."],[29,"Therefore I make a decree, That every people, nation, and language, which speak any thing amiss against the God of Shadrach, Meshach, and Abednego, shall be cut in pieces, and their houses shall be made a dunghill: because there is no other God that can deliver after this sort."],[30,"Then the king promoted Shadrach, Meshach, and Abednego, in the province of Babylon."]]},{"id":"dan4","book":"Daniel 4","heading":"Nebuchadnezzar Is Humbled","verses":[[1,"Nebuchadnezzar the king, unto all people, nations, and languages, that dwell in all the earth; Peace be multiplied unto you."],[2,"I thought it good to shew the signs and wonders that the high God hath wrought toward me."],[3,"How great are his signs! and how mighty are his wonders! his kingdom is an everlasting kingdom, and his dominion is from generation to generation."],[4,"I Nebuchadnezzar was at rest in mine house, and flourishing in my palace:"],[5,"I saw a dream which made me afraid, and the thoughts upon my bed and the visions of my head troubled me."],[6,"Therefore made I a decree to bring in all the wise men of Babylon before me, that they might make known unto me the interpretation of the dream."],[7,"Then came in the magicians, the astrologers, the Chaldeans, and the soothsayers: and I told the dream before them; but they did not make known unto me the interpretation thereof."],[8,"But at the last Daniel came in before me, whose name was Belteshazzar, according to the name of my god, and in whom is the spirit of the holy gods: and before him I told the dream, saying,"],[9,"O Belteshazzar, master of the magicians, because I know that the spirit of the holy gods is in thee, and no secret troubleth thee, tell me the visions of my dream that I have seen, and the interpretation thereof."],[10,"Thus were the visions of mine head in my bed; I saw, and behold a tree in the midst of the earth, and the height thereof was great."],[11,"The tree grew, and was strong, and the height thereof reached unto heaven, and the sight thereof to the end of all the earth:"],[12,"The leaves thereof were fair, and the fruit thereof much, and in it was meat for all: the beasts of the field had shadow under it, and the fowls of the heaven dwelt in the boughs thereof, and all flesh was fed of it."],[13,"I saw in the visions of my head upon my bed, and, behold, a watcher and an holy one came down from heaven;"],[14,"He cried aloud, and said thus, Hew down the tree, and cut off his branches, shake off his leaves, and scatter his fruit: let the beasts get away from under it, and the fowls from his branches:"],[15,"Nevertheless leave the stump of his roots in the earth, even with a band of iron and brass, in the tender grass of the field; and let it be wet with the dew of heaven, and let his portion be with the beasts in the grass of the earth:"],[16,"Let his heart be changed from man's, and let a beast's heart be given unto him; and let seven times pass over him."],[17,"This matter is by the decree of the watchers, and the demand by the word of the holy ones: to the intent that the living may know that the most High ruleth in the kingdom of men, and giveth it to whomsoever he will, and setteth up over it the basest of men."],[18,"This dream I king Nebuchadnezzar have seen. Now thou, O Belteshazzar, declare the interpretation thereof, forasmuch as all the wise men of my kingdom are not able to make known unto me the interpretation: but thou art able; for the spirit of the holy gods is in thee."],[19,"Then Daniel, whose name was Belteshazzar, was astonied for one hour, and his thoughts troubled him. The king spake, and said, Belteshazzar, let not the dream, or the interpretation thereof, trouble thee. Belteshazzar answered and said, My lord, the dream be to them that hate thee, and the interpretation thereof to thine enemies."],[20,"The tree that thou sawest, which grew, and was strong, whose height reached unto the heaven, and the sight thereof to all the earth;"],[21,"Whose leaves were fair, and the fruit thereof much, and in it was meat for all; under which the beasts of the field dwelt, and upon whose branches the fowls of the heaven had their habitation:"],[22,"It is thou, O king, that art grown and become strong: for thy greatness is grown, and reacheth unto heaven, and thy dominion to the end of the earth."],[23,"And whereas the king saw a watcher and an holy one coming down from heaven, and saying, Hew the tree down, and destroy it; yet leave the stump of the roots thereof in the earth, even with a band of iron and brass, in the tender grass of the field; and let it be wet with the dew of heaven, and let his portion be with the beasts of the field, till seven times pass over him;"],[24,"This is the interpretation, O king, and this is the decree of the most High, which is come upon my lord the king:"],[25,"That they shall drive thee from men, and thy dwelling shall be with the beasts of the field, and they shall make thee to eat grass as oxen, and they shall wet thee with the dew of heaven, and seven times shall pass over thee, till thou know that the most High ruleth in the kingdom of men, and giveth it to whomsoever he will."],[26,"And whereas they commanded to leave the stump of the tree roots; thy kingdom shall be sure unto thee, after that thou shalt have known that the heavens do rule."],[27,"Wherefore, O king, let my counsel be acceptable unto thee, and break off thy sins by righteousness, and thine iniquities by shewing mercy to the poor; if it may be a lengthening of thy tranquillity."],[28,"All this came upon the king Nebuchadnezzar."],[29,"At the end of twelve months he walked in the palace of the kingdom of Babylon."],[30,"The king spake, and said, Is not this great Babylon, that I have built for the house of the kingdom by the might of my power, and for the honour of my majesty?"],[31,"While the word was in the king's mouth, there fell a voice from heaven, saying, O king Nebuchadnezzar, to thee it is spoken; The kingdom is departed from thee."],[32,"And they shall drive thee from men, and thy dwelling shall be with the beasts of the field: they shall make thee to eat grass as oxen, and seven times shall pass over thee, until thou know that the most High ruleth in the kingdom of men, and giveth it to whomsoever he will."],[33,"The same hour was the thing fulfilled upon Nebuchadnezzar: and he was driven from men, and did eat grass as oxen, and his body was wet with the dew of heaven, till his hairs were grown like eagles' feathers, and his nails like birds' claws."],[34,"And at the end of the days I Nebuchadnezzar lifted up mine eyes unto heaven, and mine understanding returned unto me, and I blessed the most High, and I praised and honoured him that liveth for ever, whose dominion is an everlasting dominion, and his kingdom is from generation to generation:"],[35,"And all the inhabitants of the earth are reputed as nothing: and he doeth according to his will in the army of heaven, and among the inhabitants of the earth: and none can stay his hand, or say unto him, What doest thou?"],[36,"At the same time my reason returned unto me; and for the glory of my kingdom, mine honour and brightness returned unto me; and my counsellors and my lords sought unto me; and I was established in my kingdom, and excellent majesty was added unto me."],[37,"Now I Nebuchadnezzar praise and extol and honour the King of heaven, all whose works are truth, and his ways judgment: and those that walk in pride he is able to abase."]]},{"id":"dan5","book":"Daniel 5","heading":"The Writing on the Wall","verses":[[1,"Belshazzar the king made a great feast to a thousand of his lords, and drank wine before the thousand."],[2,"Belshazzar, whiles he tasted the wine, commanded to bring the golden and silver vessels which his father Nebuchadnezzar had taken out of the temple which was in Jerusalem; that the king, and his princes, his wives, and his concubines, might drink therein."],[3,"Then they brought the golden vessels that were taken out of the temple of the house of God which was at Jerusalem; and the king, and his princes, his wives, and his concubines, drank in them."],[4,"They drank wine, and praised the gods of gold, and of silver, of brass, of iron, of wood, and of stone."],[5,"In the same hour came forth fingers of a man's hand, and wrote over against the candlestick upon the plaister of the wall of the king's palace: and the king saw the part of the hand that wrote."],[6,"Then the king's countenance was changed, and his thoughts troubled him, so that the joints of his loins were loosed, and his knees smote one against another."],[7,"The king cried aloud to bring in the astrologers, the Chaldeans, and the soothsayers. And the king spake, and said to the wise men of Babylon, Whosoever shall read this writing, and shew me the interpretation thereof, shall be clothed with scarlet, and have a chain of gold about his neck, and shall be the third ruler in the kingdom."],[8,"Then came in all the king's wise men: but they could not read the writing, nor make known to the king the interpretation thereof."],[9,"Then was king Belshazzar greatly troubled, and his countenance was changed in him, and his lords were astonied."],[10,"Now the queen, by reason of the words of the king and his lords, came into the banquet house: and the queen spake and said, O king, live for ever: let not thy thoughts trouble thee, nor let thy countenance be changed:"],[11,"There is a man in thy kingdom, in whom is the spirit of the holy gods; and in the days of thy father light and understanding and wisdom, like the wisdom of the gods, was found in him; whom the king Nebuchadnezzar thy father, the king, I say, thy father, made master of the magicians, astrologers, Chaldeans, and soothsayers;"],[12,"Forasmuch as an excellent spirit, and knowledge, and understanding, interpreting of dreams, and shewing of hard sentences, and dissolving of doubts, were found in the same Daniel, whom the king named Belteshazzar: now let Daniel be called, and he will shew the interpretation."],[13,"Then was Daniel brought in before the king. And the king spake and said unto Daniel, Art thou that Daniel, which art of the children of the captivity of Judah, whom the king my father brought out of Jewry?"],[14,"I have even heard of thee, that the spirit of the gods is in thee, and that light and understanding and excellent wisdom is found in thee."],[15,"And now the wise men, the astrologers, have been brought in before me, that they should read this writing, and make known unto me the interpretation thereof: but they could not shew the interpretation of the thing:"],[16,"And I have heard of thee, that thou canst make interpretations, and dissolve doubts: now if thou canst read the writing, and make known to me the interpretation thereof, thou shalt be clothed with scarlet, and have a chain of gold about thy neck, and shalt be the third ruler in the kingdom."],[17,"Then Daniel answered and said before the king, Let thy gifts be to thyself, and give thy rewards to another; yet I will read the writing unto the king, and make known to him the interpretation."],[18,"O thou king, the most high God gave Nebuchadnezzar thy father a kingdom, and majesty, and glory, and honour:"],[19,"And for the majesty that he gave him, all people, nations, and languages, trembled and feared before him: whom he would he slew; and whom he would he kept alive; and whom he would he set up; and whom he would he put down."],[20,"But when his heart was lifted up, and his mind hardened in pride, he was deposed from his kingly throne, and they took his glory from him:"],[21,"And he was driven from the sons of men; and his heart was made like the beasts, and his dwelling was with the wild asses: they fed him with grass like oxen, and his body was wet with the dew of heaven; till he knew that the most high God ruled in the kingdom of men, and that he appointeth over it whomsoever he will."],[22,"And thou his son, O Belshazzar, hast not humbled thine heart, though thou knewest all this;"],[23,"But hast lifted up thyself against the Lord of heaven; and they have brought the vessels of his house before thee, and thou, and thy lords, thy wives, and thy concubines, have drunk wine in them; and thou hast praised the gods of silver, and gold, of brass, iron, wood, and stone, which see not, nor hear, nor know: and the God in whose hand thy breath is, and whose are all thy ways, hast thou not glorified:"],[24,"Then was the part of the hand sent from him; and this writing was written."],[25,"And this is the writing that was written, MENE, MENE, TEKEL, UPHARSIN."],[26,"This is the interpretation of the thing: MENE; God hath numbered thy kingdom, and finished it."],[27,"TEKEL; Thou art weighed in the balances, and art found wanting."],[28,"PERES; Thy kingdom is divided, and given to the Medes and Persians."],[29,"Then commanded Belshazzar, and they clothed Daniel with scarlet, and put a chain of gold about his neck, and made a proclamation concerning him, that he should be the third ruler in the kingdom."],[30,"In that night was Belshazzar the king of the Chaldeans slain."],[31,"And Darius the Median took the kingdom, being about threescore and two years old."]]},{"id":"dan6","book":"Daniel 6","heading":"Daniel in the Lions' Den","verses":[[1,"It pleased Darius to set over the kingdom an hundred and twenty princes, which should be over the whole kingdom;"],[2,"And over these three presidents; of whom Daniel was first: that the princes might give accounts unto them, and the king should have no damage."],[3,"Then this Daniel was preferred above the presidents and princes, because an excellent spirit was in him; and the king thought to set him over the whole realm."],[4,"Then the presidents and princes sought to find occasion against Daniel concerning the kingdom; but they could find none occasion nor fault; forasmuch as he was faithful, neither was there any error or fault found in him."],[5,"Then said these men, We shall not find any occasion against this Daniel, except we find it against him concerning the law of his God."],[6,"Then these presidents and princes assembled together to the king, and said thus unto him, King Darius, live for ever."],[7,"All the presidents of the kingdom, the governors, and the princes, the counsellors, and the captains, have consulted together to establish a royal statute, and to make a firm decree, that whosoever shall ask a petition of any God or man for thirty days, save of thee, O king, he shall be cast into the den of lions."],[8,"Now, O king, establish the decree, and sign the writing, that it be not changed, according to the law of the Medes and Persians, which altereth not."],[9,"Wherefore king Darius signed the writing and the decree."],[10,"Now when Daniel knew that the writing was signed, he went into his house; and his windows being open in his chamber toward Jerusalem, he kneeled upon his knees three times a day, and prayed, and gave thanks before his God, as he did aforetime."],[11,"Then these men assembled, and found Daniel praying and making supplication before his God."],[12,"Then they came near, and spake before the king concerning the king's decree; Hast thou not signed a decree, that every man that shall ask a petition of any God or man within thirty days, save of thee, O king, shall be cast into the den of lions? The king answered and said, The thing is true, according to the law of the Medes and Persians, which altereth not."],[13,"Then answered they and said before the king, That Daniel, which is of the children of the captivity of Judah, regardeth not thee, O king, nor the decree that thou hast signed, but maketh his petition three times a day."],[14,"Then the king, when he heard these words, was sore displeased with himself, and set his heart on Daniel to deliver him: and he laboured till the going down of the sun to deliver him."],[15,"Then these men assembled unto the king, and said unto the king, Know, O king, that the law of the Medes and Persians is, That no decree nor statute which the king establisheth may be changed."],[16,"Then the king commanded, and they brought Daniel, and cast him into the den of lions. Now the king spake and said unto Daniel, Thy God whom thou servest continually, he will deliver thee."],[17,"And a stone was brought, and laid upon the mouth of the den; and the king sealed it with his own signet, and with the signet of his lords; that the purpose might not be changed concerning Daniel."],[18,"Then the king went to his palace, and passed the night fasting: neither were instruments of musick brought before him: and his sleep went from him."],[19,"Then the king arose very early in the morning, and went in haste unto the den of lions."],[20,"And when he came to the den, he cried with a lamentable voice unto Daniel: and the king spake and said to Daniel, O Daniel, servant of the living God, is thy God, whom thou servest continually, able to deliver thee from the lions?"],[21,"Then said Daniel unto the king, O king, live for ever."],[22,"My God hath sent his angel, and hath shut the lions' mouths, that they have not hurt me: forasmuch as before him innocency was found in me; and also before thee, O king, have I done no hurt."],[23,"Then was the king exceeding glad for him, and commanded that they should take Daniel up out of the den. So Daniel was taken up out of the den, and no manner of hurt was found upon him, because he believed in his God."],[24,"And the king commanded, and they brought those men which had accused Daniel, and they cast them into the den of lions, them, their children, and their wives; and the lions had the mastery of them, and brake all their bones in pieces or ever they came at the bottom of the den."],[25,"Then king Darius wrote unto all people, nations, and languages, that dwell in all the earth; Peace be multiplied unto you."],[26,"I make a decree, That in every dominion of my kingdom men tremble and fear before the God of Daniel: for he is the living God, and stedfast for ever, and his kingdom that which shall not be destroyed, and his dominion shall be even unto the end."],[27,"He delivereth and rescueth, and he worketh signs and wonders in heaven and in earth, who hath delivered Daniel from the power of the lions."],[28,"So this Daniel prospered in the reign of Darius, and in the reign of Cyrus the Persian."]]},{"id":"dan7","book":"Daniel 7","heading":"The Ancient of Days","verses":[[1,"In the first year of Belshazzar king of Babylon Daniel had a dream and visions of his head upon his bed: then he wrote the dream, and told the sum of the matters."],[2,"Daniel spake and said, I saw in my vision by night, and, behold, the four winds of the heaven strove upon the great sea."],[3,"And four great beasts came up from the sea, diverse one from another."],[4,"The first was like a lion, and had eagle's wings: I beheld till the wings thereof were plucked, and it was lifted up from the earth, and made stand upon the feet as a man, and a man's heart was given to it."],[5,"And behold another beast, a second, like to a bear, and it raised up itself on one side, and it had three ribs in the mouth of it between the teeth of it: and they said thus unto it, Arise, devour much flesh."],[6,"After this I beheld, and lo another, like a leopard, which had upon the back of it four wings of a fowl; the beast had also four heads; and dominion was given to it."],[7,"After this I saw in the night visions, and behold a fourth beast, dreadful and terrible, and strong exceedingly; and it had great iron teeth: it devoured and brake in pieces, and stamped the residue with the feet of it: and it was diverse from all the beasts that were before it; and it had ten horns."],[8,"I considered the horns, and, behold, there came up among them another little horn, before whom there were three of the first horns plucked up by the roots: and, behold, in this horn were eyes like the eyes of man, and a mouth speaking great things."],[9,"I beheld till the thrones were cast down, and the Ancient of days did sit, whose garment was white as snow, and the hair of his head like the pure wool: his throne was like the fiery flame, and his wheels as burning fire."],[10,"A fiery stream issued and came forth from before him: thousand thousands ministered unto him, and ten thousand times ten thousand stood before him: the judgment was set, and the books were opened."],[11,"I beheld then because of the voice of the great words which the horn spake: I beheld even till the beast was slain, and his body destroyed, and given to the burning flame."],[12,"As concerning the rest of the beasts, they had their dominion taken away: yet their lives were prolonged for a season and time."],[13,"I saw in the night visions, and, behold, one like the Son of man came with the clouds of heaven, and came to the Ancient of days, and they brought him near before him."],[14,"And there was given him dominion, and glory, and a kingdom, that all people, nations, and languages, should serve him: his dominion is an everlasting dominion, which shall not pass away, and his kingdom that which shall not be destroyed."],[15,"I Daniel was grieved in my spirit in the midst of my body, and the visions of my head troubled me."],[16,"I came near unto one of them that stood by, and asked him the truth of all this. So he told me, and made me know the interpretation of the things."],[17,"These great beasts, which are four, are four kings, which shall arise out of the earth."],[18,"But the saints of the most High shall take the kingdom, and possess the kingdom for ever, even for ever and ever."],[19,"Then I would know the truth of the fourth beast, which was diverse from all the others, exceeding dreadful, whose teeth were of iron, and his nails of brass; which devoured, brake in pieces, and stamped the residue with his feet;"],[20,"And of the ten horns that were in his head, and of the other which came up, and before whom three fell; even of that horn that had eyes, and a mouth that spake very great things, whose look was more stout than his fellows."],[21,"I beheld, and the same horn made war with the saints, and prevailed against them;"],[22,"Until the Ancient of days came, and judgment was given to the saints of the most High; and the time came that the saints possessed the kingdom."],[23,"Thus he said, The fourth beast shall be the fourth kingdom upon earth, which shall be diverse from all kingdoms, and shall devour the whole earth, and shall tread it down, and break it in pieces."],[24,"And the ten horns out of this kingdom are ten kings that shall arise: and another shall rise after them; and he shall be diverse from the first, and he shall subdue three kings."],[25,"And he shall speak great words against the most High, and shall wear out the saints of the most High, and think to change times and laws: and they shall be given into his hand until a time and times and the dividing of time."],[26,"But the judgment shall sit, and they shall take away his dominion, to consume and to destroy it unto the end."],[27,"And the kingdom and dominion, and the greatness of the kingdom under the whole heaven, shall be given to the people of the saints of the most High, whose kingdom is an everlasting kingdom, and all dominions shall serve and obey him."],[28,"Hitherto is the end of the matter. As for me Daniel, my cogitations much troubled me, and my countenance changed in me: but I kept the matter in my heart."]]}];
