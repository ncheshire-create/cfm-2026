n at thy presence."],[4,"For since the beginning of the world men have not heard, nor perceived by the ear, neither hath the eye seen, O God, beside thee, what he hath prepared for him that waiteth for him."],[5,"Thou meetest him that rejoiceth and worketh righteousness, those that remember thee in thy ways: behold, thou art wroth; for we have sinned: in those is continuance, and we shall be saved."],[6,"But we are all as an unclean thing, and all our righteousnesses are as filthy rags; and we all do fade as a leaf; and our iniquities, like the wind, have taken us away."],[7,"And there is none that calleth upon thy name, that stirreth up himself to take hold of thee: for thou hast hid thy face from us, and hast consumed us, because of our iniquities."],[8,"But now, O LORD, thou art our father; we are the clay, and thou our potter; and we all are the work of thy hand."],[9,"Be not wroth very sore, O LORD, neither remember iniquity for ever: behold, see, we beseech thee, we are all thy people."],[10,"Thy holy cities are a wilderness, Zion is a wilderness, Jerusalem a desolation."],[11,"Our holy and our beautiful house, where our fathers praised thee, is burned up with fire: and all our pleasant things are laid waste."],[12,"Wilt thou refrain thyself for these things, O LORD? wilt thou hold thy peace, and afflict us very sore?"]]},{"id":"isa65","book":"Isaiah 65","heading":"New Heavens and a New Earth","verses":[[1,"I am sought of them that asked not for me; I am found of them that sought me not: I said, Behold me, behold me, unto a nation that was not called by my name."],[2,"I have spread out my hands all the day unto a rebellious people, which walketh in a way that was not good, after their own thoughts;"],[3,"A people that provoketh me to anger continually to my face; that sacrificeth in gardens, and burneth incense upon altars of brick;"],[4,"Which remain among the graves, and lodge in the monuments, which eat swine's flesh, and broth of abominable things is in their vessels;"],[5,"Which say, Stand by thyself, come not near to me; for I am holier than thou. These are a smoke in my nose, a fire that burneth all the day."],[6,"Behold, it is written before me: I will not keep silence, but will recompense, even recompense into their bosom,"],[7,"Your iniquities, and the iniquities of your fathers together, saith the LORD, which have burned incense upon the mountains, and blasphemed me upon the hills: therefore will I measure their former work into their bosom."],[8,"Thus saith the LORD, As the new wine is found in the cluster, and one saith, Destroy it not; for a blessing is in it: so will I do for my servants' sakes, that I may not destroy them all."],[9,"And I will bring forth a seed out of Jacob, and out of Judah an inheritor of my mountains: and mine elect shall inherit it, and my servants shall dwell there."],[10,"And Sharon shall be a fold of flocks, and the valley of Achor a place for the herds to lie down in, for my people that have sought me."],[11,"But ye are they that forsake the LORD, that forget my holy mountain, that prepare a table for that troop, and that furnish the drink offering unto that number."],[12,"Therefore will I number you to the sword, and ye shall all bow down to the slaughter: because when I called, ye did not answer; when I spake, ye did not hear; but did evil before mine eyes, and did choose that wherein I delighted not."],[13,"Therefore thus saith the Lord GOD, Behold, my servants shall eat, but ye shall be hungry: behold, my servants shall drink, but ye shall be thirsty: behold, my servants shall rejoice, but ye shall be ashamed:"],[14,"Behold, my servants shall sing for joy of heart, but ye shall cry for sorrow of heart, and shall howl for vexation of spirit."],[15,"And ye shall leave your name for a curse unto my chosen: for the Lord GOD shall slay thee, and call his servants by another name:"],[16,"That he who blesseth himself in the earth shall bless himself in the God of truth; and he that sweareth in the earth shall swear by the God of truth; because the former troubles are forgotten, and because they are hid from mine eyes."],[17,"For, behold, I create new heavens and a new earth: and the former shall not be remembered, nor come into mind."],[18,"But be ye glad and rejoice for ever in that which I create: for, behold, I create Jerusalem a rejoicing, and her people a joy."],[19,"And I will rejoice in Jerusalem, and joy in my people: and the voice of weeping shall be no more heard in her, nor the voice of crying."],[20,"There shall be no more thence an infant of days, nor an old man that hath not filled his days: for the child shall die an hundred years old; but the sinner being an hundred years old shall be accursed."],[21,"And they shall build houses, and inhabit them; and they shall plant vineyards, and eat the fruit of them."],[22,"They shall not build, and another inhabit; they shall not plant, and another eat: for as the days of a tree are the days of my people, and mine elect shall long enjoy the work of their hands."],[23,"They shall not labour in vain, nor bring forth for trouble; for they are the seed of the blessed of the LORD, and their offspring with them."],[24,"And it shall come to pass, that before they call, I will answer; and while they are yet speaking, I will hear."],[25,"The wolf and the lamb shall feed together, and the lion shall eat straw like the bullock: and dust shall be the serpent's meat. They shall not hurt nor destroy in all my holy mountain, saith the LORD."]]},{"id":"isa66","book":"Isaiah 66","heading":"Heaven Is My Throne","verses":[[1,"Thus saith the LORD, The heaven is my throne, and the earth is my footstool: where is the house that ye build unto me? and where is the place of my rest?"],[2,"For all those things hath mine hand made, and all those things have been, saith the LORD: but to this man will I look, even to him that is poor and of a contrite spirit, and trembleth at my word."],[3,"He that killeth an ox is as if he slew a man; he that sacrificeth a lamb, as if he cut off a dog's neck; he that offereth an oblation, as if he offered swine's blood; he that burneth incense, as if he blessed an idol. Yea, they have chosen their own ways, and their soul delighteth in their abominations."],[4,"I also will choose their delusions, and will bring their fears upon them; because when I called, none did answer; when I spake, they did not hear: but they did evil before mine eyes, and chose that in which I delighted not."],[5,"Hear the word of the LORD, ye that tremble at his word; Your brethren that hated you, that cast you out for my name's sake, said, Let the LORD be glorified: but he shall appear to your joy, and they shall be ashamed."],[6,"A voice of noise from the city, a voice from the temple, a voice of the LORD that rendereth recompence to his enemies."],[7,"Before she travailed, she brought forth; before her pain came, she was delivered of a man child."],[8,"Who hath heard such a thing? who hath seen such things? Shall the earth be made to bring forth in one day? or shall a nation be born at once? for as soon as Zion travailed, she brought forth her children."],[9,"Shall I bring to the birth, and not cause to bring forth? saith the LORD: shall I cause to bring forth, and shut the womb? saith thy God."],[10,"Rejoice ye with Jerusalem, and be glad with her, all ye that love her: rejoice for joy with her, all ye that mourn for her:"],[11,"That ye may suck, and be satisfied with the breasts of her consolations; that ye may milk out, and be delighted with the abundance of her glory."],[12,"For thus saith the LORD, Behold, I will extend peace to her like a river, and the glory of the Gentiles like a flowing stream: then shall ye suck, ye shall be borne upon her sides, and be dandled upon her knees."],[13,"As one whom his mother comforteth, so will I comfort you; and ye shall be comforted in Jerusalem."],[14,"And when ye see this, your heart shall rejoice, and your bones shall flourish like an herb: and the hand of the LORD shall be known toward his servants, and his indignation toward his enemies."],[15,"For, behold, the LORD will come with fire, and with his chariots like a whirlwind, to render his anger with fury, and his rebuke with flames of fire."],[16,"For by fire and by his sword will the LORD plead with all flesh: and the slain of the LORD shall be many."],[17,"They that sanctify themselves, and purify themselves in the gardens behind one tree in the midst, eating swine's flesh, and the abomination, and the mouse, shall be consumed together, saith the LORD."],[18,"For I know their works and their thoughts: it shall come, that I will gather all nations and tongues; and they shall come, and see my glory."],[19,"And I will set a sign among them, and I will send those that escape of them unto the nations, to Tarshish, Pul, and Lud, that draw the bow, to Tubal, and Javan, to the isles afar off, that have not heard my fame, neither have seen my glory; and they shall declare my glory among the Gentiles."],[20,"And they shall bring all your brethren for an offering unto the LORD out of all nations upon horses, and in chariots, and in litters, and upon mules, and upon swift beasts, to my holy mountain Jerusalem, saith the LORD, as the children of Israel bring an offering in a clean vessel into the house of the LORD."],[21,"And I will also take of them for priests and for Levites, saith the LORD."],[22,"For as the new heavens and the new earth, which I will make, shall remain before me, saith the LORD, so shall your seed and your name remain."],[23,"And it shall come to pass, that from one new moon to another, and from one sabbath to another, shall all flesh come to worship before me, saith the LORD."],[24,"And they shall go forth, and look upon the carcases of the men that have transgressed against me: for their worm shall not die, neither shall their fire be quenched; and they shall be an abhorring unto all flesh."]]}];

const ALL_WEEKS = [
  { id: 'w37', week: WEEK_w37, passages: PASSAGES_w37 },
  { id: 'w38', week: WEEK_w38, passages: PASSAGES_w38 },
  { id: 'w40', week: WEEK_w40, passages: PASSAGES_w40 },
  { id: 'w41', week: WEEK_w41, passages: PASSAGES_w41 },
  { id: 'w42', week: WEEK_w42, passages: PASSAGES_w42 },
];

</script>
<script>
// ===================== App state =====================
let currentWeek = null;
let currentDays = null;
let currentDayIndex = 0;
let currentVerseIndex = 0;
let currentPart = 0;       // which page of a long verse (-1 = last page)
let currentPartCount = 1;
let readerCounts = {};   // { dayIndex: N } — per-day reader count

const STORAGE_KEY_PREFIX = 'cfm-progress-';
const BLOCK_SIZE = 5;

function loadProgress(weekId){
  try { const raw = localStorage.getItem(STORAGE_KEY_PREFIX + weekId); return raw ? JSON.parse(raw) : {}; }
  catch(e){ return {}; }
}
function saveProgress(weekId, dayIdx){
  try { const prog = loadProgress(weekId); prog[dayIdx] = true; localStorage.setItem(STORAGE_KEY_PREFIX + weekId, JSON.stringify(prog)); }
  catch(e){ /* ignore */ }
}

// ===================== Day splitting (Sun 2x, Mon–Fri 1x, no Saturday) =====================
const ALL_DAY_NAMES    = ['Monday','Tuesday','Wednesday','Thursday','Friday','Sunday'];
const ALL_DAY_WEIGHTS  = [1,1,1,1,1,2];

function allocateByWeight(total, dayCount){
  const weights = ALL_DAY_WEIGHTS.slice(0, dayCount);
  const totalWeight = weights.reduce((a,b) => a+b, 0);
  const raw = weights.map(w => total * w / totalWeight);
  const floors = raw.map(Math.floor);
  let allocated = floors.reduce((a,b) => a+b, 0);
  const fracOrder = raw.map((r,i) => [r-floors[i], i]).sort((a,b) => b[0]-a[0]);
  const sizes = [...floors];
  for(let i = 0; i < total - allocated; i++) sizes[fracOrder[i][1]]++;
  if(sizes.some(s => s === 0) && dayCount > 1) return allocateByWeight(total, dayCount - 1);
  return { dayCount: sizes.length, sizes };
}

function computeDays(passages){
  const flat = [];
  passages.forEach(p => p.verses.forEach(v => flat.push({ book: p.book, heading: p.heading, num: v[0], text: v[1] })));
  const total = flat.length;
  const { dayCount, sizes } = allocateByWeight(total, Math.min(ALL_DAY_NAMES.length, Math.max(1, total)));
  const days = [];
  let idx = 0;
  for(let d = 0; d < dayCount; d++){
    days.push({ name: ALL_DAY_NAMES[d], verses: flat.slice(idx, idx + sizes[d]) });
    idx += sizes[d];
  }
  return days;
}

function formatVerseRef(v){
  if(v.book.includes(':')) return v.book;
  return v.book + ':' + v.num;
}
function dayRangeLabel(d){
  const first = d.verses[0], last = d.verses[d.verses.length - 1];
  if(first.book === last.book){
    if(first.book.includes(':')) return first.book;
    return first.book + ':' + first.num + '\u2013' + last.num;
  }
  return formatVerseRef(first) + ' \u2013 ' + formatVerseRef(last);
}

// ===================== Reader labelling =====================
function getReaderCount(dayIdx){ return readerCounts[dayIdx] || 1; }

// Which reader reads verse at position verseIdx within the day?
function readerForVerse(verseIdx, numReaders){
  return Math.floor(verseIdx / BLOCK_SIZE) % numReaders + 1;
}

// ===================== Picker view =====================
function buildPicker(){
  const grid = document.getElementById('weekGrid');
  grid.innerHTML = '';
  ALL_WEEKS.forEach(w => {
    const btn = document.createElement('button');
    btn.className = 'week-card';
    btn.innerHTML =
      '<div class="dates">' + w.week.dateRange + '</div>' +
      '<div class="week-title display">' + w.week.title + '</div>' +
      '<div class="week-ref">' + w.week.refLabel + '</div>';
    btn.addEventListener('click', () => openWeek(w.id));
    grid.appendChild(btn);
  });
  const soon = document.createElement('div');
  soon.className = 'coming-soon';
  soon.style.display = 'none';
  grid.appendChild(soon);
}

function showPicker(){
  document.getElementById('pickerView').classList.add('active');
  document.getElementById('readerView').classList.remove('active');
}
function showReader(){
  document.getElementById('pickerView').classList.remove('active');
  document.getElementById('readerView').classList.add('active');
}

// ===================== Reader view =====================
function openWeek(weekId){
  const entry = ALL_WEEKS.find(w => w.id === weekId);
  if(!entry) return;
  currentWeek = entry;
  currentDays = computeDays(entry.passages);
  currentDayIndex = 0;
  currentVerseIndex = 0;
  currentPart = 0;
  readerCounts = {};
  document.getElementById('weekEyebrow').textContent = 'Come, Follow Me \u00b7 ' + entry.week.dateRange;
  document.getElementById('weekTitle').textContent = entry.week.title;
  document.getElementById('weekRange').textContent = entry.week.refLabel;
  showReader();
  renderReader();
}

function buildDayNav(){
  const nav = document.getElementById('dayNav');
  nav.innerHTML = '';
  const progress = loadProgress(currentWeek.id);
  currentDays.forEach((d, idx) => {
    const chip = document.createElement('button');
    chip.className = 'day-chip' + (idx === currentDayIndex ? ' active' : '') + (progress[idx] ? ' done' : '');
    chip.textContent = d.name;
    chip.addEventListener('click', () => { currentDayIndex = idx; currentVerseIndex = 0; currentPart = 0; renderReader(); });
    nav.appendChild(chip);
  });
}

// Fit a verse into the card without scrolling (Silk can't scroll flex children).
// Shrinks font only down to a readable floor; if still too long, splits the verse into pages.
function layoutVerse(text){
  const card = document.querySelector('#readerView .reader-card');
  const rt   = document.getElementById('readerText');
  const book = document.getElementById('readerBook');
  const cs   = getComputedStyle(card);
  const avail = card.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom)
              - book.offsetHeight - parseFloat(getComputedStyle(book).marginBottom) - 4;
  const fits = () => rt.scrollHeight <= avail;

  rt.style.fontSize = '';
  const base = parseFloat(getComputedStyle(rt).fontSize);
  // Floor: never smaller than ~75% of the normal size (and never below 28px)
  const floor = Math.min(base, Math.max(28, Math.round(base * 0.75)));

  rt.textContent = text;
  let size = base;
  while(!fits() && size > floor){
    size = Math.max(floor, size - 2);
    rt.style.fontSize = size + 'px';
  }
  if(fits()) return { size, pages: [text] };

  // Still too long at the floor size: split on word boundaries into pages.
  const words = text.split(' ');
  const pages = [];
  let s = 0;
  while(s < words.length){
    let lo = s + 1, hi = words.length, best = s + 1;
    while(lo <= hi){
      const mid = (lo + hi) >> 1;
      rt.textContent = words.slice(s, mid).join(' ') + (mid < words.length ? ' \u2026' : '');
      if(fits()){ best = mid; lo = mid + 1; } else { hi = mid - 1; }
    }
    pages.push(words.slice(s, best).join(' ') + (best < words.length ? ' \u2026' : ''));
    s = best;
  }
  return { size, pages };
}

function renderReader(){
  const d = currentDays[currentDayIndex];
  const v = d.verses[currentVerseIndex];
  const numReaders = getReaderCount(currentDayIndex);
  const reader = readerForVerse(currentVerseIndex, numReaders);

  // Single status line: "Esther 1:8  ·  Reader 2" (reader omitted if only 1)
  const statusParts = [v.book + ':' + v.num];
  if(numReaders > 1) statusParts.push('Reader ' + reader);
  document.getElementById('readerBook').textContent = statusParts.join('  \u00b7  ');
  const readerText = document.getElementById('readerText');
  const layout = layoutVerse(v.text);
  currentPartCount = layout.pages.length;
  if(currentPart < 0 || currentPart >= currentPartCount) currentPart = currentPart < 0 ? currentPartCount - 1 : 0;
  readerText.style.fontSize = layout.size + 'px';
  readerText.textContent = layout.pages[currentPart];
  if(currentPartCount > 1){
    statusParts.push('Part ' + (currentPart + 1) + ' of ' + currentPartCount);
    document.getElementById('readerBook').textContent = statusParts.join('  \u00b7  ');
  }

  document.getElementById('dayRange').textContent = d.name + ': ' + dayRangeLabel(d);

  const isFirst = currentVerseIndex === 0 && currentDayIndex === 0 && currentPart === 0;
  const isLast  = currentVerseIndex === d.verses.length - 1 && currentDayIndex === currentDays.length - 1 && currentPart === currentPartCount - 1;
  document.getElementById('prevBtn').disabled = isFirst;
  document.getElementById('nextBtn').disabled = isLast;

  document.getElementById('progressLabel').textContent =
    d.name + ' \u00b7 Verse ' + (currentVerseIndex + 1) + ' of ' + d.verses.length;
  document.getElementById('progressFill').style.width =
    ((currentVerseIndex + 1) / d.verses.length * 100) + '%';

  // Jump grid — one button per verse, small reader label if multiple readers
  const grid = document.getElementById('jumpGrid');
  grid.innerHTML = '';
  d.verses.forEach((vv, idx) => {
    const btn = document.createElement('button');
    btn.className = 'jump-btn' + (idx === currentVerseIndex ? ' current' : '');
    if(numReaders > 1){
      const r = readerForVerse(idx, numReaders);
      btn.innerHTML = vv.num + '<div style="font-size:0.6rem;color:var(--ink-soft);font-weight:600">R' + r + '</div>';
    } else {
      btn.textContent = vv.num;
    }
    btn.addEventListener('click', () => { currentVerseIndex = idx; currentPart = 0; renderReader(); document.getElementById('jumpPanel').classList.remove('open'); });
    grid.appendChild(btn);
  });

  if(currentVerseIndex === d.verses.length - 1) saveProgress(currentWeek.id, currentDayIndex);

  // Reader count display
  document.getElementById('readerCountDisplay').textContent =
    numReaders === 1 ? '1 reader' : numReaders + ' readers';

  buildDayNav();
}

let _rz;
window.addEventListener('resize', () => { clearTimeout(_rz); _rz = setTimeout(() => { if(document.getElementById('readerView').classList.contains('active')){ currentPart = 0; renderReader(); } }, 150); });

function goNext(){
  const d = currentDays[currentDayIndex];
  if(currentPart < currentPartCount - 1){ currentPart++; renderReader(); return; }
  currentPart = 0;
  if(currentVerseIndex < d.verses.length - 1){ currentVerseIndex++; renderReader(); }
  else if(currentDayIndex < currentDays.length - 1){ currentDayIndex++; currentVerseIndex = 0; renderReader(); }
}
function goPrev(){
  if(currentPart > 0){ currentPart--; renderReader(); return; }
  if(currentVerseIndex > 0){ currentVerseIndex--; currentPart = -1; renderReader(); }
  else if(currentDayIndex > 0){ currentDayIndex--; currentVerseIndex = currentDays[currentDayIndex].verses.length - 1; currentPart = -1; renderReader(); }
}

document.getElementById('prevBtn').addEventListener('click', goPrev);
document.getElementById('nextBtn').addEventListener('click', goNext);
document.getElementById('backBtn').addEventListener('click', showPicker);

document.getElementById('readerCountDown').addEventListener('click', () => {
  const cur = getReaderCount(currentDayIndex);
  if(cur > 1){ readerCounts[currentDayIndex] = cur - 1; renderReader(); }
});
document.getElementById('readerCountUp').addEventListener('click', () => {
  const cur = getReaderCount(currentDayIndex);
  if(cur < 9){ readerCounts[currentDayIndex] = cur + 1; renderReader(); }
});

const jumpToggle = document.getElementById('jumpToggle');
const jumpPanel  = document.getElementById('jumpPanel');
jumpToggle.addEventListener('click', () => { jumpPanel.classList.toggle('open'); });

document.addEventListener('keydown', (e) => {
  if(!document.getElementById('readerView').classList.contains('active')) return;
  if(document.activeElement && (
    document.activeElement.classList.contains('jump-btn') ||
    document.activeElement.classList.contains('day-chip') ||
    document.activeElement.classList.contains('reader-count-btn')
  )) return;
  if(e.key === 'ArrowRight' || e.key === 'ArrowDown'){ e.preventDefault(); goNext(); }
  else if(e.key === 'ArrowLeft' || e.key === 'ArrowUp'){ e.preventDefault(); goPrev(); }
  else if(e.key === 'Escape' || e.key === 'Backspace'){ e.preventDefault(); showPicker(); }
});

buildPicker();
showPicker();

</script>
</body>
</html>
