<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Come, Follow Me — Old Testament 2026</title>
<style>
  :root{
    --paper: #F7F3EA;
    --paper-dim: #EFE9D8;
    --ink: #3D3A34;
    --ink-soft: #6b6657;
    --indigo: #2B2E4A;
    --walnut: #8B5E3C;
    --gold: #C9A063;
    --rule: #d9d0b8;
    --focus: #C9A063;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0; height:100%;}
  body{
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
    height: 100vh;
    overflow: hidden;
  }
  .display{ font-family: 'Source Serif 4', Georgia, serif; }

  /* ============ VIEW SWITCHING ============ */
  .view{ display: none; height: 100vh; }
  .view.active{ display: flex; flex-direction: column; }

  /* ============ PICKER VIEW ============ */
  #pickerView{
    overflow-y: auto;
  }
  .picker-wrap{
    max-width: 1100px;
    margin: 0 auto;
    padding: 40px 48px 60px;
    width: 100%;
  }
  .picker-header{
    border-bottom: 2px solid var(--ink);
    padding-bottom: 20px;
    margin-bottom: 36px;
  }
  .picker-eyebrow{
    font-size: 0.95rem; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--walnut); font-weight: 700; margin-bottom: 6px;
  }
  .picker-header h1{ font-size: 2.2rem; margin: 0; font-weight: 600; }
  .picker-sub{ color: var(--ink-soft); font-size: 1.05rem; margin-top: 8px; }

  .week-grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 18px;
  }
  .week-card{
    display: block;
    text-align: left;
    text-decoration: none;
    color: var(--ink);
    background: var(--paper-dim);
    border: 2px solid var(--rule);
    border-radius: 10px;
    padding: 22px 24px;
    cursor: pointer;
    font-family: inherit;
    transition: border-color 0.15s ease;
  }
  .week-card:hover, .week-card:focus{
    outline: none;
    border-color: var(--walnut);
    box-shadow: 0 0 0 3px var(--focus);
  }
  .week-card .dates{
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--walnut);
    letter-spacing: 0.03em;
    margin-bottom: 6px;
  }
  .week-card .week-title{
    font-family: 'Source Serif 4', Georgia, serif;
    font-size: 1.3rem;
    font-weight: 600;
    margin-bottom: 8px;
    line-height: 1.25;
  }
  .week-card .week-ref{
    font-size: 0.9rem;
    color: var(--ink-soft);
  }

  .coming-soon{
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px dashed var(--rule);
    border-radius: 10px;
    padding: 22px 24px;
    color: var(--ink-soft);
    font-size: 0.95rem;
    text-align: center;
  }

  .picker-footer{
    margin-top: 44px;
    padding-top: 20px;
    border-top: 1px solid var(--rule);
    color: var(--ink-soft);
    font-size: 0.9rem;
  }

  /* ============ READER VIEW ============ */
  #readerView .app{
    max-width: 1300px;
    margin: 0 auto;
    padding: 8px 24px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    width: 100%;
  }

  .topbar{
    display:flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex: 0 0 auto;
    margin-bottom: 2px;
  }
  .topbar .title-block{ flex: 0 0 auto; min-width: 0; }

  .back-link{
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--ink);
    text-decoration: none;
    margin-bottom: 4px;
    padding: 4px 10px;
    border: 2px solid var(--rule);
    border-radius: 7px;
    background: var(--paper);
    cursor: pointer;
    font-family: inherit;
  }
  .back-link svg{ width: 16px; height: 16px; flex: 0 0 auto; }
  .back-link:hover{ border-color: var(--walnut); color: var(--walnut); }
  .back-link:focus{
    outline: none;
    border-color: var(--walnut);
    color: var(--walnut);
    box-shadow: 0 0 0 4px var(--focus);
  }

  .topbar .eyebrow{
    font-size: 0.65rem; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--walnut); font-weight: 700;
  }
  .topbar h1{
    font-size: 0.95rem; margin:0; font-weight:600; line-height:1.1;
    white-space: nowrap; overflow:hidden; text-overflow: ellipsis;
  }
  .week-range{
    font-size: 0.72rem;
    color: var(--ink-soft);
    margin: 1px 0 4px;
  }
  .day-range{
    font-size: 0.72rem;
    color: var(--ink-soft);
    text-align: right;
    margin-top: 2px;
  }

  .day-nav{
    display:flex;
    gap: 5px;
    flex: 1 1 auto;
    justify-content: flex-end;
  }
  .day-chip{
    flex: 0 0 auto;
    text-align: center;
    padding: 3px 7px;
    border-radius: 5px;
    border: 2px solid var(--rule);
    background: var(--paper);
    color: var(--ink);
    font-size: 0.65rem;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
  }
  .day-chip.active{
    background: var(--walnut);
    border-color: var(--walnut);
    color: var(--paper);
  }
  .day-chip.done{ border-color: var(--gold); }
  .day-chip:focus{ outline:none; box-shadow: 0 0 0 4px var(--focus); }

  .reader-card{
    background: var(--indigo);
    color: var(--paper);
    border-radius: 14px;
    padding: 2vh 4vw;
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    position: relative;
    margin-bottom: 8px;
    overflow: hidden;
  }
  .reader-book{
    font-size: clamp(0.75rem, 1.1vw, 0.95rem);
    color: var(--gold);
    font-weight: 700;
    letter-spacing: 0.03em;
    margin-bottom: 0.5vh;
    flex: 0 0 auto;
    opacity: 0.85;
  }
  .reader-text{
    font-size: clamp(1.6rem, 4.5vw, 3.4rem);
    line-height: 1.4;
    font-family: 'Source Serif 4', Georgia, serif;
    flex: 0 0 auto;
  }

  .reader-controls{
    display:flex;
    align-items:center;
    justify-content: space-between;
    gap: 8px;
    flex: 0 0 auto;
  }
  .nav-btn{
    flex: 0 0 auto;
    display:flex; align-items:center; gap: 7px;
    padding: 5px 12px;
    border-radius: 6px;
    border: 2px solid var(--indigo);
    background: var(--paper);
    color: var(--indigo);
    font-size: 0.72rem;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
  }
  .nav-btn:disabled{ opacity: 0.35; cursor: default; }
  .nav-btn:focus{ outline:none; box-shadow: 0 0 0 4px var(--focus); }
  .nav-btn svg{ width: 16px; height: 16px; }

  .progress{
    flex: 1;
    text-align: center;
    color: var(--ink-soft);
    font-size: 0.78rem;
    font-weight: 600;
  }
  .progress-bar{
    height: 3px;
    border-radius: 3px;
    background: var(--rule);
    margin-top: 6px;
    overflow: hidden;
  }
  .progress-fill{
    height: 100%;
    background: var(--walnut);
    border-radius: 3px;
    transition: width 0.2s ease;
  }

  .jump-toggle-row{ flex: 0 0 auto; text-align: center; margin-top: 2px; }
  .jump-toggle{
    background: none; border: none; color: var(--ink-soft);
    font-family: inherit; font-size: 0.72rem; font-weight: 600;
    text-decoration: underline; cursor: pointer; padding: 6px 10px;
  }
  .jump-toggle:focus{ outline:none; box-shadow: 0 0 0 3px var(--focus); border-radius: 4px; }

  .jump-panel{ flex: 0 0 auto; max-height: 0; overflow: hidden; transition: max-height 0.2s ease; }
  .jump-panel.open{ max-height: 160px; overflow-y: auto; margin-top: 10px; }
  .jump-grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(50px, 1fr));
    gap: 6px;
  }
  .jump-btn{
    padding: 9px 0; text-align:center; border-radius: 6px;
    border: 1px solid var(--rule); background: var(--paper); color: var(--ink-soft);
    font-weight: 700; cursor: pointer; font-family: inherit; font-size: 0.9rem;
  }
  .jump-btn.current{ background: var(--gold); color: var(--indigo); border-color: var(--gold); }
  .jump-btn:focus{ outline:none; box-shadow: 0 0 0 3px var(--focus); }


  /* Reader label shown above verse block */

  /* Verse block: multiple verses stacked */
  .verse-block{ overflow-y: auto; flex: 1 1 auto; min-height: 0; }
  .verse-item{
    display: flex;
    gap: 16px;
    margin-bottom: 1.4vh;
    align-items: baseline;
  }
  .verse-item .vnum{
    flex: 0 0 auto;
    font-size: clamp(0.8rem, 1.2vw, 1rem);
    font-weight: 800;
    color: var(--gold);
    opacity: 0.75;
    min-width: 2ch;
    text-align: right;
  }
  .verse-item .vtext{
    flex: 1;
    font-size: clamp(1.4rem, 3.2vw, 2.6rem);
    line-height: 1.45;
    font-family: 'Source Serif 4', Georgia, serif;
  }

  /* Reader count control */
  .reader-count-row{
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 4px;
    justify-content: center;
  }
  .reader-count-label{
    font-size: 0.72rem;
    color: var(--ink-soft);
    font-weight: 600;
  }
  .reader-count-btn{
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 2px solid var(--rule);
    background: var(--paper);
    color: var(--ink);
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    display: flex; align-items: center; justify-content: center;
  }
  .reader-count-btn:focus{ outline:none; box-shadow: 0 0 0 3px var(--focus); }
  .reader-count-display{
    font-size: 1rem;
    font-weight: 700;
    color: var(--ink);
    min-width: 80px;
    text-align: center;
  }

  @media (max-width: 700px){
    .picker-wrap{ padding: 24px 20px 50px; }
    .week-grid{ grid-template-columns: 1fr; }
    #readerView .app{ padding: 12px 16px; }
    .topbar{ flex-wrap: wrap; }
    .day-nav{ width: 100%; justify-content: space-between; }
    .day-chip{ flex: 1 1 0; padding: 8px 4px; font-size: 0.82rem; }
    .day-range{ text-align: left; }
    .reader-card{ padding: 2vh 4vw; }
    .reader-text{ font-size: clamp(1.4rem, 6vw, 2.2rem); }
    .nav-btn{ padding: 12px 16px; font-size: 0.95rem; }
  }
</style>
</head>
<body>

<!-- ============ PICKER VIEW ============ -->
<div class="view active" id="pickerView">
  <div class="picker-wrap">
    <div class="picker-header">
      <div class="picker-eyebrow">Come, Follow Me · Old Testament 2026</div>

    </div>
    <div class="week-grid" id="weekGrid"></div>
    <div class="picker-footer">
      Scripture text is the King James Version, public domain in the United States.
    </div>
  </div>
</div>

<!-- ============ READER VIEW ============ -->
<div class="view" id="readerView">
  <div class="app">

    <div class="topbar">
      <div class="title-block">
        <button class="back-link" id="backBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
          All weeks
        </button>
        <div class="eyebrow" id="weekEyebrow">&nbsp;</div>
        <h1 class="display" id="weekTitle">&nbsp;</h1>
        <div class="week-range" id="weekRange">&nbsp;</div>
      </div>
      <div>
        <div class="day-nav" id="dayNav"></div>
        <div class="day-range" id="dayRange">&nbsp;</div>
      </div>
    </div>

    <div class="reader-card">
      <div class="reader-book" id="readerBook">—</div>
      <div class="reader-text" id="readerText">—</div>
    </div>

    <div class="reader-controls">
      <button class="nav-btn" id="prevBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
        Previous
      </button>
      <div class="progress">
        <span id="progressLabel">Verse 1 of 1</span>
        <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
      </div>
      <button class="nav-btn" id="nextBtn">
        Next
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </button>
    </div>

    <div class="jump-toggle-row">
      <button class="jump-toggle" id="jumpToggle">Jump to verse</button>
    </div>
    <div class="jump-panel" id="jumpPanel">
      <div class="jump-grid" id="jumpGrid"></div>
    </div>

    <div class="reader-count-row">
      <span class="reader-count-label">Readers today:</span>
      <button class="reader-count-btn" id="readerCountDown">−</button>
      <span class="reader-count-display" id="readerCountDisplay">1 reader</span>
      <button class="reader-count-btn" id="readerCountUp">+</button>
    </div>

  </div>
</div>

const PASSAGES_w40 = [{"id":"isa40","book":"Isaiah 40","heading":"Comfort Ye My People","verses":[[1,"Comfort ye, comfort ye my people, saith your God."],[2,"Speak ye comfortably to Jerusalem, and cry unto her, that her warfare is accomplished, that her iniquity is pardoned: for she hath received of the LORD'S hand double for all her sins."],[3,"The voice of him that crieth in the wilderness, Prepare ye the way of the LORD, make straight in the desert a highway for our God."],[4,"Every valley shall be exalted, and every mountain and hill shall be made low: and the crooked shall be made straight, and the rough places plain:"],[5,"And the glory of the LORD shall be revealed, and all flesh shall see it together: for the mouth of the LORD hath spoken it."],[6,"The voice said, Cry. And he said, What shall I cry? All flesh is grass, and all the goodliness thereof is as the flower of the field:"],[7,"The grass withereth, the flower fadeth: because the spirit of the LORD bloweth upon it: surely the people is grass."],[8,"The grass withereth, the flower fadeth: but the word of our God shall stand for ever."],[9,"O Zion, that bringest good tidings, get thee up into the high mountain; O Jerusalem, that bringest good tidings, lift up thy voice with strength; lift it up, be not afraid; say unto the cities of Judah, Behold your God!"],[10,"Behold, the Lord GOD will come with strong hand, and his arm shall rule for him: behold, his reward is with him, and his work before him."],[11,"He shall feed his flock like a shepherd: he shall gather the lambs with his arm, and carry them in his bosom, and shall gently lead those that are with young."],[12,"Who hath measured the waters in the hollow of his hand, and meted out heaven with the span, and comprehended the dust of the earth in a measure, and weighed the mountains in scales, and the hills in a balance?"],[13,"Who hath directed the Spirit of the LORD, or being his counsellor hath taught him?"],[14,"With whom took he counsel, and who wn? hast thou not heard, that the everlasting God, the LORD, the Creator of the ends of the earth, fainteth not, neither is weary? there is no searching of his understanding."],[29,"He giveth power to the faint; and to them that have no might he increaseth strength."],[30,"Even the youths shall faint and be weary, and the young men shall utterly fall:"],[31,"But they that wait upon the LORD shall renew their strength; they shall mount up with wings as eagles; they shall run, and not be weary; and they shall walk, and not faint."]]},{"id":"isa41","book":"Isaiah 41","heading":"Fear Thou Not; I Am with Thee","verses":[[1,"Keep silence before me, O islands; and let the people renew their strength: let them come near; then let them speak: let us come near together to judgment."],[2,"Who raised up the righteous man from the east, called him to his foot, gave the nations before him, and made him rule over kings? he gave them as the dust to his sword, and as driven stubble to his bow."],[3,"He pursued them, and passed safely; even by the way that he had not gone with his feet."],[4,"Who hath wrought and done it, calling the generations from the beginning? I the LORD, the first, and with the last; I am he."],[5,"The isles saw it, and feared; the ends of the earth were afraid, drew near, and came."],[6,"They helped every one his neighbour; and every one said to his brother, Be of good courage."],[7,"So the carpenter encouraged the goldsmith, and he that smootheth with the hammer him that smote the anvil, saying, It is ready for the sodering: and he fastened it with nails, that it should not be moved."],[8,"But thou, Israel, art my servant, Jacob whom I have chosen, the seed of Abraham my friend."],[9,"Thou whom I have taken from the ends of the earth, and called thee from the chief men thereof, and said unto thee, Thou art my servant; I have chosen thee, and not cast thee away."],[10,"Fear thou not; for I am with thee: be not dismayed; for I am thy God: I will strengthen thee s that are to come hereafter, that we may know that ye are gods: yea, do good, or do evil, that we may be dismayed, and behold it together."],[24,"Behold, ye are of nothing, and your work of nought: an abomination is he that chooseth you."],[25,"I have raised up one from the north, and he shall come: from the rising of the sun shall he call upon my name: and he shall come upon princes as upon morter, and as the potter treadeth clay."],[26,"Who hath declared from the beginning, that we may know? and beforetime, that we may say, He is righteous? yea, there is none that sheweth, yea, there is none that declareth, yea, there is none that heareth your words."],[27,"The first shall say to Zion, Behold, behold them: and I will give to Jerusalem one that bringeth good tidings."],[28,"For I beheld, and there was no man; even among them, and there was no counsellor, that, when I asked of them, could answer a word."],[29,"Behold, they are all vanity; their works are nothing: their molten images are wind and confusion."]]},{"id":"isa42","book":"Isaiah 42","heading":"Behold My Servant","verses":[[1,"Behold my servant, whom I uphold; mine elect, in whom my soul delighteth; I have put my spirit upon him: he shall bring forth judgment to the Gentiles."],[2,"He shall not cry, nor lift up, nor cause his voice to be heard in the street."],[3,"A bruised reed shall he not break, and the smoking flax shall he not quench: he shall bring forth judgment unto truth."],[4,"He shall not fail nor be discouraged, till he have set judgment in the earth: and the isles shall wait for his law."],[5,"Thus saith God the LORD, he that created the heavens, and stretched them out; he that spread forth the earth, and that which cometh out of it; he that giveth breath unto the people upon it, and spirit to them that walk therein:"],[6,"I the LORD have called thee in righteousness, and will hold thine hand, and will keep thee, and give thee for a covenant of the people, for a light of the Gentiles;"],[7,"To  magnify the law, and make it honourable."],[22,"But this is a people robbed and spoiled; they are all of them snared in holes, and they are hid in prison houses: they are for a prey, and none delivereth; for a spoil, and none saith, Restore."],[23,"Who among you will give ear to this? who will hearken and hear for the time to come?"],[24,"Who gave Jacob for a spoil, and Israel to the robbers? did not the LORD, he against whom we have sinned? for they would not walk in his ways, neither were they obedient unto his law."],[25,"Therefore he hath poured upon him the fury of his anger, and the strength of battle: and it hath set him on fire round about, yet he knew not; and it burned him, yet he laid it not to heart."]]},{"id":"isa43","book":"Isaiah 43","heading":"Thou Art Mine","verses":[[1,"But now thus saith the LORD that created thee, O Jacob, and he that formed thee, O Israel, Fear not: for I have redeemed thee, I have called thee by thy name; thou art mine."],[2,"When thou passest through the waters, I will be with thee; and through the rivers, they shall not overflow thee: when thou walkest through the fire, thou shalt not be burned; neither shall the flame kindle upon thee."],[3,"For I am the LORD thy God, the Holy One of Israel, thy Saviour: I gave Egypt for thy ransom, Ethiopia and Seba for thee."],[4,"Since thou wast precious in my sight, thou hast been honourable, and I have loved thee: therefore will I give men for thee, and people for thy life."],[5,"Fear not: for I am with thee: I will bring thy seed from the east, and gather thee from the west;"],[6,"I will say to the north, Give up; and to the south, Keep not back: bring my sons from far, and my daughters from the ends of the earth;"],[7,"Even every one that is called by my name: for I have created him for my glory, I have formed him; yea, I have made him."],[8,"Bring forth the blind people that have eyes, and the deaf that have ears."],[9,"Let all the nations be gathered together, and let the people be ve with an offering, nor wearied thee with incense."],[24,"Thou hast bought me no sweet cane with money, neither hast thou filled me with the fat of thy sacrifices: but thou hast made me to serve with thy sins, thou hast wearied me with thine iniquities."],[25,"I, even I, am he that blotteth out thy transgressions for mine own sake, and will not remember thy sins."],[26,"Put me in remembrance: let us plead together: declare thou, that thou mayest be justified."],[27,"Thy first father hath sinned, and thy teachers have transgressed against me."],[28,"Therefore I have profaned the princes of the sanctuary, and have given Jacob to the curse, and Israel to reproaches."]]},{"id":"isa44","book":"Isaiah 44","heading":"Beside Me There Is No God","verses":[[1,"Yet now hear, O Jacob my servant; and Israel, whom I have chosen:"],[2,"Thus saith the LORD that made thee, and formed thee from the womb, which will help thee; Fear not, O Jacob, my servant; and thou, Jesurun, whom I have chosen."],[3,"For I will pour water upon him that is thirsty, and floods upon the dry ground: I will pour my spirit upon thy seed, and my blessing upon thine offspring:"],[4,"And they shall spring up as among the grass, as willows by the water courses."],[5,"One shall say, I am the LORD'S; and another shall call himself by the name of Jacob; and another shall subscribe with his hand unto the LORD, and surname himself by the name of Israel."],[6,"Thus saith the LORD the King of Israel, and his redeemer the LORD of hosts; I am the first, and I am the last; and beside me there is no God."],[7,"And who, as I, shall call, and shall declare it, and set it in order for me, since I appointed the ancient people? and the things that are coming, and shall come, let them shew unto them."],[8,"Fear ye not, neither be afraid: have not I told thee from that time, and have declared it? ye are even my witnesses. Is there a God beside me? yea, there is no God; I know not any."],[9,"They that make a graven image are all of them vanity; and their delectable things shall not profit; and they are their own witnesses; they see not, nor know; that they may be ashamed."],[10,"Who hath formed a god, or molten a graven image that is profitable for nothing?"],[11,"Behold, all his fellows shall be ashamed: and the workmen, they are of men: let them all be gathered together, let them stand up; yet they shall fear, and they shall be ashamed together."],[12,"The smith with the tongs both worketh in the coals, and fashioneth it with hammers, and worketh it with the strength of his arms: yea, he is hungry, and his strength faileth: he drinketh no water, and is faint."],[13,"The carpenter stretcheth out his rule; he marketh it out with a line; he fitteth it with planes, and he marketh it out with the compass, and maketh it after the figure of a man, according to the beauty of a man; that it may remain in the house."],[14,"He heweth him down cedars, and taketh the cypress and the oak, which he strengtheneth for himself among the trees of the forest: he planteth an ash, and the rain doth nourish it."],[15,"Then shall it be for a man to burn: for he will take thereof, and warm himself; yea, he kindleth it, and baketh bread; yea, he maketh a god, and worshippeth it; he maketh it a graven image, and falleth down thereto."],[16,"He burneth part thereof in the fire; with part thereof he eateth flesh; he roasteth roast, and is satisfied: yea, he warmeth himself, and saith, Aha, I am warm, I have seen the fire:"],[17,"And the residue thereof he maketh a god, even his graven image: he falleth down unto it, and worshippeth it, and prayeth unto it, and saith, Deliver me; for thou art my god."],[18,"They have not known nor understood: for he hath shut their eyes, that they cannot see; and their hearts, that they cannot understand."],[19,"And none considereth in his heart, neither is there knowledge nor understanding to say, I have burned part of it in the fire; yea, also I have baked bread upon the coals thereof; I have roasted flesh, and eaten it: and shall I make the residue thereof an abomination? shall I fall down to the stock of a tree?"],[20,"He feedeth on ashes: a deceived heart hath turned him aside, that he cannot deliver his soul, nor say, Is there not a lie in my right hand?"],[21,"Remember these, O Jacob and Israel; for thou art my servant: I have formed thee; thou art my servant: O Israel, thou shalt not be forgotten of me."],[22,"I have blotted out, as a thick cloud, thy transgressions, and, as a cloud, thy sins: return unto me; for I have redeemed thee."],[23,"Sing, O ye heavens; for the LORD hath done it: shout, ye lower parts of the earth: break forth into singing, ye mountains, O forest, and every tree therein: for the LORD hath redeemed Jacob, and glorified himself in Israel."],[24,"Thus saith the LORD, thy redeemer, and he that formed thee from the womb, I am the LORD that maketh all things; that stretcheth forth the heavens alone; that spreadeth abroad the earth by myself;"],[25,"That frustrateth the tokens of the liars, and maketh diviners mad; that turneth wise men backward, and maketh their knowledge foolish;"],[26,"That confirmeth the word of his servant, and performeth the counsel of his messengers; that saith to Jerusalem, Thou shalt be inhabited; and to the cities of Judah, Ye shall be built, and I will raise up the decayed places thereof:"],[27,"That saith to the deep, Be dry, and I will dry up thy rivers:"],[28,"That saith of Cyrus, He is my shepherd, and shall perform all my pleasure: even saying to Jerusalem, Thou shalt be built; and to the temple, Thy foundation shall be laid."]]},{"id":"isa45","book":"Isaiah 45","heading":"Cyrus, the Lord's Anointed","verses":[[1,"Thus saith the LORD to his anointed, to Cyrus, whose right hand I have holden, to subdue nations before him; and I will loose the loins of kings, to open before him the two leaved gates; and the gates shall not be shut;"],[2,"I will go before thee, and make the crooked places straight: I will break in pieces the gates of brass, and cut in sunder the bars of iron:"],[3,"And I will give thee the treasures of darkness, and hidden riches of secret places, that thou mayest know that I, the LORD, which call thee by thy name, am the God of Israel."],[4,"For Jacob my servant's sake, and Israel mine elect, I have even called thee by thy name: I have surnamed thee, though thou hast not known me."],[5,"I am the LORD, and there is none else, there is no God beside me: I girded thee, though thou hast not known me:"],[6,"That they may know from the rising of the sun, and from the west, that there is none beside me. I am the LORD, and there is none else."],[7,"I form the light, and create darkness: I make peace, and create evil: I the LORD do all these things."],[8,"Drop down, ye heavens, from above, and let the skies pour down righteousness: let the earth open, and let them bring forth salvation, and let righteousness spring up together; I the LORD have created it."],[9,"Woe unto him that striveth with his Maker! Let the potsherd strive with the potsherds of the earth. Shall the clay say to him that fashioneth it, What makest thou? or thy work, He hath no hands?"],[10,"Woe unto him that saith unto his father, What begettest thou? or to the woman, What hast thou brought forth?"],[11,"Thus saith the LORD, the Holy One of Israel, and his Maker, Ask me of things to come concerning my sons, and concerning the work of my hands command ye me."],[12,"I have made the earth, and created man upon it: I, even my hands, have stretched out the heavens, and all their host have I commanded."],[13,"I have raised him up in righteousness, and I will direct all his ways: he shall build my city, and he shall let go my captives, not for price nor reward, saith the LORD of hosts."],[14,"Thus saith the LORD, The labour of Egypt, and merchandise of Ethiopia and of the Sabeans, men of stature, shall come over unto thee, and they shall be thine: they shall come after thee; in chains they shall come over, and they shall fall down unto thee, they shall make supplication unto thee, saying, Surely God is in thee; and there is none else, there is no God."],[15,"Verily thou art a God that hidest thyself, O God of Israel, the Saviour."],[16,"They shall be ashamed, and also confounded, all of them: they shall go to confusion together that are makers of idols."],[17,"But Israel shall be saved in the LORD with an everlasting salvation: ye shall not be ashamed nor confounded world without end."],[18,"For thus saith the LORD that created the heavens; God himself that formed the earth and made it; he hath established it, he created it not in vain, he formed it to be inhabited: I am the LORD; and there is none else."],[19,"I have not spoken in secret, in a dark place of the earth: I said not unto the seed of Jacob, Seek ye me in vain: I the LORD speak righteousness, I declare things that are right."],[20,"Assemble yourselves and come; draw near together, ye that are escaped of the nations: they have no knowledge that set up the wood of their graven image, and pray unto a god that cannot save."],[21,"Tell ye, and bring them near; yea, let them take counsel together: who hath declared this from ancient time? who hath told it from that time? have not I the LORD? and there is no God else beside me; a just God and a Saviour; there is none beside me."],[22,"Look unto me, and be ye saved, all the ends of the earth: for I am God, and there is none else."],[23,"I have sworn by myself, the word is gone out of my mouth in righteousness, and shall not return, That unto me every knee shall bow, every tongue shall swear."],[24,"Surely, shall one say, in the LORD have I righteousness and strength: even to him shall men come; and all that are incensed against him shall be ashamed."],[25,"In the LORD shall all the seed of Israel be justified, and shall glory."]]},{"id":"isa46","book":"Isaiah 46","heading":"Idols Cannot Save","verses":[[1,"Bel boweth down, Nebo stoopeth, their idols were upon the beasts, and upon the cattle: your carriages were heavy loaden; they are a burden to the weary beast."],[2,"They stoop, they bow down together; they could not deliver the burden, but themselves are gone into captivity."],[3,"Hearken unto me, O house of Jacob, and all the remnant of the house of Israel, which are borne by me from the belly, which are carried from the womb:"],[4,"And even to your old age I am he; and even to hoar hairs will I carry you: I have made, and I will bear; even I will carry, and will deliver you."],[5,"To whom will ye liken me, and make me equal, and compare me, that we may be like?"],[6,"They lavish gold out of the bag, and weigh silver in the balance, and hire a goldsmith; and he maketh it a god: they fall down, yea, they worship."],[7,"They bear him upon the shoulder, they carry him, and set him in his place, and he standeth; from his place shall he not remove: yea, one shall cry unto him, yet can he not answer, nor save him out of his trouble."],[8,"Remember this, and shew yourselves men: bring it again to mind, O ye transgressors."],[9,"Remember the former things of old: for I am God, and there is none else; I am God, and there is none like me,"],[10,"Declaring the end from the beginning, and from ancient times the things that are not yet done, saying, My counsel shall stand, and I will do all my pleasure:"],[11,"Calling a ravenous bird from the east, the man that executeth my counsel from a far country: yea, I have spoken it, I will also bring it to pass; I have purposed it, I will also do it."],[12,"Hearken unto me, ye stouthearted, that are far from righteousness:"],[13,"I bring near my righteousness; it shall not be far off, and my salvation shall not tarry: and I will place salvation in Zion for Israel my glory."]]},{"id":"isa47","book":"Isaiah 47","heading":"The Fall of Babylon","verses":[[1,"Come down, and sit in the dust, O virgin daughter of Babylon, sit on the ground: there is no throne, O daughter of the Chaldeans: for thou shalt no more be called tender and delicate."],[2,"Take the millstones, and grind meal: uncover thy locks, make bare the leg, uncover the thigh, pass over the rivers."],[3,"Thy nakedness shall be uncovered, yea, thy shame shall be seen: I will take vengeance, and I will not meet thee as a man."],[4,"As for our redeemer, the LORD of hosts is his name, the Holy One of Israel."],[5,"Sit thou silent, and get thee into darkness, O daughter of the Chaldeans: for thou shalt no more be called, The lady of kingdoms."],[6,"I was wroth with my people, I have polluted mine inheritance, and given them into thine hand: thou didst shew them no mercy; upon the ancient hast thou very heavily laid thy yoke."],[7,"And thou saidst, I shall be a lady for ever: so that thou didst not lay these things to thy heart, neither didst remember the latter end of it."],[8,"Therefore hear now this, thou that art given to pleasures, that dwellest carelessly, that sayest in thine heart, I am, and none else beside me; I shall not sit as a widow, neither shall I know the loss of children:"],[9,"But these two things shall come to thee in a moment in one day, the loss of children, and widowhood: they shall come upon thee in their perfection for the multitude of thy sorceries, and for the great abundance of thine enchantments."],[10,"For thou hast trusted in thy wickedness: thou hast said, None seeth me. Thy wisdom and thy knowledge, it hath perverted thee; and thou hast said in thine heart, I am, and none else beside me."],[11,"Therefore shall evil come upon thee; thou shalt not know from whence it riseth: and mischief shall fall upon thee; thou shalt not be able to put it off: and desolation shall come upon thee suddenly, which thou shalt not know."],[12,"Stand now with thine enchantments, and with the multitude of thy sorceries, wherein thou hast laboured from thy youth; if so be thou shalt be able to profit, if so be thou mayest prevail."],[13,"Thou art wearied in the multitude of thy counsels. Let now the astrologers, the stargazers, the monthly prognosticators, stand up, and save thee from these things that shall come upon thee."],[14,"Behold, they shall be as stubble; the fire shall burn them; they shall not deliver themselves from the power of the flame: there shall not be a coal to warm at, nor fire to sit before it."],[15,"Thus shall they be unto thee with whom thou hast laboured, even thy merchants, from thy youth: they shall wander every one to his quarter; none shall save thee."]]},{"id":"isa48","book":"Isaiah 48","heading":"Chosen in the Furnace of Affliction","verses":[[1,"Hear ye this, O house of Jacob, which are called by the name of Israel, and are come forth out of the waters of Judah, which swear by the name of the LORD, and make mention of the God of Israel, but not in truth, nor in righteousness."],[2,"For they call themselves of the holy city, and stay themselves upon the God of Israel; The LORD of hosts is his name."],[3,"I have declared the former things from the beginning; and they went forth out of my mouth, and I shewed them; I did them suddenly, and they came to pass."],[4,"Because I knew that thou art obstinate, and thy neck is an iron sinew, and thy brow brass;"],[5,"I have even from the beginning declared it to thee; before it came to pass I shewed it thee: lest thou shouldest say, Mine idol hath done them, and my graven image, and my molten image, hath commanded them."],[6,"Thou hast heard, see all this; and will not ye declare it? I have shewed thee new things from this time, even hidden things, and thou didst not know them."],[7,"They are created now, and not from the beginning; even before the day when thou heardest them not; lest thou shouldest say, Behold, I knew them."],[8,"Yea, thou heardest not; yea, thou knewest not; yea, from that time that thine ear was not opened: for I knew that thou wouldest deal very treacherously, and wast called a transgressor from the womb."],[9,"For my name's sake will I defer mine anger, and for my praise will I refrain for thee, that I cut thee not off."],[10,"Behold, I have refined thee, but not with silver; I have chosen thee in the furnace of affliction."],[11,"For mine own sake, even for mine own sake, will I do it: for how should my name be polluted? and I will not give my glory unto another."],[12,"Hearken unto me, O Jacob and Israel, my called; I am he; I am the first, I also am the last."],[13,"Mine hand also hath laid the foundation of the earth, and my right hand hath spanned the heavens: when I call unto them, they stand up together."],[14,"All ye, assemble yourselves, and hear; which among them hath declared these things? The LORD hath loved him: he will do his pleasure on Babylon, and his arm shall be on the Chaldeans."],[15,"I, even I, have spoken; yea, I have called him: I have brought him, and he shall make his way prosperous."],[16,"Come ye near unto me, hear ye this; I have not spoken in secret from the beginning; from the time that it was, there am I: and now the Lord GOD, and his Spirit, hath sent me."],[17,"Thus saith the LORD, thy Redeemer, the Holy One of Israel; I am the LORD thy God which teacheth thee to profit, which leadeth thee by the way that thou shouldest go."],[18,"O that thou hadst hearkened to my commandments! then had thy peace been as a river, and thy righteousness as the waves of the sea:"],[19,"Thy seed also had been as the sand, and the offspring of thy bowels like the gravel thereof; his name should not have been cut off nor destroyed from before me."],[20,"Go ye forth of Babylon, flee ye from the Chaldeans, with a voice of singing declare ye, tell this, utter it even to the end of the earth; say ye, The LORD hath redeemed his servant Jacob."],[21,"And they thirsted not when he led them through the deserts: he caused the waters to flow out of the rock for them: he clave the rock also, and the waters gushed out."],[22,"There is no peace, saith the LORD, unto the wicked."]]},{"id":"isa49","book":"Isaiah 49","heading":"I Will Not Forget Thee","verses":[[1,"Listen, O isles, unto me; and hearken, ye people, from far; The LORD hath called me from the womb; from the bowels of my mother hath he made mention of my name."],[2,"And he hath made my mouth like a sharp sword; in the shadow of his hand hath he hid me, and made me a polished shaft; in his quiver hath he hid me;"],[3,"And said unto me, Thou art my servant, O Israel, in whom I will be glorified."],[4,"Then I said, I have laboured in vain, I have spent my strength for nought, and in vain: yet surely my judgment is with the LORD, and my work with my God."],[5,"And now, saith the LORD that formed me from the womb to be his servant, to bring Jacob again to him, Though Israel be not gathered, yet shall I be glorious in the eyes of the LORD, and my God shall be my strength."],[6,"And he said, It is a light thing that thou shouldest be my servant to raise up the tribes of Jacob, and to restore the preserved of Israel: I will also give thee for a light to the Gentiles, that thou mayest be my salvation unto the end of the earth."],[7,"Thus saith the LORD, the Redeemer of Israel, and his Holy One, to him whom man despiseth, to him whom the nation abhorreth, to a servant of rulers, Kings shall see and arise, princes also shall worship, because of the LORD that is faithful, and the Holy One of Israel, and he shall choose thee."],[8,"Thus saith the LORD, In an acceptable time have I heard thee, and in a day of salvation have I helped thee: and I will preserve thee, and give thee for a covenant of the people, to establish the earth, to cause to inherit the desolate heritages;"],[9,"That thou mayest say to the prisoners, Go forth; to them that are in darkness, Shew yourselves. They shall feed in the ways, and their pastures shall be in all high places."],[10,"They shall not hunger nor thirst; neither shall the heat nor sun smite them: for he that hath mercy on them shall lead them, even by the springs of water shall he guide them."],[11,"And I will make all my mountains a way, and my highways shall be exalted."],[12,"Behold, these shall come from far: and, lo, these from the north and from the west; and these from the land of Sinim."],[13,"Sing, O heavens; and be joyful, O earth; and break forth into singing, O mountains: for the LORD hath comforted his people, and will have mercy upon his afflicted."],[14,"But Zion said, The LORD hath forsaken me, and my Lord hath forgotten me."],[15,"Can a woman forget her sucking child, that she should not have compassion on the son of her womb? yea, they may forget, yet will I not forget thee."],[16,"Behold, I have graven thee upon the palms of my hands; thy walls are continually before me."],[17,"Thy children shall make haste; thy destroyers and they that made thee waste shall go forth of thee."],[18,"Lift up thine eyes round about, and behold: all these gather themselves together, and come to thee. As I live, saith the LORD, thou shalt surely clothe thee with them all, as with an ornament, and bind them on thee, as a bride doeth."],[19,"For thy waste and thy desolate places, and the land of thy destruction, shall even now be too narrow by reason of the inhabitants, and they that swallowed thee up shall be far away."],[20,"The children which thou shalt have, after thou hast lost the other, shall say again in thine ears, The place is too strait for me: give place to me that I may dwell."],[21,"Then shalt thou say in thine heart, Who hath begotten me these, seeing I have lost my children, and am desolate, a captive, and removing to and fro? and who hath brought up these? Behold, I was left alone; these, where had they been?"],[22,"Thus saith the Lord GOD, Behold, I will lift up mine hand to the Gentiles, and set up my standard to the people: and they shall bring thy sons in their arms, and thy daughters shall be carried upon their shoulders."],[23,"And kings shall be thy nursing fathers, and their queens thy nursing mothers: they shall bow down to thee with their face toward the earth, and lick up the dust of thy feet; and thou shalt know that I am the LORD: for they shall not be ashamed that wait for me."],[24,"Shall the prey be taken from the mighty, or the lawful captive delivered?"],[25,"But thus saith the LORD, Even the captives of the mighty shall be taken away, and the prey of the terrible shall be delivered: for I will contend with him that contendeth with thee, and I will save thy children."],[26,"And I will feed them that oppress thee with their own flesh; and they shall be drunken with their own blood, as with sweet wine: and all flesh shall know that I the LORD am thy Saviour and thy Redeemer, the mighty One of Jacob."]]}];

const WEEK_w41 = {"dateRange":"Oct 5–11","title":"“He Hath Borne Our Griefs, and Carried Our Sorrows”","refLabel":"Isaiah 50–57"};
const PASSAGES_w41 = [{"id":"isa50","book":"Isaiah 50","heading":"The Tongue of the Learned","verses":[[1,"Thus saith the LORD, Where is the bill of your mother's divorcement, whom I have put away? or which of my creditors is it to whom I have sold you? Behold, for your iniquities have ye sold yourselves, and for your transgressions is your mother put away."],[2,"Wherefore, when I came, was there no man? when I called, was there none to answer? Is my hand shortened at all, that it cannot redeem? or have I no power to deliver? behold, at my rebuke I dry up the sea, I make the rivers a wilderness: their fish stinketh, because there is no water, and dieth for thirst."],[3,"I clothe the heavens with blackness, and I make sackcloth their covering."],[4,"The Lord GOD hath given me the tongue of the learned, that I should know how to speak a word in season to him that is weary: he wakeneth morning by morning, he wakeneth mine ear to hear as the learned."],[5,"The Lord GOD hath opened mine ear, and I was not rebellious, neither turned away back."],[6,"I gave my back to the smiters, and my cheeks to them that plucked off the hair: I hid not my face from shame and spitting."],[7,"For the Lord GOD will help me; therefore shall I not be confounded: therefore have I set my face like a flint, and I know that I shall not be ashamed."],[8,"He is near that justifieth me; who will contend with me? let us stand together: who is mine adversary? let him come near to me."],[9,"Behold, the Lord GOD will help me; who is he that shall condemn me? lo, they all shall wax old as a garment; the moth shall eat them up."],[10,"Who is among you that feareth the LORD, that obeyeth the voice of his servant, that walketh in darkness, and hath no light? let him trust in the name of the LORD, and stay upon his God."],[11,"Behold, all ye that kindle a fire, that compass yourselves about with sparks: walk in the light of your fire, and in the sparks that ye have kindled. This shall ye have of mine hand; ye shall lie down in sorrow."]]},{"id":"isa51","book":"Isaiah 51","heading":"Awake, Awake, O Zion","verses":[[1,"Hearken to me, ye that follow after righteousness, ye that seek the LORD: look unto the rock whence ye are hewn, and to the hole of the pit whence ye are digged."],[2,"Look unto Abraham your father, and unto Sarah that bare you: for I called him alone, and blessed him, and increased him."],[3,"For the LORD shall comfort Zion: he will comfort all her waste places; and he will make her wilderness like Eden, and her desert like the garden of the LORD; joy and gladness shall be found therein, thanksgiving, and the voice of melody."],[4,"Hearken unto me, my people; and give ear unto me, O my nation: for a law shall proceed from me, and I will make my judgment to rest for a light of the people."],[5,"My righteousness is near; my salvation is gone forth, and mine arms shall judge the people; the isles shall wait upon me, and on mine arm shall they trust."],[6,"Lift up your eyes to the heavens, and look upon the earth beneath: for the heavens shall vanish away like smoke, and the earth shall wax old like a garment, and they that dwell therein shall die in like manner: but my salvation shall be for ever, and my righteousness shall not be abolished."],[7,"Hearken unto me, ye that know righteousness, the people in whose heart is my law; fear ye not the reproach of men, neither be ye afraid of their revilings."],[8,"For the moth shall eat them up like a garment, and the worm shall eat them like wool: but my righteousness shall be for ever, and my salvation from generation to generation."],[9,"Awake, awake, put on strength, O arm of the LORD; awake, as in the ancient days, in the generations of old. Art thou not it that hath cut Rahab, and wounded the dragon?"],[10,"Art thou not it which hath dried the sea, the waters of the great deep; that hath made the depths of the sea a way for the ransomed to pass over?"],[11,"Therefore the redeemed of the LORD shall return, and come with singing unto Zion; and everlasting joy shall be upon their head: they shall obtain gladness and joy; and sorrow and mourning shall flee away."],[12,"I, even I, am he that comforteth you: who art thou, that thou shouldest be afraid of a man that shall die, and of the son of man which shall be made as grass;"],[13,"And forgettest the LORD thy maker, that hath stretched forth the heavens, and laid the foundations of the earth; and hast feared continually every day because of the fury of the oppressor, as if he were ready to destroy? and where is the fury of the oppressor?"],[14,"The captive exile hasteneth that he may be loosed, and that he should not die in the pit, nor that his bread should fail."],[15,"But I am the LORD thy God, that divided the sea, whose waves roared: The LORD of hosts is his name."],[16,"And I have put my words in thy mouth, and I have covered thee in the shadow of mine hand, that I may plant the heavens, and lay the foundations of the earth, and say unto Zion, Thou art my people."],[17,"Awake, awake, stand up, O Jerusalem, which hast drunk at the hand of the LORD the cup of his fury; thou hast drunken the dregs of the cup of trembling, and wrung them out."],[18,"There is none to guide her among all the sons whom she hath brought forth; neither is there any that taketh her by the hand of all the sons that she hath brought up."],[19,"These two things are come unto thee; who shall be sorry for thee? desolation, and destruction, and the famine, and the sword: by whom shall I comfort thee?"],[20,"Thy sons have fainted, they lie at the head of all the streets, as a wild bull in a net: they are full of the fury of the LORD, the rebuke of thy God."],[21,"Therefore hear now this, thou afflicted, and drunken, but not with wine:"],[22,"Thus saith thy Lord the LORD, and thy God that pleadeth the cause of his people, Behold, I have taken out of thine hand the cup of trembling, even the dregs of the cup of my fury; thou shalt no more drink it again:"],[23,"But I will put it into the hand of them that afflict thee; which have said to thy soul, Bow down, that we may go over: and thou hast laid thy body as the ground, and as the street, to them that went over."]]},{"id":"isa52","book":"Isaiah 52","heading":"How Beautiful upon the Mountains","verses":[[1,"Awake, awake; put on thy strength, O Zion; put on thy beautiful garments, O Jerusalem, the holy city: for henceforth there shall no more come into thee the uncircumcised and the unclean."],[2,"Shake thyself from the dust; arise, and sit down, O Jerusalem: loose thyself from the bands of thy neck, O captive daughter of Zion."],[3,"For thus saith the LORD, Ye have sold yourselves for nought; and ye shall be redeemed without money."],[4,"For thus saith the Lord GOD, My people went down aforetime into Egypt to sojourn there; and the Assyrian oppressed them without cause."],[5,"Now therefore, what have I here, saith the LORD, that my people is taken away for nought? they that rule over them make them to howl, saith the LORD; and my name continually every day is blasphemed."],[6,"Therefore my people shall know my name: therefore they shall know in that day that I am he that doth speak: behold, it is I."],[7,"How beautiful upon the mountains are the feet of him that bringeth good tidings, that publisheth peace; that bringeth good tidings of good, that publisheth salvation; that saith unto Zion, Thy God reigneth!"],[8,"Thy watchmen shall lift up the voice; with the voice together shall they sing: for they shall see eye to eye, when the LORD shall bring again Zion."],[9,"Break forth into joy, sing together, ye waste places of Jerusalem: for the LORD hath comforted his people, he hath redeemed Jerusalem."],[10,"The LORD hath made bare his holy arm in the eyes of all the nations; and all the ends of the earth shall see the salvation of our God."],[11,"Depart ye, depart ye, go ye out from thence, touch no unclean thing; go ye out of the midst of her; be ye clean, that bear the vessels of the LORD."],[12,"For ye shall not go out with haste, nor go by flight: for the LORD will go before you; and the God of Israel will be your rereward."],[13,"Behold, my servant shall deal prudently, he shall be exalted and extolled, and be very high."],[14,"As many were astonied at thee; his visage was so marred more than any man, and his form more than the sons of men:"],[15,"So shall he sprinkle many nations; the kings shall shut their mouths at him: for that which had not been told them shall they see; and that which they had not heard shall they consider."]]},{"id":"isa53","book":"Isaiah 53","heading":"He Hath Borne Our Griefs","verses":[[1,"Who hath believed our report? and to whom is the arm of the LORD revealed?"],[2,"For he shall grow up before him as a tender plant, and as a root out of a dry ground: he hath no form nor comeliness; and when we shall see him, there is no beauty that we should desire him."],[3,"He is despised and rejected of men; a man of sorrows, and acquainted with grief: and we hid as it were our faces from him; he was despised, and we esteemed him not."],[4,"Surely he hath borne our griefs, and carried our sorrows: yet we did esteem him stricken, smitten of God, and afflicted."],[5,"But he was wounded for our transgressions, he was bruised for our iniquities: the chastisement of our peace was upon him; and with his stripes we are healed."],[6,"All we like sheep have gone astray; we have turned every one to his own way; and the LORD hath laid on him the iniquity of us all."],[7,"He was oppressed, and he was afflicted, yet he opened not his mouth: he is brought as a lamb to the slaughter, and as a sheep before her shearers is dumb, so he openeth not his mouth."],[8,"He was taken from prison and from judgment: and who shall declare his generation? for he was cut off out of the land of the living: for the transgression of my people was he stricken."],[9,"And he made his grave with the wicked, and with the rich in his death; because he had done no violence, neither was any deceit in his mouth."],[10,"Yet it pleased the LORD to bruise him; he hath put him to grief: when thou shalt make his soul an offering for sin, he shall see his seed, he shall prolong his days, and the pleasure of the LORD shall prosper in his hand."],[11,"He shall see of the travail of his soul, and shall be satisfied: by his knowledge shall my righteous servant justify many; for he shall bear their iniquities."],[12,"Therefore will I divide him a portion with the great, and he shall divide the spoil with the strong; because he hath poured out his soul unto death: and he was numbered with the transgressors; and he bare the sin of many, and made intercession for the transgressors."]]},{"id":"isa54","book":"Isaiah 54","heading":"Enlarge the Place of Thy Tent","verses":[[1,"Sing, O barren, thou that didst not bear; break forth into singing, and cry aloud, thou that didst not travail with child: for more are the children of the desolate than the children of the married wife, saith the LORD."],[2,"Enlarge the place of thy tent, and let them stretch forth the curtains of thine habitations: spare not, lengthen thy cords, and strengthen thy stakes;"],[3,"For thou shalt break forth on the right hand and on the left; and thy seed shall inherit the Gentiles, and make the desolate cities to be inhabited."],[4,"Fear not; for thou shalt not be ashamed: neither be thou confounded; for thou shalt not be put to shame: for thou shalt forget the shame of thy youth, and shalt not remember the reproach of thy widowhood any more."],[5,"For thy Maker is thine husband; the LORD of hosts is his name; and thy Redeemer the Holy One of Israel; The God of the whole earth shall he be called."],[6,"For the LORD hath called thee as a woman forsaken and grieved in spirit, and a wife of youth, when thou wast refused, saith thy God."],[7,"For a small moment have I forsaken thee; but with great mercies will I gather thee."],[8,"In a little wrath I hid my face from thee for a moment; but with everlasting kindness will I have mercy on thee, saith the LORD thy Redeemer."],[9,"For this is as the waters of Noah unto me: for as I have sworn that the waters of Noah should no more go over the earth; so have I sworn that I would not be wroth with thee, nor rebuke thee."],[10,"For the mountains shall depart, and the hills be removed; but my kindness shall not depart from thee, neither shall the covenant of my peace be removed, saith the LORD that hath mercy on thee."],[11,"O thou afflicted, tossed with tempest, and not comforted, behold, I will lay thy stones with fair colours, and lay thy foundations with sapphires."],[12,"And I will make thy windows of agates, and thy gates of carbuncles, and all thy borders of pleasant stones."],[13,"And all thy children shall be taught of the LORD; and great shall be the peace of thy children."],[14,"In righteousness shalt thou be established: thou shalt be far from oppression; for thou shalt not fear: and from terror; for it shall not come near thee."],[15,"Behold, they shall surely gather together, but not by me: whosoever shall gather together against thee shall fall for thy sake."],[16,"Behold, I have created the smith that bloweth the coals in the fire, and that bringeth forth an instrument for his work; and I have created the waster to destroy."],[17,"No weapon that is formed against thee shall prosper; and every tongue that shall rise against thee in judgment thou shalt condemn. This is the heritage of the servants of the LORD, and their righteousness is of me, saith the LORD."]]},{"id":"isa55","book":"Isaiah 55","heading":"Come Ye to the Waters","verses":[[1,"Ho, every one that thirsteth, come ye to the waters, and he that hath no money; come ye, buy, and eat; yea, come, buy wine and milk without money and without price."],[2,"Wherefore do ye spend money for that which is not bread? and your labour for that which satisfieth not? hearken diligently unto me, and eat ye that which is good, and let your soul delight itself in fatness."],[3,"Incline your ear, and come unto me: hear, and your soul shall live; and I will make an everlasting covenant with you, even the sure mercies of David."],[4,"Behold, I have given him for a witness to the people, a leader and commander to the people."],[5,"Behold, thou shalt call a nation that thou knowest not, and nations that knew not thee shall run unto thee because of the LORD thy God, and for the Holy One of Israel; for he hath glorified thee."],[6,"Seek ye the LORD while he may be found, call ye upon him while he is near:"],[7,"Let the wicked forsake his way, and the unrighteous man his thoughts: and let him return unto the LORD, and he will have mercy upon him; and to our God, for he will abundantly pardon."],[8,"For my thoughts are not your thoughts, neither are your ways my ways, saith the LORD."],[9,"For as the heavens are higher than the earth, so are my ways higher than your ways, and my thoughts than your thoughts."],[10,"For as the rain cometh down, and the snow from heaven, and returneth not thither, but watereth the earth, and maketh it bring forth and bud, that it may give seed to the sower, and bread to the eater:"],[11,"So shall my word be that goeth forth out of my mouth: it shall not return unto me void, but it shall accomplish that which I please, and it shall prosper in the thing whereto I sent it."],[12,"For ye shall go out with joy, and be led forth with peace: the mountains and the hills shall break forth before you into singing, and all the trees of the field shall clap their hands."],[13,"Instead of the thorn shall come up the fir tree, and instead of the brier shall come up the myrtle tree: and it shall be to the LORD for a name, for an everlasting sign that shall not be cut off."]]},{"id":"isa56","book":"Isaiah 56","heading":"A House of Prayer for All People","verses":[[1,"Thus saith the LORD, Keep ye judgment, and do justice: for my salvation is near to come, and my righteousness to be revealed."],[2,"Blessed is the man that doeth this, and the son of man that layeth hold on it; that keepeth the sabbath from polluting it, and keepeth his hand from doing any evil."],[3,"Neither let the son of the stranger, that hath joined himself to the LORD, speak, saying, The LORD hath utterly separated me from his people: neither let the eunuch say, Behold, I am a dry tree."],[4,"For thus saith the LORD unto the eunuchs that keep my sabbaths, and choose the things that please me, and take hold of my covenant;"],[5,"Even unto them will I give in mine house and within my walls a place and a name better than of sons and of daughters: I will give them an everlasting name, that shall not be cut off."],[6,"Also the sons of the stranger, that join themselves to the LORD, to serve him, and to love the name of the LORD, to be his servants, every one that keepeth the sabbath from polluting it, and taketh hold of my covenant;"],[7,"Even them will I bring to my holy mountain, and make them joyful in my house of prayer: their burnt offerings and their sacrifices shall be accepted upon mine altar; for mine house shall be called an house of prayer for all people."],[8,"The Lord GOD which gathereth the outcasts of Israel saith, Yet will I gather others to him, beside those that are gathered unto him."],[9,"All ye beasts of the field, come to devour, yea, all ye beasts in the forest."],[10,"His watchmen are blind: they are all ignorant, they are all dumb dogs, they cannot bark; sleeping, lying down, loving to slumber."],[11,"Yea, they are greedy dogs which can never have enough, and they are shepherds that cannot understand: they all look to their own way, every one for his gain, from his quarter."],[12,"Come ye, say they, I will fetch wine, and we will fill ourselves with strong drink; and to morrow shall be as this day, and much more abundant."]]},{"id":"isa57","book":"Isaiah 57","heading":"Peace to Him That Is Far Off","verses":[[1,"The righteous perisheth, and no man layeth it to heart: and merciful men are taken away, none considering that the righteous is taken away from the evil to come."],[2,"He shall enter into peace: they shall rest in their beds, each one walking in his uprightness."],[3,"But draw near hither, ye sons of the sorceress, the seed of the adulterer and the whore."],[4,"Against whom do ye sport yourselves? against whom make ye a wide mouth, and draw out the tongue? are ye not children of transgression, a seed of falsehood,"],[5,"Enflaming yourselves with idols under every green tree, slaying the children in the valleys under the clifts of the rocks?"],[6,"Among the smooth stones of the stream is thy portion; they, they are thy lot: even to them hast thou poured a drink offering, thou hast offered a meat offering. Should I receive comfort in these?"],[7,"Upon a lofty and high mountain hast thou set thy bed: even thither wentest thou up to offer sacrifice."],[8,"Behind the doors also and the posts hast thou set up thy remembrance: for thou hast discovered thyself to another than me, and art gone up; thou hast enlarged thy bed, and made thee a covenant with them; thou lovedst their bed where thou sawest it."],[9,"And thou wentest to the king with ointment, and didst increase thy perfumes, and didst send thy messengers far off, and didst debase thyself even unto hell."],[10,"Thou art wearied in the greatness of thy way; yet saidst thou not, There is no hope: thou hast found the life of thine hand; therefore thou wast not grieved."],[11,"And of whom hast thou been afraid or feared, that thou hast lied, and hast not remembered me, nor laid it to thy heart? have not I held my peace even of old, and thou fearest me not?"],[12,"I will declare thy righteousness, and thy works; for they shall not profit thee."],[13,"When thou criest, let thy companies deliver thee; but the wind shall carry them all away; vanity shall take them: but he that putteth his trust in me shall possess the land, and shall inherit my holy mountain;"],[14,"And shall say, Cast ye up, cast ye up, prepare the way, take up the stumblingblock out of the way of my people."],[15,"For thus saith the high and lofty One that inhabiteth eternity, whose name is Holy; I dwell in the high and holy place, with him also that is of a contrite and humble spirit, to revive the spirit of the humble, and to revive the heart of the contrite ones."],[16,"For I will not contend for ever, neither will I be always wroth: for the spirit should fail before me, and the souls which I have made."],[17,"For the iniquity of his covetousness was I wroth, and smote him: I hid me, and was wroth, and he went on frowardly in the way of his heart."],[18,"I have seen his ways, and will heal him: I will lead him also, and restore comforts unto him and to his mourners."],[19,"I create the fruit of the lips; Peace, peace to him that is far off, and to him that is near, saith the LORD; and I will heal him."],[20,"But the wicked are like the troubled sea, when it cannot rest, whose waters cast up mire and dirt."],[21,"There is no peace, saith my God, to the wicked."]]}];

const WEEK_w42 = {"dateRange":"Oct 12–18","title":"“The Redeemer Shall Come to Zion”","refLabel":"Isaiah 58–66"};
const PASSAGES_w42 = [{"id":"isa58","book":"Isaiah 58","heading":"The Fast That I Have Chosen","verses":[[1,"Cry aloud, spare not, lift up thy voice like a trumpet, and shew my people their transgression, and the house of Jacob their sins."],[2,"Yet they seek me daily, and delight to know my ways, as a nation that did righteousness, and forsook not the ordinance of their God: they ask of me the ordinances of justice; they take delight in approaching to God."],[3,"Wherefore have we fasted, say they, and thou seest not? wherefore have we afflicted our soul, and thou takest no knowledge? Behold, in the day of your fast ye find pleasure, and exact all your labours."],[4,"Behold, ye fast for strife and debate, and to smite with the fist of wickedness: ye shall not fast as ye do this day, to make your voice to be heard on high."],[5,"Is it such a fast that I have chosen? a day for a man to afflict his soul? is it to bow down his head as a bulrush, and to spread sackcloth and ashes under him? wilt thou call this a fast, and an acceptable day to the LORD?"],[6,"Is not this the fast that I have chosen? to loose the bands of wickedness, to undo the heavy burdens, and to let the oppressed go free, and that ye break every yoke?"],[7,"Is it not to deal thy bread to the hungry, and that thou bring the poor that are cast out to thy house? when thou seest the naked, that thou cover him; and that thou hide not thyself from thine own flesh?"],[8,"Then shall thy light break forth as the morning, and thine health shall spring forth speedily: and thy righteousness shall go before thee; the glory of the LORD shall be thy rereward."],[9,"Then shalt thou call, and the LORD shall answer; thou shalt cry, and he shall say, Here I am. If thou take away from the midst of thee the yoke, the putting forth of the finger, and speaking vanity;"],[10,"And if thou draw out thy soul to the hungry, and satisfy the afflicted soul; then shall thy light rise in obscurity, and thy darkness be as the noonday:"],[11,"And the LORD shall guide thee continually, and satisfy thy soul in drought, and make fat thy bones: and thou shalt be like a watered garden, and like a spring of water, whose waters fail not."],[12,"And they that shall be of thee shall build the old waste places: thou shalt raise up the foundations of many generations; and thou shalt be called, The repairer of the breach, The restorer of paths to dwell in."],[13,"If thou turn away thy foot from the sabbath, from doing thy pleasure on my holy day; and call the sabbath a delight, the holy of the LORD, honourable; and shalt honour him, not doing thine own ways, nor finding thine own pleasure, nor speaking thine own words:"],[14,"Then shalt thou delight thyself in the LORD; and I will cause thee to ride upon the high places of the earth, and feed thee with the heritage of Jacob thy father: for the mouth of the LORD hath spoken it."]]},{"id":"isa59","book":"Isaiah 59","heading":"The Redeemer Shall Come to Zion","verses":[[1,"Behold, the LORD'S hand is not shortened, that it cannot save; neither his ear heavy, that it cannot hear:"],[2,"But your iniquities have separated between you and your God, and your sins have hid his face from you, that he will not hear."],[3,"For your hands are defiled with blood, and your fingers with iniquity; your lips have spoken lies, your tongue hath muttered perverseness."],[4,"None calleth for justice, nor any pleadeth for truth: they trust in vanity, and speak lies; they conceive mischief, and bring forth iniquity."],[5,"They hatch cockatrice' eggs, and weave the spider's web: he that eateth of their eggs dieth, and that which is crushed breaketh out into a viper."],[6,"Their webs shall not become garments, neither shall they cover themselves with their works: their works are works of iniquity, and the act of violence is in their hands."],[7,"Their feet run to evil, and they make haste to shed innocent blood: their thoughts are thoughts of iniquity; wasting and destruction are in their paths."],[8,"The way of peace they know not; and there is no judgment in their goings: they have made them crooked paths: whosoever goeth therein shall not know peace."],[9,"Therefore is judgment far from us, neither doth justice overtake us: we wait for light, but behold obscurity; for brightness, but we walk in darkness."],[10,"We grope for the wall like the blind, and we grope as if we had no eyes: we stumble at noonday as in the night; we are in desolate places as dead men."],[11,"We roar all like bears, and mourn sore like doves: we look for judgment, but there is none; for salvation, but it is far off from us."],[12,"For our transgressions are multiplied before thee, and our sins testify against us: for our transgressions are with us; and as for our iniquities, we know them;"],[13,"In transgressing and lying against the LORD, and departing away from our God, speaking oppression and revolt, conceiving and uttering from the heart words of falsehood."],[14,"And judgment is turned away backward, and justice standeth afar off: for truth is fallen in the street, and equity cannot enter."],[15,"Yea, truth faileth; and he that departeth from evil maketh himself a prey: and the LORD saw it, and it displeased him that there was no judgment."],[16,"And he saw that there was no man, and wondered that there was no intercessor: therefore his arm brought salvation unto him; and his righteousness, it sustained him."],[17,"For he put on righteousness as a breastplate, and an helmet of salvation upon his head; and he put on the garments of vengeance for clothing, and was clad with zeal as a cloke."],[18,"According to their deeds, accordingly he will repay, fury to his adversaries, recompence to his enemies; to the islands he will repay recompence."],[19,"So shall they fear the name of the LORD from the west, and his glory from the rising of the sun. When the enemy shall come in like a flood, the Spirit of the LORD shall lift up a standard against him."],[20,"And the Redeemer shall come to Zion, and unto them that turn from transgression in Jacob, saith the LORD."],[21,"As for me, this is my covenant with them, saith the LORD; My spirit that is upon thee, and my words which I have put in thy mouth, shall not depart out of thy mouth, nor out of the mouth of thy seed, nor out of the mouth of thy seed's seed, saith the LORD, from henceforth and for ever."]]},{"id":"isa60","book":"Isaiah 60","heading":"Arise, Shine; for Thy Light Is Come","verses":[[1,"Arise, shine; for thy light is come, and the glory of the LORD is risen upon thee."],[2,"For, behold, the darkness shall cover the earth, and gross darkness the people: but the LORD shall arise upon thee, and his glory shall be seen upon thee."],[3,"And the Gentiles shall come to thy light, and kings to the brightness of thy rising."],[4,"Lift up thine eyes round about, and see: all they gather themselves together, they come to thee: thy sons shall come from far, and thy daughters shall be nursed at thy side."],[5,"Then thou shalt see, and flow together, and thine heart shall fear, and be enlarged; because the abundance of the sea shall be converted unto thee, the forces of the Gentiles shall come unto thee."],[6,"The multitude of camels shall cover thee, the dromedaries of Midian and Ephah; all they from Sheba shall come: they shall bring gold and incense; and they shall shew forth the praises of the LORD."],[7,"All the flocks of Kedar shall be gathered together unto thee, the rams of Nebaioth shall minister unto thee: they shall come up with acceptance on mine altar, and I will glorify the house of my glory."],[8,"Who are these that fly as a cloud, and as the doves to their windows?"],[9,"Surely the isles shall wait for me, and the ships of Tarshish first, to bring thy sons from far, their silver and their gold with them, unto the name of the LORD thy God, and to the Holy One of Israel, because he hath glorified thee."],[10,"And the sons of strangers shall build up thy walls, and their kings shall minister unto thee: for in my wrath I smote thee, but in my favour have I had mercy on thee."],[11,"Therefore thy gates shall be open continually; they shall not be shut day nor night; that men may bring unto thee the forces of the Gentiles, and that their kings may be brought."],[12,"For the nation and kingdom that will not serve thee shall perish; yea, those nations shall be utterly wasted."],[13,"The glory of Lebanon shall come unto thee, the fir tree, the pine tree, and the box together, to beautify the place of my sanctuary; and I will make the place of my feet glorious."],[14,"The sons also of them that afflicted thee shall come bending unto thee; and all they that despised thee shall bow themselves down at the soles of thy feet; and they shall call thee, The city of the LORD, The Zion of the Holy One of Israel."],[15,"Whereas thou hast been forsaken and hated, so that no man went through thee, I will make thee an eternal excellency, a joy of many generations."],[16,"Thou shalt also suck the milk of the Gentiles, and shalt suck the breast of kings: and thou shalt know that I the LORD am thy Saviour and thy Redeemer, the mighty One of Jacob."],[17,"For brass I will bring gold, and for iron I will bring silver, and for wood brass, and for stones iron: I will also make thy officers peace, and thine exactors righteousness."],[18,"Violence shall no more be heard in thy land, wasting nor destruction within thy borders; but thou shalt call thy walls Salvation, and thy gates Praise."],[19,"The sun shall be no more thy light by day; neither for brightness shall the moon give light unto thee: but the LORD shall be unto thee an everlasting light, and thy God thy glory."],[20,"Thy sun shall no more go down; neither shall thy moon withdraw itself: for the LORD shall be thine everlasting light, and the days of thy mourning shall be ended."],[21,"Thy people also shall be all righteous: they shall inherit the land for ever, the branch of my planting, the work of my hands, that I may be glorified."],[22,"A little one shall become a thousand, and a small one a strong nation: I the LORD will hasten it in his time."]]},{"id":"isa61","book":"Isaiah 61","heading":"The Spirit of the Lord God Is upon Me","verses":[[1,"The Spirit of the Lord GOD is upon me; because the LORD hath anointed me to preach good tidings unto the meek; he hath sent me to bind up the brokenhearted, to proclaim liberty to the captives, and the opening of the prison to them that are bound;"],[2,"To proclaim the acceptable year of the LORD, and the day of vengeance of our God; to comfort all that mourn;"],[3,"To appoint unto them that mourn in Zion, to give unto them beauty for ashes, the oil of joy for mourning, the garment of praise for the spirit of heaviness; that they might be called trees of righteousness, the planting of the LORD, that he might be glorified."],[4,"And they shall build the old wastes, they shall raise up the former desolations, and they shall repair the waste cities, the desolations of many generations."],[5,"And strangers shall stand and feed your flocks, and the sons of the alien shall be your plowmen and your vinedressers."],[6,"But ye shall be named the Priests of the LORD: men shall call you the Ministers of our God: ye shall eat the riches of the Gentiles, and in their glory shall ye boast yourselves."],[7,"For your shame ye shall have double; and for confusion they shall rejoice in their portion: therefore in their land they shall possess the double: everlasting joy shall be unto them."],[8,"For I the LORD love judgment, I hate robbery for burnt offering; and I will direct their work in truth, and I will make an everlasting covenant with them."],[9,"And their seed shall be known among the Gentiles, and their offspring among the people: all that see them shall acknowledge them, that they are the seed which the LORD hath blessed."],[10,"I will greatly rejoice in the LORD, my soul shall be joyful in my God; for he hath clothed me with the garments of salvation, he hath covered me with the robe of righteousness, as a bridegroom decketh himself with ornaments, and as a bride adorneth herself with her jewels."],[11,"For as the earth bringeth forth her bud, and as the garden causeth the things that are sown in it to spring forth; so the Lord GOD will cause righteousness and praise to spring forth before all the nations."]]},{"id":"isa62","book":"Isaiah 62","heading":"A Crown of Glory","verses":[[1,"For Zion's sake will I not hold my peace, and for Jerusalem's sake I will not rest, until the righteousness thereof go forth as brightness, and the salvation thereof as a lamp that burneth."],[2,"And the Gentiles shall see thy righteousness, and all kings thy glory: and thou shalt be called by a new name, which the mouth of the LORD shall name."],[3,"Thou shalt also be a crown of glory in the hand of the LORD, and a royal diadem in the hand of thy God."],[4,"Thou shalt no more be termed Forsaken; neither shall thy land any more be termed Desolate: but thou shalt be called Hephzibah, and thy land Beulah: for the LORD delighteth in thee, and thy land shall be married."],[5,"For as a young man marrieth a virgin, so shall thy sons marry thee: and as the bridegroom rejoiceth over the bride, so shall thy God rejoice over thee."],[6,"I have set watchmen upon thy walls, O Jerusalem, which shall never hold their peace day nor night: ye that make mention of the LORD, keep not silence,"],[7,"And give him no rest, till he establish, and till he make Jerusalem a praise in the earth."],[8,"The LORD hath sworn by his right hand, and by the arm of his strength, Surely I will no more give thy corn to be meat for thine enemies; and the sons of the stranger shall not drink thy wine, for the which thou hast laboured:"],[9,"But they that have gathered it shall eat it, and praise the LORD; and they that have brought it together shall drink it in the courts of my holiness."],[10,"Go through, go through the gates; prepare ye the w
