ay of the people; cast up, cast up the highway; gather out the stones; lift up a standard for the people."],[11,"Behold, the LORD hath proclaimed unto the end of the world, Say ye to the daughter of Zion, Behold, thy salvation cometh; behold, his reward is with him, and his work before him."],[12,"And they shall call them, The holy people, The redeemed of the LORD: and thou shalt be called, Sought out, A city not forsaken."]]},{"id":"isa63","book":"Isaiah 63","heading":"Mighty to Save","verses":[[1,"Who is this that cometh from Edom, with dyed garments from Bozrah? this that is glorious in his apparel, travelling in the greatness of his strength? I that speak in righteousness, mighty to save."],[2,"Wherefore art thou red in thine apparel, and thy garments like him that treadeth in the winefat?"],[3,"I have trodden the winepress alone; and of the people there was none with me: for I will tread them in mine anger, and trample them in my fury; and their blood shall be sprinkled upon my garments, and I will stain all my raiment."],[4,"For the day of vengeance is in mine heart, and the year of my redeemed is come."],[5,"And I looked, and there was none to help; and I wondered that there was none to uphold: therefore mine own arm brought salvation unto me; and my fury, it upheld me."],[6,"And I will tread down the people in mine anger, and make them drunk in my fury, and I will bring down their strength to the earth."],[7,"I will mention the lovingkindnesses of the LORD, and the praises of the LORD, according to all that the LORD hath bestowed on us, and the great goodness toward the house of Israel, which he hath bestowed on them according to his mercies, and according to the multitude of his lovingkindnesses."],[8,"For he said, Surely they are my people, children that will not lie: so he was their Saviour."],[9,"In all their affliction he was afflicted, and the angel of his presence saved them: in his love and in his pity he redeemed them; and he bare them, and carried them all the days of old."],[10,"But they rebelled, and vexed his holy Spirit: therefore he was turned to be their enemy, and he fought against them."],[11,"Then he remembered the days of old, Moses, and his people, saying, Where is he that brought them up out of the sea with the shepherd of his flock? where is he that put his holy Spirit within him?"],[12,"That led them by the right hand of Moses with his glorious arm, dividing the water before them, to make himself an everlasting name?"],[13,"That led them through the deep, as an horse in the wilderness, that they should not stumble?"],[14,"As a beast goeth down into the valley, the Spirit of the LORD caused him to rest: so didst thou lead thy people, to make thyself a glorious name."],[15,"Look down from heaven, and behold from the habitation of thy holiness and of thy glory: where is thy zeal and thy strength, the sounding of thy bowels and of thy mercies toward me? are they restrained?"],[16,"Doubtless thou art our father, though Abraham be ignorant of us, and Israel acknowledge us not: thou, O LORD, art our father, our redeemer; thy name is from everlasting."],[17,"O LORD, why hast thou made us to err from thy ways, and hardened our heart from thy fear? Return for thy servants' sake, the tribes of thine inheritance."],[18,"The people of thy holiness have possessed it but a little while: our adversaries have trodden down thy sanctuary."],[19,"We are thine: thou never barest rule over them; they were not called by thy name."]]},{"id":"isa64","book":"Isaiah 64","heading":"Oh That Thou Wouldest Rend the Heavens","verses":[[1,"Oh that thou wouldest rend the heavens, that thou wouldest come down, that the mountains might flow down at thy presence,"],[2,"As when the melting fire burneth, the fire causeth the waters to boil, to make thy name known to thine adversaries, that the nations may tremble at thy presence!"],[3,"When thou didst terrible things which we looked not for, thou camest down, the mountains flowed down at thy presence."],[4,"For since the beginning of the world men have not heard, nor perceived by the ear, neither hath the eye seen, O God, beside thee, what he hath prepared for him that waiteth for him."],[5,"Thou meetest him that rejoiceth and worketh righteousness, those that remember thee in thy ways: behold, thou art wroth; for we have sinned: in those is continuance, and we shall be saved."],[6,"But we are all as an unclean thing, and all our righteousnesses are as filthy rags; and we all do fade as a leaf; and our iniquities, like the wind, have taken us away."],[7,"And there is none that calleth upon thy name, that stirreth up himself to take hold of thee: for thou hast hid thy face from us, and hast consumed us, because of our iniquities."],[8,"But now, O LORD, thou art our father; we are the clay, and thou our potter; and we all are the work of thy hand."],[9,"Be not wroth very sore, O LORD, neither remember iniquity for ever: behold, see, we beseech thee, we are all thy people."],[10,"Thy holy cities are a wilderness, Zion is a wilderness, Jerusalem a desolation."],[11,"Our holy and our beautiful house, where our fathers praised thee, is burned up with fire: and all our pleasant things are laid waste."],[12,"Wilt thou refrain thyself for these things, O LORD? wilt thou hold thy peace, and afflict us very sore?"]]},{"id":"isa65","book":"Isaiah 65","heading":"New Heavens and a New Earth","verses":[[1,"I am sought of them that asked not for me; I am found of them that sought me not: I said, Behold me, behold me, unto a nation that was not called by my name."],[2,"I have spread out my hands all the day unto a rebellious people, which walketh in a way that was not good, after their own thoughts;"],[3,"A people that provoketh me to anger continually to my face; that sacrificeth in gardens, and burneth incense upon altars of brick;"],[4,"Which remain among the graves, and lodge in the monuments, which eat swine's flesh, and broth of abominable things is in their vessels;"],[5,"Which say, Stand by thyself, come not near to me; for I am holier than thou. These are a smoke in my nose, a fire that burneth all the day."],[6,"Behold, it is written before me: I will not keep silence, but will recompense, even recompense into their bosom,"],[7,"Your iniquities, and the iniquities of your fathers together, saith the LORD, which have burned incense upon the mountains, and blasphemed me upon the hills: therefore will I measure their former work into their bosom."],[8,"Thus saith the LORD, As the new wine is found in the cluster, and one saith, Destroy it not; for a blessing is in it: so will I do for my servants' sakes, that I may not destroy them all."],[9,"And I will bring forth a seed out of Jacob, and out of Judah an inheritor of my mountains: and mine elect shall inherit it, and my servants shall dwell there."],[10,"And Sharon shall be a fold of flocks, and the valley of Achor a place for the herds to lie down in, for my people that have sought me."],[11,"But ye are they that forsake the LORD, that forget my holy mountain, that prepare a table for that troop, and that furnish the drink offering unto that number."],[12,"Therefore will I number you to the sword, and ye shall all bow down to the slaughter: because when I called, ye did not answer; when I spake, ye did not hear; but did evil before mine eyes, and did choose that wherein I delighted not."],[13,"Therefore thus saith the Lord GOD, Behold, my servants shall eat, but ye shall be hungry: behold, my servants shall drink, but ye shall be thirsty: behold, my servants shall rejoice, but ye shall be ashamed:"],[14,"Behold, my servants shall sing for joy of heart, but ye shall cry for sorrow of heart, and shall howl for vexation of spirit."],[15,"And ye shall leave your name for a curse unto my chosen: for the Lord GOD shall slay thee, and call his servants by another name:"],[16,"That he who blesseth himself in the earth shall bless himself in the God of truth; and he that sweareth in the earth shall swear by the God of truth; because the former troubles are forgotten, and because they are hid from mine eyes."],[17,"For, behold, I create new heavens and a new earth: and the former shall not be remembered, nor come into mind."],[18,"But be ye glad and rejoice for ever in that which I create: for, behold, I create Jerusalem a rejoicing, and her people a joy."],[19,"And I will rejoice in Jerusalem, and joy in my people: and the voice of weeping shall be no more heard in her, nor the voice of crying."],[20,"There shall be no more thence an infant of days, nor an old man that hath not filled his days: for the child shall die an hundred years old; but the sinner being an hundred years old shall be accursed."],[21,"And they shall build houses, and inhabit them; and they shall plant vineyards, and eat the fruit of them."],[22,"They shall not build, and another inhabit; they shall not plant, and another eat: for as the days of a tree are the days of my people, and mine elect shall long enjoy the work of their hands."],[23,"They shall not labour in vain, nor bring forth for trouble; for they are the seed of the blessed of the LORD, and their offspring with them."],[24,"And it shall come to pass, that before they call, I will answer; and while they are yet speaking, I will hear."],[25,"The wolf and the lamb shall feed together, and the lion shall eat straw like the bullock: and dust shall be the serpent's meat. They shall not hurt nor destroy in all my holy mountain, saith the LORD."]]},{"id":"isa66","book":"Isaiah 66","heading":"Heaven Is My Throne","verses":[[1,"Thus saith the LORD, The heaven is my throne, and the earth is my footstool: where is the house that ye build unto me? and where is the place of my rest?"],[2,"For all those things hath mine hand made, and all those things have been, saith the LORD: but to this man will I look, even to him that is poor and of a contrite spirit, and trembleth at my word."],[3,"He that killeth an ox is as if he slew a man; he that sacrificeth a lamb, as if he cut off a dog's neck; he that offereth an oblation, as if he offered swine's blood; he that burneth incense, as if he blessed an idol. Yea, they have chosen their own ways, and their soul delighteth in their abominations."],[4,"I also will choose their delusions, and will bring their fears upon them; because when I called, none did answer; when I spake, they did not hear: but they did evil before mine eyes, and chose that in which I delighted not."],[5,"Hear the word of the LORD, ye that tremble at his word; Your brethren that hated you, that cast you out for my name's sake, said, Let the LORD be glorified: but he shall appear to your joy, and they shall be ashamed."],[6,"A voice of noise from the city, a voice from the temple, a voice of the LORD that rendereth recompence to his enemies."],[7,"Before she travailed, she brought forth; before her pain came, she was delivered of a man child."],[8,"Who hath heard such a thing? who hath seen such things? Shall the earth be made to bring forth in one day? or shall a nation be born at once? for as soon as Zion travailed, she brought forth her children."],[9,"Shall I bring to the birth, and not cause to bring forth? saith the LORD: shall I cause to bring forth, and shut the womb? saith thy God."],[10,"Rejoice ye with Jerusalem, and be glad with her, all ye that love her: rejoice for joy with her, all ye that mourn for her:"],[11,"That ye may suck, and be satisfied with the breasts of her consolations; that ye may milk out, and be delighted with the abundance of her glory."],[12,"For thus saith the LORD, Behold, I will extend peace to her like a river, and the glory of the Gentiles like a flowing stream: then shall ye suck, ye shall be borne upon her sides, and be dandled upon her knees."],[13,"As one whom his mother comforteth, so will I comfort you; and ye shall be comforted in Jerusalem."],[14,"And when ye see this, your heart shall rejoice, and your bones shall flourish like an herb: and the hand of the LORD shall be known toward his servants, and his indignation toward his enemies."],[15,"For, behold, the LORD will come with fire, and with his chariots like a whirlwind, to render his anger with fury, and his rebuke with flames of fire."],[16,"For by fire and by his sword will the LORD plead with all flesh: and the slain of the LORD shall be many."],[17,"They that sanctify themselves, and purify themselves in the gardens behind one tree in the midst, eating swine's flesh, and the abomination, and the mouse, shall be consumed together, saith the LORD."],[18,"For I know their works and their thoughts: it shall come, that I will gather all nations and tongues; and they shall come, and see my glory."],[19,"And I will set a sign among them, and I will send those that escape of them unto the nations, to Tarshish, Pul, and Lud, that draw the bow, to Tubal, and Javan, to the isles afar off, that have not heard my fame, neither have seen my glory; and they shall declare my glory among the Gentiles."],[20,"And they shall bring all your brethren for an offering unto the LORD out of all nations upon horses, and in chariots, and in litters, and upon mules, and upon swift beasts, to my holy mountain Jerusalem, saith the LORD, as the children of Israel bring an offering in a clean vessel into the house of the LORD."],[21,"And I will also take of them for priests and for Levites, saith the LORD."],[22,"For as the new heavens and the new earth, which I will make, shall remain before me, saith the LORD, so shall your seed and your name remain."],[23,"And it shall come to pass, that from one new moon to another, and from one sabbath to another, shall all flesh come to worship before me, saith the LORD."],[24,"And they shall go forth, and look upon the carcases of the men that have transgressed against me: for their worm shall not die, neither shall their fire be quenched; and they shall be an abhorring unto all flesh."]]}];

const WEEK_w43 = {"dateRange":"Oct 19–25","title":"“Before I Formed Thee in the Belly I Knew Thee”","refLabel":"Jeremiah 1–3; 7; 16–18; 20"};
const PASSAGES_w43 = [{"id":"jer1","book":"Jeremiah 1","heading":"Before I Formed Thee I Knew Thee","verses":[[1,"The words of Jeremiah the son of Hilkiah, of the priests that were in Anathoth in the land of Benjamin:"],[2,"To whom the word of the LORD came in the days of Josiah the son of Amon king of Judah, in the thirteenth year of his reign."],[3,"It came also in the days of Jehoiakim the son of Josiah king of Judah, unto the end of the eleventh year of Zedekiah the son of Josiah king of Judah, unto the carrying away of Jerusalem captive in the fifth month."],[4,"Then the word of the LORD came unto me, saying,"],[5,"Before I formed thee in the belly I knew thee; and before thou camest forth out of the womb I sanctified thee, and I ordained thee a prophet unto the nations."],[6,"Then said I, Ah, Lord GOD! behold, I cannot speak: for I am a child."],[7,"But the LORD said unto me, Say not, I am a child: for thou shalt go to all that I shall send thee, and whatsoever I command thee thou shalt speak."],[8,"Be not afraid of their faces: for I am with thee to deliver thee, saith the LORD."],[9,"Then the LORD put forth his hand, and touched my mouth. And the LORD said unto me, Behold, I have put my words in thy mouth."],[10,"See, I have this day set thee over the nations and over the kingdoms, to root out, and to pull down, and to destroy, and to throw down, to build, and to plant."],[11,"Moreover the word of the LORD came unto me, saying, Jeremiah, what seest thou? And I said, I see a rod of an almond tree."],[12,"Then said the LORD unto me, Thou hast well seen: for I will hasten my word to perform it."],[13,"And the word of the LORD came unto me the second time, saying, What seest thou? And I said, I see a seething pot; and the face thereof is toward the north."],[14,"Then the LORD said unto me, Out of the north an evil shall break forth upon all the inhabitants of the land."],[15,"For, lo, I will call all the families of the kingdoms of the north, saith the LORD; and they shall come, and they shall set every one his throne at the entering of the gates of Jerusalem, and against all the walls thereof round about, and against all the cities of Judah."],[16,"And I will utter my judgments against them touching all their wickedness, who have forsaken me, and have burned incense unto other gods, and worshipped the works of their own hands."],[17,"Thou therefore gird up thy loins, and arise, and speak unto them all that I command thee: be not dismayed at their faces, lest I confound thee before them."],[18,"For, behold, I have made thee this day a defenced city, and an iron pillar, and brasen walls against the whole land, against the kings of Judah, against the princes thereof, against the priests thereof, and against the people of the land."],[19,"And they shall fight against thee; but they shall not prevail against thee; for I am with thee, saith the LORD, to deliver thee."]]},{"id":"jer2","book":"Jeremiah 2","heading":"The Fountain of Living Waters","verses":[[1,"Moreover the word of the LORD came to me, saying,"],[2,"Go and cry in the ears of Jerusalem, saying, Thus saith the LORD; I remember thee, the kindness of thy youth, the love of thine espousals, when thou wentest after me in the wilderness, in a land that was not sown."],[3,"Israel was holiness unto the LORD, and the firstfruits of his increase: all that devour him shall offend; evil shall come upon them, saith the LORD."],[4,"Hear ye the word of the LORD, O house of Jacob, and all the families of the house of Israel:"],[5,"Thus saith the LORD, What iniquity have your fathers found in me, that they are gone far from me, and have walked after vanity, and are become vain?"],[6,"Neither said they, Where is the LORD that brought us up out of the land of Egypt, that led us through the wilderness, through a land of deserts and of pits, through a land of drought, and of the shadow of death, through a land that no man passed through, and where no man dwelt?"],[7,"And I brought you into a plentiful country, to eat the fruit thereof and the goodness thereof; but when ye entered, ye defiled my land, and made mine heritage an abomination."],[8,"The priests said not, Where is the LORD? and they that handle the law knew me not: the pastors also transgressed against me, and the prophets prophesied by Baal, and walked after things that do not profit."],[9,"Wherefore I will yet plead with you, saith the LORD, and with your children's children will I plead."],[10,"For pass over the isles of Chittim, and see; and send unto Kedar, and consider diligently, and see if there be such a thing."],[11,"Hath a nation changed their gods, which are yet no gods? but my people have changed their glory for that which doth not profit."],[12,"Be astonished, O ye heavens, at this, and be horribly afraid, be ye very desolate, saith the LORD."],[13,"For my people have committed two evils; they have forsaken me the fountain of living waters, and hewed them out cisterns, broken cisterns, that can hold no water."],[14,"Is Israel a servant? is he a homeborn slave? why is he spoiled?"],[15,"The young lions roared upon him, and yelled, and they made his land waste: his cities are burned without inhabitant."],[16,"Also the children of Noph and Tahapanes have broken the crown of thy head."],[17,"Hast thou not procured this unto thyself, in that thou hast forsaken the LORD thy God, when he led thee by the way?"],[18,"And now what hast thou to do in the way of Egypt, to drink the waters of Sihor? or what hast thou to do in the way of Assyria, to drink the waters of the river?"],[19,"Thine own wickedness shall correct thee, and thy backslidings shall reprove thee: know therefore and see that it is an evil thing and bitter, that thou hast forsaken the LORD thy God, and that my fear is not in thee, saith the Lord GOD of hosts."],[20,"For of old time I have broken thy yoke, and burst thy bands; and thou saidst, I will not transgress; when upon every high hill and under every green tree thou wanderest, playing the harlot."],[21,"Yet I had planted thee a noble vine, wholly a right seed: how then art thou turned into the degenerate plant of a strange vine unto me?"],[22,"For though thou wash thee with nitre, and take thee much sope, yet thine iniquity is marked before me, saith the Lord GOD."],[23,"How canst thou say, I am not polluted, I have not gone after Baalim? see thy way in the valley, know what thou hast done: thou art a swift dromedary traversing her ways;"],[24,"A wild ass used to the wilderness, that snuffeth up the wind at her pleasure; in her occasion who can turn her away? all they that seek her will not weary themselves; in her month they shall find her."],[25,"Withhold thy foot from being unshod, and thy throat from thirst: but thou saidst, There is no hope: no; for I have loved strangers, and after them will I go."],[26,"As the thief is ashamed when he is found, so is the house of Israel ashamed; they, their kings, their princes, and their priests, and their prophets,"],[27,"Saying to a stock, Thou art my father; and to a stone, Thou hast brought me forth: for they have turned their back unto me, and not their face: but in the time of their trouble they will say, Arise, and save us."],[28,"But where are thy gods that thou hast made thee? let them arise, if they can save thee in the time of thy trouble: for according to the number of thy cities are thy gods, O Judah."],[29,"Wherefore will ye plead with me? ye all have transgressed against me, saith the LORD."],[30,"In vain have I smitten your children; they received no correction: your own sword hath devoured your prophets, like a destroying lion."],[31,"O generation, see ye the word of the LORD. Have I been a wilderness unto Israel? a land of darkness? wherefore say my people, We are lords; we will come no more unto thee?"],[32,"Can a maid forget her ornaments, or a bride her attire? yet my people have forgotten me days without number."],[33,"Why trimmest thou thy way to seek love? therefore hast thou also taught the wicked ones thy ways."],[34,"Also in thy skirts is found the blood of the souls of the poor innocents: I have not found it by secret search, but upon all these."],[35,"Yet thou sayest, Because I am innocent, surely his anger shall turn from me. Behold, I will plead with thee, because thou sayest, I have not sinned."],[36,"Why gaddest thou about so much to change thy way? thou also shalt be ashamed of Egypt, as thou wast ashamed of Assyria."],[37,"Yea, thou shalt go forth from him, and thine hands upon thine head: for the LORD hath rejected thy confidences, and thou shalt not prosper in them."]]},{"id":"jer3","book":"Jeremiah 3","heading":"Return, Ye Backsliding Children","verses":[[1,"They say, If a man put away his wife, and she go from him, and become another man's, shall he return unto her again? shall not that land be greatly polluted? but thou hast played the harlot with many lovers; yet return again to me, saith the LORD."],[2,"Lift up thine eyes unto the high places, and see where thou hast not been lien with. In the ways hast thou sat for them, as the Arabian in the wilderness; and thou hast polluted the land with thy whoredoms and with thy wickedness."],[3,"Therefore the showers have been withholden, and there hath been no latter rain; and thou hadst a whore's forehead, thou refusedst to be ashamed."],[4,"Wilt thou not from this time cry unto me, My father, thou art the guide of my youth?"],[5,"Will he reserve his anger for ever? will he keep it to the end? Behold, thou hast spoken and done evil things as thou couldest."],[6,"The LORD said also unto me in the days of Josiah the king, Hast thou seen that which backsliding Israel hath done? she is gone up upon every high mountain and under every green tree, and there hath played the harlot."],[7,"And I said after she had done all these things, Turn thou unto me. But she returned not. And her treacherous sister Judah saw it."],[8,"And I saw, when for all the causes whereby backsliding Israel committed adultery I had put her away, and given her a bill of divorce; yet her treacherous sister Judah feared not, but went and played the harlot also."],[9,"And it came to pass through the lightness of her whoredom, that she defiled the land, and committed adultery with stones and with stocks."],[10,"And yet for all this her treacherous sister Judah hath not turned unto me with her whole heart, but feignedly, saith the LORD."],[11,"And the LORD said unto me, The backsliding Israel hath justified herself more than treacherous Judah."],[12,"Go and proclaim these words toward the north, and say, Return, thou backsliding Israel, saith the LORD; and I will not cause mine anger to fall upon you: for I am merciful, saith the LORD, and I will not keep anger for ever."],[13,"Only acknowledge thine iniquity, that thou hast transgressed against the LORD thy God, and hast scattered thy ways to the strangers under every green tree, and ye have not obeyed my voice, saith the LORD."],[14,"Turn, O backsliding children, saith the LORD; for I am married unto you: and I will take you one of a city, and two of a family, and I will bring you to Zion:"],[15,"And I will give you pastors according to mine heart, which shall feed you with knowledge and understanding."],[16,"And it shall come to pass, when ye be multiplied and increased in the land, in those days, saith the LORD, they shall say no more, The ark of the covenant of the LORD: neither shall it come to mind: neither shall they remember it; neither shall they visit it; neither shall that be done any more."],[17,"At that time they shall call Jerusalem the throne of the LORD; and all the nations shall be gathered unto it, to the name of the LORD, to Jerusalem: neither shall they walk any more after the imagination of their evil heart."],[18,"In those days the house of Judah shall walk with the house of Israel, and they shall come together out of the land of the north to the land that I have given for an inheritance unto your fathers."],[19,"But I said, How shall I put thee among the children, and give thee a pleasant land, a goodly heritage of the hosts of nations? and I said, Thou shalt call me, My father; and shalt not turn away from me."],[20,"Surely as a wife treacherously departeth from her husband, so have ye dealt treacherously with me, O house of Israel, saith the LORD."],[21,"A voice was heard upon the high places, weeping and supplications of the children of Israel: for they have perverted their way, and they have forgotten the LORD their God."],[22,"Return, ye backsliding children, and I will heal your backslidings. Behold, we come unto thee; for thou art the LORD our God."],[23,"Truly in vain is salvation hoped for from the hills, and from the multitude of mountains: truly in the LORD our God is the salvation of Israel."],[24,"For shame hath devoured the labour of our fathers from our youth; their flocks and their herds, their sons and their daughters."],[25,"We lie down in our shame, and our confusion covereth us: for we have sinned against the LORD our God, we and our fathers, from our youth even unto this day, and have not obeyed the voice of the LORD our God."]]},{"id":"jer7","book":"Jeremiah 7","heading":"Amend Your Ways","verses":[[1,"The word that came to Jeremiah from the LORD, saying,"],[2,"Stand in the gate of the LORD'S house, and proclaim there this word, and say, Hear the word of the LORD, all ye of Judah, that enter in at these gates to worship the LORD."],[3,"Thus saith the LORD of hosts, the God of Israel, Amend your ways and your doings, and I will cause you to dwell in this place."],[4,"Trust ye not in lying words, saying, The temple of the LORD, The temple of the LORD, The temple of the LORD, are these."],[5,"For if ye throughly amend your ways and your doings; if ye throughly execute judgment between a man and his neighbour;"],[6,"If ye oppress not the stranger, the fatherless, and the widow, and shed not innocent blood in this place, neither walk after other gods to your hurt:"],[7,"Then will I cause you to dwell in this place, in the land that I gave to your fathers, for ever and ever."],[8,"Behold, ye trust in lying words, that cannot profit."],[9,"Will ye steal, murder, and commit adultery, and swear falsely, and burn incense unto Baal, and walk after other gods whom ye know not;"],[10,"And come and stand before me in this house, which is called by my name, and say, We are delivered to do all these abominations?"],[11,"Is this house, which is called by my name, become a den of robbers in your eyes? Behold, even I have seen it, saith the LORD."],[12,"But go ye now unto my place which was in Shiloh, where I set my name at the first, and see what I did to it for the wickedness of my people Israel."],[13,"And now, because ye have done all these works, saith the LORD, and I spake unto you, rising up early and speaking, but ye heard not; and I called you, but ye answered not;"],[14,"Therefore will I do unto this house, which is called by my name, wherein ye trust, and unto the place which I gave to you and to your fathers, as I have done to Shiloh."],[15,"And I will cast you out of my sight, as I have cast out all your brethren, even the whole seed of Ephraim."],[16,"Therefore pray not thou for this people, neither lift up cry nor prayer for them, neither make intercession to me: for I will not hear thee."],[17,"Seest thou not what they do in the cities of Judah and in the streets of Jerusalem?"],[18,"The children gather wood, and the fathers kindle the fire, and the women knead their dough, to make cakes to the queen of heaven, and to pour out drink offerings unto other gods, that they may provoke me to anger."],[19,"Do they provoke me to anger? saith the LORD: do they not provoke themselves to the confusion of their own faces?"],[20,"Therefore thus saith the Lord GOD; Behold, mine anger and my fury shall be poured out upon this place, upon man, and upon beast, and upon the trees of the field, and upon the fruit of the ground; and it shall burn, and shall not be quenched."],[21,"Thus saith the LORD of hosts, the God of Israel; Put your burnt offerings unto your sacrifices, and eat flesh."],[22,"For I spake not unto your fathers, nor commanded them in the day that I brought them out of the land of Egypt, concerning burnt offerings or sacrifices:"],[23,"But this thing commanded I them, saying, Obey my voice, and I will be your God, and ye shall be my people: and walk ye in all the ways that I have commanded you, that it may be well unto you."],[24,"But they hearkened not, nor inclined their ear, but walked in the counsels and in the imagination of their evil heart, and went backward, and not forward."],[25,"Since the day that your fathers came forth out of the land of Egypt unto this day I have even sent unto you all my servants the prophets, daily rising up early and sending them:"],[26,"Yet they hearkened not unto me, nor inclined their ear, but hardened their neck: they did worse than their fathers."],[27,"Therefore thou shalt speak all these words unto them; but they will not hearken to thee: thou shalt also call unto them; but they will not answer thee."],[28,"But thou shalt say unto them, This is a nation that obeyeth not the voice of the LORD their God, nor receiveth correction: truth is perished, and is cut off from their mouth."],[29,"Cut off thine hair, O Jerusalem, and cast it away, and take up a lamentation on high places; for the LORD hath rejected and forsaken the generation of his wrath."],[30,"For the children of Judah have done evil in my sight, saith the LORD: they have set their abominations in the house which is called by my name, to pollute it."],[31,"And they have built the high places of Tophet, which is in the valley of the son of Hinnom, to burn their sons and their daughters in the fire; which I commanded them not, neither came it into my heart."],[32,"Therefore, behold, the days come, saith the LORD, that it shall no more be called Tophet, nor the valley of the son of Hinnom, but the valley of slaughter: for they shall bury in Tophet, till there be no place."],[33,"And the carcases of this people shall be meat for the fowls of the heaven, and for the beasts of the earth; and none shall fray them away."],[34,"Then will I cause to cease from the cities of Judah, and from the streets of Jerusalem, the voice of mirth, and the voice of gladness, the voice of the bridegroom, and the voice of the bride: for the land shall be desolate."]]},{"id":"jer16","book":"Jeremiah 16","heading":"The Lord Liveth That Brought Up Israel","verses":[[1,"The word of the LORD came also unto me, saying,"],[2,"Thou shalt not take thee a wife, neither shalt thou have sons or daughters in this place."],[3,"For thus saith the LORD concerning the sons and concerning the daughters that are born in this place, and concerning their mothers that bare them, and concerning their fathers that begat them in this land;"],[4,"They shall die of grievous deaths; they shall not be lamented; neither shall they be buried; but they shall be as dung upon the face of the earth: and they shall be consumed by the sword, and by famine; and their carcases shall be meat for the fowls of heaven, and for the beasts of the earth."],[5,"For thus saith the LORD, Enter not into the house of mourning, neither go to lament nor bemoan them: for I have taken away my peace from this people, saith the LORD, even lovingkindness and mercies."],[6,"Both the great and the small shall die in this land: they shall not be buried, neither shall men lament for them, nor cut themselves, nor make themselves bald for them:"],[7,"Neither shall men tear themselves for them in mourning, to comfort them for the dead; neither shall men give them the cup of consolation to drink for their father or for their mother."],[8,"Thou shalt not also go into the house of feasting, to sit with them to eat and to drink."],[9,"For thus saith the LORD of hosts, the God of Israel; Behold, I will cause to cease out of this place in your eyes, and in your days, the voice of mirth, and the voice of gladness, the voice of the bridegroom, and the voice of the bride."],[10,"And it shall come to pass, when thou shalt shew this people all these words, and they shall say unto thee, Wherefore hath the LORD pronounced all this great evil against us? or what is our iniquity? or what is our sin that we have committed against the LORD our God?"],[11,"Then shalt thou say unto them, Because your fathers have forsaken me, saith the LORD, and have walked after other gods, and have served them, and have worshipped them, and have forsaken me, and have not kept my law;"],[12,"And ye have done worse than your fathers; for, behold, ye walk every one after the imagination of his evil heart, that they may not hearken unto me:"],[13,"Therefore will I cast you out of this land into a land that ye know not, neither ye nor your fathers; and there shall ye serve other gods day and night; where I will not shew you favour."],[14,"Therefore, behold, the days come, saith the LORD, that it shall no more be said, The LORD liveth, that brought up the children of Israel out of the land of Egypt;"],[15,"But, The LORD liveth, that brought up the children of Israel from the land of the north, and from all the lands whither he had driven them: and I will bring them again into their land that I gave unto their fathers."],[16,"Behold, I will send for many fishers, saith the LORD, and they shall fish them; and after will I send for many hunters, and they shall hunt them from every mountain, and from every hill, and out of the holes of the rocks."],[17,"For mine eyes are upon all their ways: they are not hid from my face, neither is their iniquity hid from mine eyes."],[18,"And first I will recompense their iniquity and their sin double; because they have defiled my land, they have filled mine inheritance with the carcases of their detestable and abominable things."],[19,"O LORD, my strength, and my fortress, and my refuge in the day of affliction, the Gentiles shall come unto thee from the ends of the earth, and shall say, Surely our fathers have inherited lies, vanity, and things wherein there is no profit."],[20,"Shall a man make gods unto himself, and they are no gods?"],[21,"Therefore, behold, I will this once cause them to know, I will cause them to know mine hand and my might; and they shall know that my name is The LORD."]]},{"id":"jer17","book":"Jeremiah 17","heading":"Blessed Is the Man That Trusteth in the Lord","verses":[[1,"The sin of Judah is written with a pen of iron, and with the point of a diamond: it is graven upon the table of their heart, and upon the horns of your altars;"],[2,"Whilst their children remember their altars and their groves by the green trees upon the high hills."],[3,"O my mountain in the field, I will give thy substance and all thy treasures to the spoil, and thy high places for sin, throughout all thy borders."],[4,"And thou, even thyself, shalt discontinue from thine heritage that I gave thee; and I will cause thee to serve thine enemies in the land which thou knowest not: for ye have kindled a fire in mine anger, which shall burn for ever."],[5,"Thus saith the LORD; Cursed be the man that trusteth in man, and maketh flesh his arm, and whose heart departeth from the LORD."],[6,"For he shall be like the heath in the desert, and shall not see when good cometh; but shall inhabit the parched places in the wilderness, in a salt land and not inhabited."],[7,"Blessed is the man that trusteth in the LORD, and whose hope the LORD is."],[8,"For he shall be as a tree planted by the waters, and that spreadeth out her roots by the river, and shall not see when heat cometh, but her leaf shall be green; and shall not be careful in the year of drought, neither shall cease from yielding fruit."],[9,"The heart is deceitful above all things, and desperately wicked: who can know it?"],[10,"I the LORD search the heart, I try the reins, even to give every man according to his ways, and according to the fruit of his doings."],[11,"As the partridge sitteth on eggs, and hatcheth them not; so he that getteth riches, and not by right, shall leave them in the midst of his days, and at his end shall be a fool."],[12,"A glorious high throne from the beginning is the place of our sanctuary."],[13,"O LORD, the hope of Israel, all that forsake thee shall be ashamed, and they that depart from me shall be written in the earth, because they have forsaken the LORD, the fountain of living waters."],[14,"Heal me, O LORD, and I shall be healed; save me, and I shall be saved: for thou art my praise."],[15,"Behold, they say unto me, Where is the word of the LORD? let it come now."],[16,"As for me, I have not hastened from being a pastor to follow thee: neither have I desired the woeful day; thou knowest: that which came out of my lips was right before thee."],[17,"Be not a terror unto me: thou art my hope in the day of evil."],[18,"Let them be confounded that persecute me, but let not me be confounded: let them be dismayed, but let not me be dismayed: bring upon them the day of evil, and destroy them with double destruction."],[19,"Thus said the LORD unto me; Go and stand in the gate of the children of the people, whereby the kings of Judah come in, and by the which they go out, and in all the gates of Jerusalem;"],[20,"And say unto them, Hear ye the word of the LORD, ye kings of Judah, and all Judah, and all the inhabitants of Jerusalem, that enter in by these gates:"],[21,"Thus saith the LORD; Take heed to yourselves, and bear no burden on the sabbath day, nor bring it in by the gates of Jerusalem;"],[22,"Neither carry forth a burden out of your houses on the sabbath day, neither do ye any work, but hallow ye the sabbath day, as I commanded your fathers."],[23,"But they obeyed not, neither inclined their ear, but made their neck stiff, that they might not hear, nor receive instruction."],[24,"And it shall come to pass, if ye diligently hearken unto me, saith the LORD, to bring in no burden through the gates of this city on the sabbath day, but hallow the sabbath day, to do no work therein;"],[25,"Then shall there enter into the gates of this city kings and princes sitting upon the throne of David, riding in chariots and on horses, they, and their princes, the men of Judah, and the inhabitants of Jerusalem: and this city shall remain for ever."],[26,"And they shall come from the cities of Judah, and from the places about Jerusalem, and from the land of Benjamin, and from the plain, and from the mountains, and from the south, bringing burnt offerings, and sacrifices, and meat offerings, and incense, and bringing sacrifices of praise, unto the house of the LORD."],[27,"But if ye will not hearken unto me to hallow the sabbath day, and not to bear a burden, even entering in at the gates of Jerusalem on the sabbath day; then will I kindle a fire in the gates thereof, and it shall devour the palaces of Jerusalem, and it shall not be quenched."]]},{"id":"jer18","book":"Jeremiah 18","heading":"As the Clay Is in the Potter's Hand","verses":[[1,"The word which came to Jeremiah from the LORD, saying,"],[2,"Arise, and go down to the potter's house, and there I will cause thee to hear my words."],[3,"Then I went down to the potter's house, and, behold, he wrought a work on the wheels."],[4,"And the vessel that he made of clay was marred in the hand of the potter: so he made it again another vessel, as seemed good to the potter to make it."],[5,"Then the word of the LORD came to me, saying,"],[6,"O house of Israel, cannot I do with you as this potter? saith the LORD. Behold, as the clay is in the potter's hand, so are ye in mine hand, O house of Israel."],[7,"At what instant I shall speak concerning a nation, and concerning a kingdom, to pluck up, and to pull down, and to destroy it;"],[8,"If that nation, against whom I have pronounced, turn from their evil, I will repent of the evil that I thought to do unto them."],[9,"And at what instant I shall speak concerning a nation, and concerning a kingdom, to build and to plant it;"],[10,"If it do evil in my sight, that it obey not my voice, then I will repent of the good, wherewith I said I would benefit them."],[11,"Now therefore go to, speak to the men of Judah, and to the inhabitants of Jerusalem, saying, Thus saith the LORD; Behold, I frame evil against you, and devise a device against you: return ye now every one from his evil way, and make your ways and your doings good."],[12,"And they said, There is no hope: but we will walk after our own devices, and we will every one do the imagination of his evil heart."],[13,"Therefore thus saith the LORD; Ask ye now among the heathen, who hath heard such things: the virgin of Israel hath done a very horrible thing."],[14,"Will a man leave the snow of Lebanon which cometh from the rock of the field? or shall the cold flowing waters that come from another place be forsaken?"],[15,"Because my people hath forgotten me, they have burned incense to vanity, and they have caused them to stumble in their ways from the ancient paths, to walk in paths, in a way not cast up;"],[16,"To make their land desolate, and a perpetual hissing; every one that passeth thereby shall be astonished, and wag his head."],[17,"I will scatter them as with an east wind before the enemy; I will shew them the back, and not the face, in the day of their calamity."],[18,"Then said they, Come, and let us devise devices against Jeremiah; for the law shall not perish from the priest, nor counsel from the wise, nor the word from the prophet. Come, and let us smite him with the tongue, and let us not give heed to any of his words."],[19,"Give heed to me, O LORD, and hearken to the voice of them that contend with me."],[20,"Shall evil be recompensed for good? for they have digged a pit for my soul. Remember that I stood before thee to speak good for them, and to turn away thy wrath from them."],[21,"Therefore deliver up their children to the famine, and pour out their blood by the force of the sword; and let their wives be bereaved of their children, and be widows; and let their men be put to death; let their young men be slain by the sword in battle."],[22,"Let a cry be heard from their houses, when thou shalt bring a troop suddenly upon them: for they have digged a pit to take me, and hid snares for my feet."],[23,"Yet, LORD, thou knowest all their counsel against me to slay me: forgive not their iniquity, neither blot out their sin from thy sight, but let them be overthrown before thee; deal thus with them in the time of thine anger."]]},{"id":"jer20","book":"Jeremiah 20","heading":"His Word Was as a Burning Fire","verses":[[1,"Now Pashur the son of Immer the priest, who was also chief governor in the house of the LORD, heard that Jeremiah prophesied these things."],[2,"Then Pashur smote Jeremiah the prophet, and put him in the stocks that were in the high gate of Benjamin, which was by the house of the LORD."],[3,"And it came to pass on the morrow, that Pashur brought forth Jeremiah out of the stocks. Then said Jeremiah unto him, The LORD hath not called thy name Pashur, but Magormissabib."],[4,"For thus saith the LORD, Behold, I will make thee a terror to thyself, and to all thy friends: and they shall fall by the sword of their enemies, and thine eyes shall behold it: and I will give all Judah into the hand of the king of Babylon, and he shall carry them captive into Babylon, and shall slay them with the sword."],[5,"Moreover I will deliver all the strength of this city, and all the labours thereof, and all the precious things thereof, and all the treasures of the kings of Judah will I give into the hand of their enemies, which shall spoil them, and take them, and carry them to Babylon."],[6,"And thou, Pashur, and all that dwell in thine house shall go into captivity: and thou shalt come to Babylon, and there thou shalt die, and shalt be buried there, thou, and all thy friends, to whom thou hast prophesied lies."],[7,"O LORD, thou hast deceived me, and I was deceived: thou art stronger than I, and hast prevailed: I am in derision daily, every one mocketh me."],[8,"For since I spake, I cried out, I cried violence and spoil; because the word of the LORD was made a reproach unto me, and a derision, daily."],[9,"Then I said, I will not make mention of him, nor speak any more in his name. But his word was in mine heart as a burning fire shut up in my bones, and I was weary with forbearing, and I could not stay."],[10,"For I heard the defaming of many, fear on every side. Report, say they, and we will report it. All my familiars watched for my halting, saying, Peradventure he will be enticed, and we shall prevail against him, and we shall take our revenge on him."],[11,"But the LORD is with me as a mighty terrible one: therefore my persecutors shall stumble, and they shall not prevail: they shall be greatly ashamed; for they shall not prosper: their everlasting confusion shall never be forgotten."],[12,"But, O LORD of hosts, that triest the righteous, and seest the reins and the heart, let me see thy vengeance on them: for unto thee have I opened my cause."],[13,"Sing unto the LORD, praise ye the LORD: for he hath delivered the soul of the poor from the hand of evildoers."],[14,"Cursed be the day wherein I was born: let not the day wherein my mother bare me be blessed."],[15,"Cursed be the man who brought tidings to my father, saying, A man child is born unto thee; making him very glad."],[16,"And let that man be as the cities which the LORD overthrew, and repented not: and let him hear the cry in the morning, and the shouting at noontide;"],[17,"Because he slew me not from the womb; or that my mother might have been my grave, and her womb to be always great with me."],[18,"Wherefore came I forth out of the womb to see labour and sorrow, that my days should be consumed with shame?"]]}];
