<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Come, Follow Me — Old Testament 2026</title>
<style>
  :root{
    --paper: #F7F3EA;
    --paper-dim: #EFE9D8;
    --ink: #3D3A34;
    --ink-soft: #6b6657;
    --indigo: #2B2E4A;
    --walnut: #8B5E3C;
    --gold: #C9A063;
    --rule: #d9d0b8;
    --focus: #C9A063;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0; height:100%;}
  body{
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
    height: 100vh;
    overflow: hidden;
  }
  .display{ font-family: 'Source Serif 4', Georgia, serif; }

  /* ============ VIEW SWITCHING ============ */
  .view{ display: none; height: 100vh; }
  .view.active{ display: flex; flex-direction: column; }

  /* ============ PICKER VIEW ============ */
  #pickerView{
    overflow-y: auto;
  }
  .picker-wrap{
    max-width: 1100px;
    margin: 0 auto;
    padding: 40px 48px 60px;
    width: 100%;
  }
  .picker-header{
    border-bottom: 2px solid var(--ink);
    padding-bottom: 20px;
    margin-bottom: 36px;
  }
  .picker-eyebrow{
    font-size: 0.95rem; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--walnut); font-weight: 700; margin-bottom: 6px;
  }
  .picker-header h1{ font-size: 2.2rem; margin: 0; font-weight: 600; }
  .picker-sub{ color: var(--ink-soft); font-size: 1.05rem; margin-top: 8px; }

  .week-grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 18px;
  }
  .week-card{
    display: block;
    text-align: left;
    text-decoration: none;
    color: var(--ink);
    background: var(--paper-dim);
    border: 2px solid var(--rule);
    border-radius: 10px;
    padding: 22px 24px;
    cursor: pointer;
    font-family: inherit;
    transition: border-color 0.15s ease;
  }
  .week-card:hover, .week-card:focus{
    outline: none;
    border-color: var(--walnut);
    box-shadow: 0 0 0 3px var(--focus);
  }
  .week-card .dates{
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--walnut);
    letter-spacing: 0.03em;
    margin-bottom: 6px;
  }
  .week-card .week-title{
    font-family: 'Source Serif 4', Georgia, serif;
    font-size: 1.3rem;
    font-weight: 600;
    margin-bottom: 8px;
    line-height: 1.25;
  }
  .week-card .week-ref{
    font-size: 0.9rem;
    color: var(--ink-soft);
  }

  .coming-soon{
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px dashed var(--rule);
    border-radius: 10px;
    padding: 22px 24px;
    color: var(--ink-soft);
    font-size: 0.95rem;
    text-align: center;
  }

  .picker-footer{
    margin-top: 44px;
    padding-top: 20px;
    border-top: 1px solid var(--rule);
    color: var(--ink-soft);
    font-size: 0.9rem;
  }

  /* ============ READER VIEW ============ */
  #readerView .app{
    max-width: 1300px;
    margin: 0 auto;
    padding: 18px 36px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    width: 100%;
  }

  .topbar{
    display:flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    flex: 0 0 auto;
    margin-bottom: 6px;
  }
  .topbar .title-block{ flex: 0 0 auto; min-width: 0; }

  .back-link{
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--ink);
    text-decoration: none;
    margin-bottom: 8px;
    padding: 7px 14px;
    border: 2px solid var(--rule);
    border-radius: 7px;
    background: var(--paper);
    cursor: pointer;
    font-family: inherit;
  }
  .back-link svg{ width: 16px; height: 16px; flex: 0 0 auto; }
  .back-link:hover{ border-color: var(--walnut); color: var(--walnut); }
  .back-link:focus{
    outline: none;
    border-color: var(--walnut);
    color: var(--walnut);
    box-shadow: 0 0 0 4px var(--focus);
  }

  .topbar .eyebrow{
    font-size: 0.78rem; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--walnut); font-weight: 700;
  }
  .topbar h1{
    font-size: 1.15rem; margin:0; font-weight:600; line-height:1.2;
    white-space: nowrap; overflow:hidden; text-overflow: ellipsis;
  }
  .week-range{
    font-size: 0.85rem;
    color: var(--ink-soft);
    margin: 2px 0 10px;
  }
  .day-range{
    font-size: 0.85rem;
    color: var(--ink-soft);
    text-align: right;
    margin-top: 4px;
  }

  .day-nav{
    display:flex;
    gap: 8px;
    flex: 1 1 auto;
    justify-content: flex-end;
  }
  .day-chip{
    flex: 0 0 auto;
    text-align: center;
    padding: 8px 13px;
    border-radius: 7px;
    border: 2px solid var(--rule);
    background: var(--paper);
    color: var(--ink);
    font-size: 0.92rem;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
  }
  .day-chip.active{
    background: var(--walnut);
    border-color: var(--walnut);
    color: var(--paper);
  }
  .day-chip.done{ border-color: var(--gold); }
  .day-chip:focus{ outline:none; box-shadow: 0 0 0 4px var(--focus); }

  .reader-card{
    background: var(--indigo);
    color: var(--paper);
    border-radius: 14px;
    padding: 4vh 6vw;
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    position: relative;
    margin-bottom: 14px;
    overflow: hidden;
  }
  .reader-book{
    font-size: clamp(0.75rem, 1.1vw, 0.95rem);
    color: var(--gold);
    font-weight: 700;
    letter-spacing: 0.03em;
    margin-bottom: 2.5vh;
    flex: 0 0 auto;
    opacity: 0.85;
  }
  .reader-text{
    font-size: clamp(2rem, 5.5vw, 4.2rem);
    line-height: 1.45;
    font-family: 'Source Serif 4', Georgia, serif;
    overflow-y: auto;
  }

  .reader-controls{
    display:flex;
    align-items:center;
    justify-content: space-between;
    gap: 16px;
    flex: 0 0 auto;
  }
  .nav-btn{
    flex: 0 0 auto;
    display:flex; align-items:center; gap: 10px;
    padding: 14px 26px;
    border-radius: 8px;
    border: 2px solid var(--indigo);
    background: var(--paper);
    color: var(--indigo);
    font-size: 1.05rem;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
  }
  .nav-btn:disabled{ opacity: 0.35; cursor: default; }
  .nav-btn:focus{ outline:none; box-shadow: 0 0 0 4px var(--focus); }
  .nav-btn svg{ width: 20px; height: 20px; }

  .progress{
    flex: 1;
    text-align: center;
    color: var(--ink-soft);
    font-size: 0.95rem;
    font-weight: 600;
  }
  .progress-bar{
    height: 5px;
    border-radius: 3px;
    background: var(--rule);
    margin-top: 6px;
    overflow: hidden;
  }
  .progress-fill{
    height: 100%;
    background: var(--walnut);
    border-radius: 3px;
    transition: width 0.2s ease;
  }

  .jump-toggle-row{ flex: 0 0 auto; text-align: center; margin-top: 6px; }
  .jump-toggle{
    background: none; border: none; color: var(--ink-soft);
    font-family: inherit; font-size: 0.85rem; font-weight: 600;
    text-decoration: underline; cursor: pointer; padding: 6px 10px;
  }
  .jump-toggle:focus{ outline:none; box-shadow: 0 0 0 3px var(--focus); border-radius: 4px; }

  .jump-panel{ flex: 0 0 auto; max-height: 0; overflow: hidden; transition: max-height 0.2s ease; }
  .jump-panel.open{ max-height: 160px; overflow-y: auto; margin-top: 10px; }
  .jump-grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(50px, 1fr));
    gap: 6px;
  }
  .jump-btn{
    padding: 9px 0; text-align:center; border-radius: 6px;
    border: 1px solid var(--rule); background: var(--paper); color: var(--ink-soft);
    font-weight: 700; cursor: pointer; font-family: inherit; font-size: 0.9rem;
  }
  .jump-btn.current{ background: var(--gold); color: var(--indigo); border-color: var(--gold); }
  .jump-btn:focus{ outline:none; box-shadow: 0 0 0 3px var(--focus); }


  /* Reader label shown above verse block */

  /* Verse block: multiple verses stacked */
  .verse-block{ overflow-y: auto; flex: 1 1 auto; min-height: 0; }
  .verse-item{
    display: flex;
    gap: 16px;
    margin-bottom: 1.4vh;
    align-items: baseline;
  }
  .verse-item .vnum{
    flex: 0 0 auto;
    font-size: clamp(0.8rem, 1.2vw, 1rem);
    font-weight: 800;
    color: var(--gold);
    opacity: 0.75;
    min-width: 2ch;
    text-align: right;
  }
  .verse-item .vtext{
    flex: 1;
    font-size: clamp(1.4rem, 3.2vw, 2.6rem);
    line-height: 1.45;
    font-family: 'Source Serif 4', Georgia, serif;
  }

  /* Reader count control */
  .reader-count-row{
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 8px;
    justify-content: center;
  }
  .reader-count-label{
    font-size: 0.88rem;
    color: var(--ink-soft);
    font-weight: 600;
  }
  .reader-count-btn{
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 2px solid var(--rule);
    background: var(--paper);
    color: var(--ink);
    font-size: 1.1rem;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    display: flex; align-items: center; justify-content: center;
  }
  .reader-count-btn:focus{ outline:none; box-shadow: 0 0 0 3px var(--focus); }
  .reader-count-display{
    font-size: 1rem;
    font-weight: 700;
    color: var(--ink);
    min-width: 80px;
    text-align: center;
  }

  @media (max-width: 700px){
    .picker-wrap{ padding: 24px 20px 50px; }
    .week-grid{ grid-template-columns: 1fr; }
    #readerView .app{ padding: 12px 16px; }
    .topbar{ flex-wrap: wrap; }
    .day-nav{ width: 100%; justify-content: space-between; }
    .day-chip{ flex: 1 1 0; padding: 8px 4px; font-size: 0.82rem; }
    .day-range{ text-align: left; }
    .reader-card{ padding: 4vh 6vw; }
    .reader-text{ font-size: clamp(1.4rem, 6vw, 2.2rem); }
    .nav-btn{ padding: 12px 16px; font-size: 0.95rem; }
  }
</style>
</head>
<body>

<!-- ============ PICKER VIEW ============ -->
<div class="view active" id="pickerView">
  <div class="picker-wrap">
    <div class="picker-header">
      <div class="picker-eyebrow">Come, Follow Me · Old Testament 2026</div>
      <h1 class="display">Choose a Week</h1>

    </div>
    <div class="week-grid" id="weekGrid"></div>
    <div class="picker-footer">
      Scripture text is the King James Version, public domain in the United States.
    </div>
  </div>
</div>

<!-- ============ READER VIEW ============ -->
<div class="view" id="readerView">
  <div class="app">

    <div class="topbar">
      <div class="title-block">
        <button class="back-link" id="backBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
          All weeks
        </button>
        <div class="eyebrow" id="weekEyebrow">&nbsp;</div>
        <h1 class="display" id="weekTitle">&nbsp;</h1>
        <div class="week-range" id="weekRange">&nbsp;</div>
      </div>
      <div>
        <div class="day-nav" id="dayNav"></div>
        <div class="day-range" id="dayRange">&nbsp;</div>
      </div>
    </div>

    <div class="reader-card">
      <div class="reader-book" id="readerBook">—</div>
      <div class="reader-text" id="readerText">—</div>
    </div>

    <div class="reader-controls">
      <button class="nav-btn" id="prevBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
        Previous
      </button>
      <div class="progress">
        <span id="progressLabel">Verse 1 of 1</span>
        <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
      </div>
      <button class="nav-btn" id="nextBtn">
        Next
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </button>
    </div>

    <div class="jump-toggle-row">
      <button class="jump-toggle" id="jumpToggle">Jump to verse</button>
    </div>
    <div class="jump-panel" id="jumpPanel">
      <div class="jump-grid" id="jumpGrid"></div>
    </div>

    <div class="reader-count-row">
      <span class="reader-count-label">Readers today:</span>
      <button class="reader-count-btn" id="readerCountDown">−</button>
      <span class="reader-count-display" id="readerCountDisplay">1 reader</span>
      <button class="reader-count-btn" id="readerCountUp">+</button>
    </div>

  </div>
</div>

// Registry of all weeks, in display order
const ALL_WEEKS = [
  { id: 'w37', week: WEEK_w37, passages: PASSAGES_w37 },
  { id: 'w38', week: WEEK_w38, passages: PASSAGES_w38 },
];

</script>
<script>
// ===================== App state =====================
let currentWeek = null;
let currentDays = null;
let currentDayIndex = 0;
let currentVerseIndex = 0;
let readerCounts = {};   // { dayIndex: N } — per-day reader count

const STORAGE_KEY_PREFIX = 'cfm-progress-';
const BLOCK_SIZE = 5;

function loadProgress(weekId){
  try { const raw = localStorage.getItem(STORAGE_KEY_PREFIX + weekId); return raw ? JSON.parse(raw) : {}; }
  catch(e){ return {}; }
}
function saveProgress(weekId, dayIdx){
  try { const prog = loadProgress(weekId); prog[dayIdx] = true; localStorage.setItem(STORAGE_KEY_PREFIX + weekId, JSON.stringify(prog)); }
  catch(e){ /* ignore */ }
}

// ===================== Day splitting (Sun 2x, Mon–Fri 1x, no Saturday) =====================
const ALL_DAY_NAMES    = ['Monday','Tuesday','Wednesday','Thursday','Friday','Sunday'];
const ALL_DAY_WEIGHTS  = [1,1,1,1,1,2];

function allocateByWeight(total, dayCount){
  const weights = ALL_DAY_WEIGHTS.slice(0, dayCount);
  const totalWeight = weights.reduce((a,b) => a+b, 0);
  const raw = weights.map(w => total * w / totalWeight);
  const floors = raw.map(Math.floor);
  let allocated = floors.reduce((a,b) => a+b, 0);
  const fracOrder = raw.map((r,i) => [r-floors[i], i]).sort((a,b) => b[0]-a[0]);
  const sizes = [...floors];
  for(let i = 0; i < total - allocated; i++) sizes[fracOrder[i][1]]++;
  if(sizes.some(s => s === 0) && dayCount > 1) return allocateByWeight(total, dayCount - 1);
  return { dayCount: sizes.length, sizes };
}

function computeDays(passages){
  const flat = [];
  passages.forEach(p => p.verses.forEach(v => flat.push({ book: p.book, heading: p.heading, num: v[0], text: v[1] })));
  const total = flat.length;
  const { dayCount, sizes } = allocateByWeight(total, Math.min(ALL_DAY_NAMES.length, Math.max(1, total)));
  const days = [];
  let idx = 0;
  for(let d = 0; d < dayCount; d++){
    days.push({ name: ALL_DAY_NAMES[d], verses: flat.slice(idx, idx + sizes[d]) });
    idx += sizes[d];
  }
  return days;
}

function formatVerseRef(v){
  if(v.book.includes(':')) return v.book;
  return v.book + ':' + v.num;
}
function dayRangeLabel(d){
  const first = d.verses[0], last = d.verses[d.verses.length - 1];
  if(first.book === last.book){
    if(first.book.includes(':')) return first.book;
    return first.book + ':' + first.num + '\u2013' + last.num;
  }
  return formatVerseRef(first) + ' \u2013 ' + formatVerseRef(last);
}

// ===================== Reader labelling =====================
function getReaderCount(dayIdx){ return readerCounts[dayIdx] || 1; }

// Which reader reads verse at position verseIdx within the day?
function readerForVerse(verseIdx, numReaders){
  return Math.floor(verseIdx / BLOCK_SIZE) % numReaders + 1;
}

// ===================== Picker view =====================
function buildPicker(){
  const grid = document.getElementById('weekGrid');
  grid.innerHTML = '';
  ALL_WEEKS.forEach(w => {
    const btn = document.createElement('button');
    btn.className = 'week-card';
    btn.innerHTML =
      '<div class="dates">' + w.week.dateRange + '</div>' +
      '<div class="week-title display">' + w.week.title + '</div>' +
      '<div class="week-ref">' + w.week.refLabel + '</div>';
    btn.addEventListener('click', () => openWeek(w.id));
    grid.appendChild(btn);
  });
  const soon = document.createElement('div');
  soon.className = 'coming-soon';
  soon.style.display = 'none';
  grid.appendChild(soon);
}

function showPicker(){
  document.getElementById('pickerView').classList.add('active');
  document.getElementById('readerView').classList.remove('active');
}
function showReader(){
  document.getElementById('pickerView').classList.remove('active');
  document.getElementById('readerView').classList.add('active');
}

// ===================== Reader view =====================
function openWeek(weekId){
  const entry = ALL_WEEKS.find(w => w.id === weekId);
  if(!entry) return;
  currentWeek = entry;
  currentDays = computeDays(entry.passages);
  currentDayIndex = 0;
  currentVerseIndex = 0;
  readerCounts = {};
  document.getElementById('weekEyebrow').textContent = 'Come, Follow Me \u00b7 ' + entry.week.dateRange;
  document.getElementById('weekTitle').textContent = entry.week.title;
  document.getElementById('weekRange').textContent = entry.week.refLabel;
  showReader();
  renderReader();
}

function buildDayNav(){
  const nav = document.getElementById('dayNav');
  nav.innerHTML = '';
  const progress = loadProgress(currentWeek.id);
  currentDays.forEach((d, idx) => {
    const chip = document.createElement('button');
    chip.className = 'day-chip' + (idx === currentDayIndex ? ' active' : '') + (progress[idx] ? ' done' : '');
    chip.textContent = d.name;
    chip.addEventListener('click', () => { currentDayIndex = idx; currentVerseIndex = 0; renderReader(); });
    nav.appendChild(chip);
  });
}

function renderReader(){
  const d = currentDays[currentDayIndex];
  const v = d.verses[currentVerseIndex];
  const numReaders = getReaderCount(currentDayIndex);
  const reader = readerForVerse(currentVerseIndex, numReaders);

  // Single status line: "Esther 1:8  ·  Reader 2" (reader omitted if only 1)
  const statusParts = [v.book + ':' + v.num];
  if(numReaders > 1) statusParts.push('Reader ' + reader);
  document.getElementById('readerBook').textContent = statusParts.join('  \u00b7  ');
  document.getElementById('readerText').textContent = v.text;

  document.getElementById('dayRange').textContent = d.name + ': ' + dayRangeLabel(d);

  const isFirst = currentVerseIndex === 0 && currentDayIndex === 0;
  const isLast  = currentVerseIndex === d.verses.length - 1 && currentDayIndex === currentDays.length - 1;
  document.getElementById('prevBtn').disabled = isFirst;
  document.getElementById('nextBtn').disabled = isLast;

  document.getElementById('progressLabel').textContent =
    d.name + ' \u00b7 Verse ' + (currentVerseIndex + 1) + ' of ' + d.verses.length;
  document.getElementById('progressFill').style.width =
    ((currentVerseIndex + 1) / d.verses.length * 100) + '%';

  // Jump grid — one button per verse, small reader label if multiple readers
  const grid = document.getElementById('jumpGrid');
  grid.innerHTML = '';
  d.verses.forEach((vv, idx) => {
    const btn = document.createElement('button');
    btn.className = 'jump-btn' + (idx === currentVerseIndex ? ' current' : '');
    if(numReaders > 1){
      const r = readerForVerse(idx, numReaders);
      btn.innerHTML = vv.num + '<div style="font-size:0.6rem;color:var(--ink-soft);font-weight:600">R' + r + '</div>';
    } else {
      btn.textContent = vv.num;
    }
    btn.addEventListener('click', () => { currentVerseIndex = idx; renderReader(); document.getElementById('jumpPanel').classList.remove('open'); });
    grid.appendChild(btn);
  });

  if(currentVerseIndex === d.verses.length - 1) saveProgress(currentWeek.id, currentDayIndex);

  // Reader count display
  document.getElementById('readerCountDisplay').textContent =
    numReaders === 1 ? '1 reader' : numReaders + ' readers';

  buildDayNav();
}

function goNext(){
  const d = currentDays[currentDayIndex];
  if(currentVerseIndex < d.verses.length - 1){ currentVerseIndex++; renderReader(); }
  else if(currentDayIndex < currentDays.length - 1){ currentDayIndex++; currentVerseIndex = 0; renderReader(); }
}
function goPrev(){
  if(currentVerseIndex > 0){ currentVerseIndex--; renderReader(); }
  else if(currentDayIndex > 0){ currentDayIndex--; currentVerseIndex = currentDays[currentDayIndex].verses.length - 1; renderReader(); }
}

document.getElementById('prevBtn').addEventListener('click', goPrev);
document.getElementById('nextBtn').addEventListener('click', goNext);
document.getElementById('backBtn').addEventListener('click', showPicker);

document.getElementById('readerCountDown').addEventListener('click', () => {
  const cur = getReaderCount(currentDayIndex);
  if(cur > 1){ readerCounts[currentDayIndex] = cur - 1; renderReader(); }
});
document.getElementById('readerCountUp').addEventListener('click', () => {
  const cur = getReaderCount(currentDayIndex);
  if(cur < 9){ readerCounts[currentDayIndex] = cur + 1; renderReader(); }
});

const jumpToggle = document.getElementById('jumpToggle');
const jumpPanel  = document.getElementById('jumpPanel');
jumpToggle.addEventListener('click', () => { jumpPanel.classList.toggle('open'); });

document.addEventListener('keydown', (e) => {
  if(!document.getElementById('readerView').classList.contains('active')) return;
  if(document.activeElement && (
    document.activeElement.classList.contains('jump-btn') ||
    document.activeElement.classList.contains('day-chip') ||
    document.activeElement.classList.contains('reader-count-btn')
  )) return;
  if(e.key === 'ArrowRight' || e.key === 'ArrowDown'){ e.preventDefault(); goNext(); }
  else if(e.key === 'ArrowLeft' || e.key === 'ArrowUp'){ e.preventDefault(); goPrev(); }
  else if(e.key === 'Escape' || e.key === 'Backspace'){ e.preventDefault(); showPicker(); }
});

buildPicker();
showPicker();

</script>
